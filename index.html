<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Joguinho — Top-Down Arena</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;color:#fff;user-select:none}
  #game{display:block;cursor:none;image-rendering:pixelated}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.85);z-index:10;text-align:center;padding:20px}
  #overlay h1{font-size:48px;color:#ffd700;margin-bottom:10px;text-shadow:0 0 20px #ffd700}
  #overlay p{font-size:18px;margin:6px 0;color:#ccc}
  #overlay button{margin-top:20px;padding:12px 30px;font-size:20px;background:#4a7c59;color:#fff;border:2px solid #ffd700;cursor:pointer;font-family:inherit}
  #overlay button:hover{background:#5a8c69}
  .hidden{display:none!important}
  .key{display:inline-block;background:#222;border:1px solid #555;padding:2px 8px;border-radius:4px;color:#ffd700}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay">
  <h1>JOGUINHO — TOP-DOWN ARENA</h1>
  <p><span class="key">WASD</span> mover · <span class="key">Mouse</span> mirar · <span class="key">Clique</span> atirar</p>
  <p><span class="key">1-9</span> trocar arma · <span class="key">Espaço</span> especial · <span class="key">Shift</span> dash</p>
  <p style="color:#888;margin-top:10px">Sobreviva às ondas. Pegue armas e curas dropadas. Derrote os bosses.</p>
  <p style="color:#888;font-size:14px">Soco e Katana têm munição infinita · Pegue a mesma arma de novo para recarregar</p>
  <button id="startBtn">INICIAR</button>
</div>
<script>
"use strict";

// ============================================================
// CORE / UTIL
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = window.innerWidth, H = window.innerHeight;
function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

const TAU = Math.PI*2;
const rnd = (a,b)=>a+Math.random()*(b-a);
const rndi = (a,b)=>Math.floor(rnd(a,b+1));
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp = (a,b,t)=>a+(b-a)*t;
const dist2 = (ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy};
const dist = (ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const ang = (ax,ay,bx,by)=>Math.atan2(by-ay,bx-ax);
// Deterministic hash for per-tile decoration (stable across frames)
const hash2 = (x,y)=>{
  let h = (x*374761393 + y*668265263) | 0;
  h = ((h ^ (h >> 13)) * 1274126177) | 0;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
};
function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y, x+w, y+h, r);
  c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r);
  c.arcTo(x, y, x+w, y, r);
  c.closePath();
}

// Input
const keys = {};
const mouse = { x:0, y:0, wx:0, wy:0, down:false, pressed:false };
window.addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()] = true;
  if(['1','2','3','4','5','6','7','8','9'].includes(e.key)){
    if(game?.levelUpOpen){
      const idx = parseInt(e.key) - 1;
      if(idx < game.levelUpOptions.length) game.pickLevelUp(idx);
    } else {
      game?.player?.switchWeapon(parseInt(e.key)-1);
    }
  }
  if(e.key === ' '){ game?.player?.useSpecial(); e.preventDefault(); }
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e=>{ mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', e=>{ mouse.down = true; mouse.pressed = true; });
canvas.addEventListener('mouseup', e=>{ mouse.down = false; });
canvas.addEventListener('contextmenu', e=>e.preventDefault());
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  if(!game || !game.player) return;
  if(game.levelUpOpen || game.gameOverState) return;
  const dir = e.deltaY > 0 ? 1 : -1;
  game.player.cycleWeapon(dir);
}, { passive:false });

// ============================================================
// PARTICLE SYSTEM (object pool)
// ============================================================
class Particle {
  constructor(){ this.alive=false; this.reset(); }
  reset(){
    this.x=0;this.y=0;this.vx=0;this.vy=0;this.life=0;this.maxLife=1;
    this.size=2;this.color='#fff';this.shrink=true;this.gravity=0;this.alpha=1;
    this.glow=false;this.type='circle';this.rot=0;this.vrot=0;
  }
}
class ParticleSystem {
  constructor(size=500){
    this.pool = [];
    for(let i=0;i<size;i++) this.pool.push(new Particle());
    this.size = size;
  }
  spawn(opts){
    for(let i=0;i<this.size;i++){
      const p = this.pool[i];
      if(!p.alive){
        p.reset(); p.alive = true;
        Object.assign(p, opts);
        p.maxLife = p.life;
        return p;
      }
    }
    return null;
  }
  update(dt){
    for(let i=0;i<this.size;i++){
      const p = this.pool[i];
      if(!p.alive) continue;
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vy += p.gravity*dt;
      p.vx *= 0.98; p.vy *= 0.98;
      p.rot += p.vrot*dt;
      p.life -= dt;
      if(p.life <= 0){ p.alive = false; }
    }
  }
  draw(cam){
    for(let i=0;i<this.size;i++){
      const p = this.pool[i];
      if(!p.alive) continue;
      const t = p.life / p.maxLife;
      const a = p.alpha * (p.shrink ? t : 1);
      ctx.globalAlpha = clamp(a, 0, 1);
      if(p.glow){ ctx.shadowBlur = 12; ctx.shadowColor = p.color; }
      ctx.fillStyle = p.color;
      const sx = p.x - cam.x, sy = p.y - cam.y;
      if(p.type === 'circle'){
        const s = p.size * (p.shrink ? t : 1);
        ctx.beginPath(); ctx.arc(sx, sy, Math.max(0.5,s), 0, TAU); ctx.fill();
      } else if(p.type === 'line'){
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.size * (p.shrink ? t : 1);
        ctx.beginPath();
        const len = p.size * 3;
        ctx.moveTo(sx - Math.cos(p.rot)*len, sy - Math.sin(p.rot)*len);
        ctx.lineTo(sx + Math.cos(p.rot)*len, sy + Math.sin(p.rot)*len);
        ctx.stroke();
      } else if(p.type === 'rect'){
        const s = p.size * (p.shrink?t:1);
        ctx.save(); ctx.translate(sx,sy); ctx.rotate(p.rot);
        ctx.fillRect(-s/2,-s/2,s,s); ctx.restore();
      }
      if(p.glow){ ctx.shadowBlur = 0; }
    }
    ctx.globalAlpha = 1;
  }
}

// ============================================================
// CAMERA
// ============================================================
class Camera {
  constructor(){ this.x=0;this.y=0;this.tx=0;this.ty=0;this.shake=0;this.zoom=1;this.tzoom=1; }
  follow(target){
    this.tx = target.x - W/(2*this.zoom);
    this.ty = target.y - H/(2*this.zoom);
    this.x = lerp(this.x, this.tx, 0.12);
    this.y = lerp(this.y, this.ty, 0.12);
    this.zoom = lerp(this.zoom, this.tzoom, 0.1);
    if(this.shake > 0){
      this.x += rnd(-this.shake, this.shake);
      this.y += rnd(-this.shake, this.shake);
      this.shake *= 0.88;
      if(this.shake < 0.1) this.shake = 0;
    }
  }
  doShake(s){ this.shake = Math.max(this.shake, s); }
}

// ============================================================
// DAMAGE NUMBERS
// ============================================================
const damageNumbers = [];
function spawnDamage(x,y,amount,color='#fff'){
  const text = typeof amount === 'string' ? amount : Math.round(amount);
  damageNumbers.push({ x, y, vy:-60, life:1, amount:text, color });
}
function updateDamage(dt){
  for(let i=damageNumbers.length-1;i>=0;i--){
    const d = damageNumbers[i];
    d.y += d.vy*dt; d.vy += 30*dt; d.life -= dt;
    if(d.life <= 0) damageNumbers.splice(i,1);
  }
}
function drawDamage(cam){
  ctx.font = 'bold 16px Courier New';
  ctx.textAlign = 'center';
  for(const d of damageNumbers){
    ctx.globalAlpha = clamp(d.life,0,1);
    ctx.fillStyle = '#000';
    ctx.fillText(d.amount, d.x-cam.x+1, d.y-cam.y+1);
    ctx.fillStyle = d.color;
    ctx.fillText(d.amount, d.x-cam.x, d.y-cam.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

// ============================================================
// BLOOD STAINS (FIFO max 50)
// ============================================================
const bloodStains = [];
function addBlood(x,y,color='#5a0000'){
  bloodStains.push({ x, y, r: rnd(8,16), color });
  if(bloodStains.length > 50) bloodStains.shift();
}
function drawBlood(cam){
  ctx.globalAlpha = 0.35;
  for(const b of bloodStains){
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x-cam.x, b.y-cam.y, b.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// MAP
// ============================================================
const MAP_W = 3000, MAP_H = 3000;
const TILE = 64;
class Obstacle {
  constructor(x,y,w,h,type='crate'){
    this.x=x;this.y=y;this.w=w;this.h=h;this.type=type;
    this.color = type==='crate' ? '#4a3728' : '#3a3a4a';
    this.alive = true;
    this.maxHp = type==='crate' ? 80 : Infinity;
    this.hp = this.maxHp;
    this.hitFlash = 0;
  }
  hit(dmg){
    if(!isFinite(this.maxHp) || !this.alive) return;
    this.hp -= dmg;
    this.hitFlash = 0.1;
    if(this.hp <= 0) this.destroy();
  }
  destroy(){
    if(!this.alive) return;
    this.alive = false;
    const cx = this.x + this.w/2, cy = this.y + this.h/2;
    // Crate fragment explosion
    for(let i=0;i<25;i++){
      const a = Math.random()*TAU;
      const sp = rnd(80, 280);
      game.particles.spawn({
        x:cx+rnd(-this.w/2,this.w/2), y:cy+rnd(-this.h/2,this.h/2),
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
        life:rnd(0.4,0.8), size:rnd(3,6),
        color: Math.random()<0.5?'#6a5040':'#4a3728', glow:false
      });
    }
    // Damage radius (fragments)
    const radius = 60, dmg = 18;
    for(const e of game.enemies){
      if(!e.alive) continue;
      const d = dist(cx, cy, e.x, e.y);
      if(d < radius) e.hurt(dmg*(1-d/radius), '#bb8855');
    }
    // Drop loot from crate
    const r = Math.random();
    if(r < 0.4){
      for(let i=0;i<rndi(2,4);i++){
        game.coins.push(new Coin(cx+rnd(-15,15), cy+rnd(-15,15), 1));
      }
    } else if(r < 0.6){
      game.drops.push(new HealthDrop(cx, cy, 20));
    } else if(r < 0.7){
      game.drops.push(new WeaponDrop(cx, cy, rndi(1, NUM_SLOTS-1)));
    } else {
      // Just coins
      game.coins.push(new Coin(cx, cy, 1));
    }
    game.camera.doShake(3);
  }
  update(dt){
    if(this.hitFlash > 0) this.hitFlash -= dt;
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    if(sx+this.w < 0 || sx > W || sy+this.h < 0 || sy > H) return;
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(sx+4, sy+4, this.w, this.h);
    // Body
    ctx.fillStyle = this.hitFlash>0 ? '#ffeebb' : this.color;
    ctx.fillRect(sx, sy, this.w, this.h);
    // Top highlight
    ctx.fillStyle = this.type==='crate' ? '#6a5040' : '#5a5a6a';
    ctx.fillRect(sx, sy, this.w, 6);
    ctx.fillRect(sx, sy, 6, this.h);
    // Border
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx, sy, this.w, this.h);
    if(this.type==='crate'){
      ctx.strokeStyle = '#2a1f18';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx, sy+this.h/2); ctx.lineTo(sx+this.w, sy+this.h/2);
      ctx.moveTo(sx+this.w/2, sy); ctx.lineTo(sx+this.w/2, sy+this.h);
      ctx.stroke();
      // Damage cracks
      if(this.hp < this.maxHp*0.5){
        ctx.strokeStyle = '#1a0f08';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx+5, sy+5); ctx.lineTo(sx+15, sy+12); ctx.lineTo(sx+8, sy+22);
        ctx.moveTo(sx+this.w-5, sy+this.h-5); ctx.lineTo(sx+this.w-15, sy+this.h-15);
        ctx.stroke();
      }
      // HP bar when damaged
      if(this.hp < this.maxHp){
        ctx.fillStyle = '#000';
        ctx.fillRect(sx, sy-7, this.w, 4);
        ctx.fillStyle = '#aa6633';
        ctx.fillRect(sx+1, sy-6, (this.w-2)*(this.hp/this.maxHp), 2);
      }
    }
  }
  collides(x,y,r){
    if(!this.alive) return false;
    const cx = clamp(x, this.x, this.x+this.w);
    const cy = clamp(y, this.y, this.y+this.h);
    return dist2(x,y,cx,cy) < r*r;
  }
}

// ============================================================
// COINS / BARRELS / DANGER ZONES
// ============================================================
class Coin {
  constructor(x, y, value=1){
    this.x = x; this.y = y; this.value = value;
    this.t = Math.random()*TAU;
    this.alive = true;
    this.vx = rnd(-80, 80);
    this.vy = rnd(-180, -60);
    this.gravity = 380;
    this.bounce = 0;
    this.life = 25;
    this.attracted = false;
  }
  update(dt){
    this.t += dt*8;
    this.life -= dt;
    if(this.life <= 0){ this.alive = false; return; }
    const p = game.player;
    const dToP = dist(this.x, this.y, p.x, p.y);
    // Magnet effect
    if(dToP < 110 || this.attracted){
      this.attracted = true;
      const a = ang(this.x, this.y, p.x, p.y);
      const sp = clamp(380 - dToP*1.2, 180, 500);
      this.vx = lerp(this.vx, Math.cos(a)*sp, 0.35);
      this.vy = lerp(this.vy, Math.sin(a)*sp, 0.35);
      this.gravity = 0;
    } else {
      this.vy += this.gravity*dt;
      this.vx *= 0.96;
    }
    this.x += this.vx*dt;
    this.y += this.vy*dt;
    if(dToP < 22){
      p.coins += this.value;
      p.gainXP(2 * this.value);
      spawnDamage(this.x, this.y-10, '+'+this.value, '#ffd700');
      for(let i=0;i<5;i++){
        const a = Math.random()*TAU;
        game.particles.spawn({
          x:this.x, y:this.y, vx:Math.cos(a)*120, vy:Math.sin(a)*120,
          life:0.3, size:rnd(1,3), color:'#ffd700', glow:true
        });
      }
      this.alive = false;
    }
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    if(sx<-20||sx>W+20||sy<-20||sy>H+20) return;
    const flicker = Math.abs(Math.sin(this.t));
    const blink = this.life < 5 ? (Math.sin(this.life*8)*0.5+0.5) : 1;
    ctx.save();
    ctx.globalAlpha = blink;
    ctx.translate(sx, sy);
    const scaleX = Math.cos(this.t)*0.6 + 0.4;
    ctx.scale(Math.max(0.2, scaleX), 1);
    ctx.shadowBlur = 8; ctx.shadowColor = '#ffd700';
    ctx.fillStyle = '#ffd700';
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath(); ctx.arc(-1, -1, 2, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(255,255,200,${flicker*0.6})`;
    ctx.fillRect(-1, -3, 2, 6);
    ctx.restore();
    if(this.value > 1){
      ctx.font = 'bold 9px Courier New';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#000';
      ctx.fillText(this.value, sx+1, sy-9+1);
      ctx.fillStyle = '#ffd700';
      ctx.fillText(this.value, sx, sy-9);
      ctx.textAlign = 'left';
    }
  }
}

class Barrel {
  constructor(x, y){
    this.x = x; this.y = y; this.r = 18;
    this.hp = 30; this.maxHp = 30;
    this.alive = true;
    this.hitFlash = 0;
    this.fuse = 0; // 0 = stable, > 0 = about to explode (chain)
    this.t = Math.random()*TAU;
  }
  hit(dmg){
    if(!this.alive) return;
    this.hp -= dmg;
    this.hitFlash = 0.1;
    if(this.hp <= 0 && this.fuse <= 0) this.fuse = 0.05;
  }
  update(dt){
    if(!this.alive) return;
    if(this.hitFlash > 0) this.hitFlash -= dt;
    this.t += dt*8;
    if(this.fuse > 0){
      this.fuse -= dt;
      if(this.fuse <= 0) this.explode();
      // Sparks
      if(Math.random() < 0.7){
        game.particles.spawn({
          x:this.x+rnd(-4,4), y:this.y-15, vx:rnd(-30,30), vy:rnd(-80,-40),
          life:0.3, size:rnd(2,4), color:'#ffaa00', glow:true
        });
      }
    }
  }
  explode(){
    if(!this.alive) return;
    this.alive = false;
    game.explode(this.x, this.y, 110, 70);
    // Chain detonate other barrels
    for(const b of game.barrels){
      if(b.alive && b !== this){
        const d = dist(this.x, this.y, b.x, b.y);
        if(d < 130 && b.fuse <= 0) b.fuse = 0.15;
      }
    }
    // Crate damage nearby
    for(const o of game.obstacles){
      if(o.alive && o.type === 'crate'){
        const cx = o.x + o.w/2, cy = o.y + o.h/2;
        if(dist(this.x, this.y, cx, cy) < 110) o.hit(60);
      }
    }
  }
  collides(x, y, r){
    if(!this.alive) return false;
    return dist(x, y, this.x, this.y) < r + this.r;
  }
  draw(cam){
    if(!this.alive) return;
    const sx = this.x-cam.x, sy = this.y-cam.y;
    if(sx<-50||sx>W+50||sy<-50||sy>H+50) return;
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(sx, sy+18, 18, 6, 0, 0, TAU); ctx.fill();
    // Body
    let bodyColor = this.hitFlash>0 ? '#fff' : (this.fuse > 0 ? (Math.floor(this.t*4)%2 ? '#ff5500' : '#cc2200') : '#aa2222');
    ctx.fillStyle = bodyColor;
    ctx.fillRect(sx-15, sy-22, 30, 40);
    // Bands
    ctx.fillStyle = '#222';
    ctx.fillRect(sx-15, sy-15, 30, 3);
    ctx.fillRect(sx-15, sy+10, 30, 3);
    // Top
    ctx.fillStyle = '#3a0a0a';
    ctx.fillRect(sx-15, sy-22, 30, 4);
    // Border
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx-15, sy-22, 30, 40);
    // Skull/danger icon
    ctx.fillStyle = '#000';
    ctx.fillRect(sx-2, sy-6, 4, 8);
    ctx.fillRect(sx-6, sy-2, 12, 4);
    // HP bar
    if(this.hp < this.maxHp){
      ctx.fillStyle = '#000';
      ctx.fillRect(sx-15, sy-30, 30, 4);
      ctx.fillStyle = '#ff6666';
      ctx.fillRect(sx-14, sy-29, 28*(this.hp/this.maxHp), 2);
    }
    if(this.fuse > 0){
      ctx.shadowBlur = 15; ctx.shadowColor = '#ff8800';
      ctx.strokeStyle = '#ff8800';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(sx, sy, 22+Math.sin(this.t*4)*4, 0, TAU); ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }
}

class DangerZone {
  constructor(x, y, type='lava'){
    this.x = x; this.y = y; this.r = rnd(60, 90);
    this.type = type;
    this.color = type === 'lava' ? '#ff4400' : '#88ff00';
    this.color2 = type === 'lava' ? '#ffaa00' : '#ccff44';
    this.dmg = type === 'lava' ? 6 : 4;
    this.t = Math.random()*TAU;
    this.alive = true;
    // Loot in center
    this.loot = null;
    if(Math.random() < 0.7){
      const r = Math.random();
      if(r < 0.4) this.loot = { type:'health', amount:50 };
      else if(r < 0.7) this.loot = { type:'weapon', idx: rndi(2, NUM_SLOTS-1) };
      else this.loot = { type:'coins', amount:rndi(8,15) };
    }
    this.lootCollected = false;
  }
  update(dt){
    this.t += dt*2;
    // Damage entities
    const p = game.player;
    if(dist(p.x, p.y, this.x, this.y) < this.r){
      p.hurt(this.dmg*dt*4);
      if(Math.random() < 0.3){
        game.particles.spawn({
          x:p.x+rnd(-8,8), y:p.y, vx:rnd(-20,20), vy:rnd(-80,-30),
          life:0.4, size:rnd(3,6), color:this.color2, glow:true
        });
      }
    }
    for(const e of game.enemies){
      if(!e.alive) continue;
      if(dist(e.x, e.y, this.x, this.y) < this.r){
        e.hurt(this.dmg*dt*2, this.color2);
      }
    }
    // Loot pickup
    if(this.loot && !this.lootCollected){
      if(dist(p.x, p.y, this.x, this.y) < 18){
        if(this.loot.type === 'health'){
          const heal = Math.round(p.maxHp*(this.loot.amount/100));
          p.hp = Math.min(p.maxHp, p.hp + heal);
          spawnDamage(p.x, p.y-30, '+'+heal+' HP', '#22ff44');
        } else if(this.loot.type === 'weapon'){
          game.drops.push(new WeaponDrop(this.x, this.y, this.loot.idx));
        } else if(this.loot.type === 'coins'){
          for(let i=0;i<this.loot.amount;i++){
            game.coins.push(new Coin(this.x+rnd(-10,10), this.y+rnd(-10,10), 1));
          }
        }
        this.lootCollected = true;
        for(let i=0;i<20;i++){
          const a = Math.random()*TAU;
          game.particles.spawn({
            x:this.x, y:this.y, vx:Math.cos(a)*200, vy:Math.sin(a)*200,
            life:0.5, size:rnd(3,5), color:'#ffd700', glow:true
          });
        }
      }
    }
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    if(sx<-this.r-20||sx>W+this.r+20||sy<-this.r-20||sy>H+this.r+20) return;
    // Pool
    const pulse = 1 + Math.sin(this.t)*0.05;
    const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, this.r*pulse);
    grad.addColorStop(0, this.color2);
    grad.addColorStop(0.5, this.color);
    grad.addColorStop(1, this.color + '00');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(sx, sy, this.r*pulse, 0, TAU); ctx.fill();
    // Bubbles
    for(let i=0;i<3;i++){
      const a = this.t + i*TAU/3;
      const r = (Math.sin(this.t*2 + i)*0.4 + 0.5) * this.r * 0.7;
      ctx.fillStyle = this.color2;
      ctx.beginPath(); ctx.arc(sx + Math.cos(a)*r, sy + Math.sin(a)*r, 4 + Math.sin(this.t*3+i)*2, 0, TAU); ctx.fill();
    }
    // Border ring
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 3;
    ctx.shadowBlur = 12; ctx.shadowColor = this.color;
    ctx.beginPath(); ctx.arc(sx, sy, this.r, 0, TAU); ctx.stroke();
    ctx.shadowBlur = 0;
    // Loot indicator (floating above center)
    if(this.loot && !this.lootCollected){
      const ly = sy - 4 + Math.sin(this.t*2)*4;
      ctx.save();
      ctx.shadowBlur = 14; ctx.shadowColor = '#ffd700';
      if(this.loot.type === 'health'){
        ctx.fillStyle = '#ff66bb';
        ctx.fillRect(sx-3, ly-9, 6, 18);
        ctx.fillRect(sx-9, ly-3, 18, 6);
      } else if(this.loot.type === 'weapon'){
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(sx-10, ly-3, 20, 6);
      } else {
        ctx.fillStyle = '#ffd700';
        ctx.beginPath(); ctx.arc(sx, ly, 8, 0, TAU); ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
}

function drawFloor(cam){
  const sx0 = Math.floor(cam.x/TILE)*TILE;
  const sy0 = Math.floor(cam.y/TILE)*TILE;
  for(let x=sx0; x<cam.x+W+TILE; x+=TILE){
    for(let y=sy0; y<cam.y+H+TILE; y+=TILE){
      const tx = x/TILE, ty = y/TILE;
      const i = (tx + ty) & 1;
      const h = hash2(tx, ty);
      // Base tile with slight per-tile tone variation
      const v = Math.floor(h*6);
      ctx.fillStyle = i ? `rgb(${13+v},${13+v},${26+v})` : `rgb(${17+v},${17+v},${34+v})`;
      ctx.fillRect(x-cam.x, y-cam.y, TILE, TILE);
      // Deterministic decorations (sparse)
      const px = x-cam.x, py = y-cam.y;
      if(h > 0.93){
        // Crack
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        const cx = px + 10 + h*30, cy = py + 8 + (h*7%1)*40;
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + 14, cy + 9);
        ctx.lineTo(cx + 8, cy + 22);
        ctx.stroke();
      } else if(h > 0.86){
        // Pebbles
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        ctx.beginPath(); ctx.arc(px + 16 + h*20, py + 40, 3, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(px + 38, py + 18 + h*14, 2, 0, TAU); ctx.fill();
      } else if(h < 0.05){
        // Moss / stain patch
        ctx.fillStyle = 'rgba(40,70,50,0.12)';
        ctx.beginPath(); ctx.ellipse(px + 32, py + 32, 18 + h*200, 12, h*6, 0, TAU); ctx.fill();
      }
      // Inner tile bevel (top-left light, bottom-right dark) — subtle depth
      ctx.fillStyle = 'rgba(255,255,255,0.018)';
      ctx.fillRect(px, py, TILE, 2);
      ctx.fillRect(px, py, 2, TILE);
      ctx.fillStyle = 'rgba(0,0,0,0.10)';
      ctx.fillRect(px, py+TILE-2, TILE, 2);
      ctx.fillRect(px+TILE-2, py, 2, TILE);
    }
  }
  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let x=sx0; x<cam.x+W+TILE; x+=TILE){
    ctx.moveTo(x-cam.x, 0); ctx.lineTo(x-cam.x, H);
  }
  for(let y=sy0; y<cam.y+H+TILE; y+=TILE){
    ctx.moveTo(0, y-cam.y); ctx.lineTo(W, y-cam.y);
  }
  ctx.stroke();
  // Map boundary — glowing wall edge
  ctx.save();
  ctx.shadowBlur = 18; ctx.shadowColor = '#4444aa';
  ctx.strokeStyle = '#3a3a6a';
  ctx.lineWidth = 6;
  ctx.strokeRect(-cam.x, -cam.y, MAP_W, MAP_H);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#6666cc';
  ctx.lineWidth = 2;
  ctx.strokeRect(-cam.x, -cam.y, MAP_W, MAP_H);
  ctx.restore();
}

class Weapon {
  constructor(name, color){
    this.name = name; this.color = color;
    this.fireRate = 0.3; this.cooldown = 0;
    this.specialCD = 8; this.specialT = 0;
    this.damage = 10;
    this.auto = true;
    this.unlimited = false;
    this.maxAmmo = 100;
    this.ammo = 100;
    this.refillAmount = 30;
  }
  update(dt){
    if(this.cooldown > 0) this.cooldown -= dt;
    if(this.specialT > 0) this.specialT -= dt;
  }
  canFire(){ return this.cooldown <= 0 && (this.unlimited || this.ammo > 0); }
  consumeAmmo(){ if(!this.unlimited) this.ammo = Math.max(0, this.ammo - 1); }
  refill(){
    if(this.unlimited) return;
    this.ammo = Math.min(this.maxAmmo, this.ammo + this.refillAmount);
  }
  fire(player, tx, ty){ this.cooldown = this.fireRate; }
  drawHand(ctx, player, aimAng){
    ctx.fillStyle = '#222';
    ctx.fillRect(8, -3, 18, 6);
  }
  special(player){ if(this.specialT <= 0) this.specialT = this.specialCD; }
}

class Punch extends Weapon {
  constructor(){
    super('Soco', '#ffcc99');
    this.fireRate = 0.35; this.damage = 22; this.specialCD = 5;
    this.unlimited = true;
  }
  fire(player, tx, ty){
    if(!this.canFire()) return;
    this.cooldown = this.fireRate;
    const a = ang(player.x, player.y, tx, ty);
    player.punchAnim = { ang: a, t: 0.18, max: 0.18 };
    let hit = false;
    for(const e of game.enemies){
      if(!e.alive) continue;
      const d = dist(player.x, player.y, e.x, e.y);
      if(d < 55){
        const ea = ang(player.x, player.y, e.x, e.y);
        let diff = ea - a;
        while(diff > Math.PI) diff -= TAU;
        while(diff < -Math.PI) diff += TAU;
        if(Math.abs(diff) < Math.PI*0.4){
          e.hurt(this.damage, '#ffe0aa');
          e.x += Math.cos(a)*25;
          e.y += Math.sin(a)*25;
          hit = true;
          for(let i=0;i<6;i++){
            game.particles.spawn({
              x:e.x, y:e.y, vx:rnd(-180,180), vy:rnd(-180,180),
              life:0.4, size:rnd(3,5), color:'#ffaa66', glow:true
            });
          }
        }
      }
    }
    if(hit) game.camera.doShake(2);
  }
  drawHand(ctx){
    ctx.fillStyle = '#3d5d3d';
    ctx.fillRect(2,-3,8,6);
    ctx.fillStyle = '#c8956c';
    ctx.beginPath(); ctx.arc(14, 0, 5, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#8a6244'; ctx.lineWidth = 1; ctx.stroke();
  }
  special(player){
    if(this.specialT > 0) return;
    this.specialT = this.specialCD;
    player.shockwave = { r:0, max:160, life:0.5, dmg:this.damage*2 };
    game.camera.doShake(10);
    for(const e of game.enemies){
      if(!e.alive) continue;
      const d = dist(player.x, player.y, e.x, e.y);
      if(d < 160){
        const a = ang(player.x, player.y, e.x, e.y);
        e.hurt(this.damage*2, '#fff');
        e.x += Math.cos(a)*70;
        e.y += Math.sin(a)*70;
        for(let i=0;i<8;i++){
          game.particles.spawn({
            x:e.x, y:e.y, vx:rnd(-250,250), vy:rnd(-250,250),
            life:0.5, size:rnd(3,6), color:'#ffaa66', glow:true
          });
        }
      }
    }
  }
}

    }
  }
}

class Laser extends Weapon {
  constructor(){ super('Laser', '#00ff88'); this.fireRate=0.05; this.damage=1.5; this.specialCD=12; this.heat=0; this.maxAmmo=300; this.ammo=300; this.refillAmount=100; }
  fire(player,tx,ty){
    if(!this.canFire()) return;
    this.cooldown = this.fireRate;
    this.consumeAmmo();
    this.heat = Math.min(1, this.heat + 0.03);
    // Beam is drawn directly, hit detection here
    const a = ang(player.x, player.y, tx, ty);
    const range = 800;
    const ex = player.x + Math.cos(a)*range;
    const ey = player.y + Math.sin(a)*range;
    // Check enemies along beam
    let hitX = ex, hitY = ey, hitObj = null;
    for(const e of game.enemies){
      if(!e.alive) continue;
      // Project enemy onto line
      const dx = e.x - player.x, dy = e.y - player.y;
      const t = (dx*Math.cos(a) + dy*Math.sin(a));
      if(t < 0 || t > range) continue;
      const px = player.x + Math.cos(a)*t;
      const py = player.y + Math.sin(a)*t;
      if(dist2(px,py,e.x,e.y) < e.r*e.r){
        const dmgMult = 1 + this.heat*2;
        e.hurt(this.damage*dmgMult, this.heat>0.7?'#fff':'#00ff88');
      }
    }
    player.laserBeam = { ang:a, range, heat:this.heat };
  }
  update(dt){
    super.update(dt);
    if(!mouse.down) this.heat = Math.max(0, this.heat - dt*0.4);
  }
  drawHand(ctx){
    ctx.fillStyle='#226666'; ctx.fillRect(8,-4,22,8);
    ctx.fillStyle='#00ff88'; ctx.beginPath(); ctx.arc(30,0,4,0,TAU); ctx.fill();
  }
  special(player){
    if(this.specialT > 0) return;
    this.specialT = this.specialCD;
    player.rotLaser = { t:3, max:3, ang:0 };
  }
}

// ============================================================
// PROJECTILES
// ============================================================
class Projectile {
  constructor(opts){
    Object.assign(this, opts);
    this.alive = true;
    this.history = [];
  }
  update(dt){
    if(this.trail || this.weapon==='mg' || this.weapon==='rocket'){
      this.history.push({x:this.x,y:this.y});
      if(this.history.length > 5) this.history.shift();
    }
    this.x += this.vx*dt; this.y += this.vy*dt;
    this.life -= dt;
    if(this.life <= 0){ this.alive = false; if(this.weapon==='rocket'){ game.explode(this.x, this.y, 80, this.dmg); } }
    if(this.x<0||this.x>MAP_W||this.y<0||this.y>MAP_H){ this.alive = false; }
    // Obstacle collision (damages crates)
    for(const o of game.obstacles){
      if(o.collides(this.x, this.y, this.size)){
        if(o.type === 'crate') o.hit(this.dmg);
        if(this.weapon==='rocket') game.explode(this.x, this.y, 80, this.dmg);
        else game.hitSpark(this.x, this.y, this.color);
        this.alive = false;
        return;
      }
    }
    // Barrel collision (detonates them)
    for(const b of game.barrels){
      if(b.collides(this.x, this.y, this.size)){
        b.hit(this.dmg);
        if(this.weapon==='rocket') game.explode(this.x, this.y, 80, this.dmg);
        else game.hitSpark(this.x, this.y, this.color);
        this.alive = false;
        return;
      }
    }
    // Rocket smoke trail
    if(this.weapon==='rocket'){
      game.particles.spawn({
        x:this.x+rnd(-3,3), y:this.y+rnd(-3,3), vx:rnd(-30,30), vy:rnd(-30,30),
        life:0.6, size:rnd(4,8), color:'#888', glow:false
      });
    }
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    if(this.history.length > 0){
      ctx.globalAlpha = 0.3;
      for(let i=0;i<this.history.length;i++){
        const h = this.history[i];
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(h.x-cam.x, h.y-cam.y, this.size*(i/this.history.length), 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    if(this.weapon === 'rocket'){
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(Math.atan2(this.vy, this.vx));
      ctx.fillStyle = '#5a7c4a';
      ctx.beginPath(); ctx.ellipse(0,0,12,5,0,0,TAU); ctx.fill();
      ctx.fillStyle = '#3a3a3a';
      ctx.beginPath(); ctx.moveTo(10,-5); ctx.lineTo(18,0); ctx.lineTo(10,5); ctx.fill();
      ctx.fillStyle = '#aaa';
      ctx.fillRect(-12,-6,4,3); ctx.fillRect(-12,3,4,3);
      // Flame
      ctx.fillStyle = '#ff8c00';
      ctx.beginPath(); ctx.moveTo(-12,-3); ctx.lineTo(-22,0); ctx.lineTo(-12,3); ctx.fill();
      ctx.restore();
    } else if(this.weapon === 'sniper'){
      ctx.save();
      ctx.shadowBlur = 20; ctx.shadowColor = this.color;
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(sx, sy, this.size, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    } else if(this.elongated){
      const len = 12;
      const a = Math.atan2(this.vy, this.vx);
      ctx.save();
      ctx.shadowBlur = 8; ctx.shadowColor = this.color;
      ctx.strokeStyle = this.color;
      ctx.lineWidth = this.size;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx - Math.cos(a)*len, sy - Math.sin(a)*len);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();
    } else {
      ctx.save();
      ctx.shadowBlur = 6; ctx.shadowColor = this.color;
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(sx, sy, this.size, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
}

// ============================================================
// ENEMIES
// ============================================================
class Enemy {
  constructor(x,y){
    this.x=x;this.y=y;this.vx=0;this.vy=0;
    this.hp=10;this.maxHp=10;this.r=14;this.speed=80;
    this.alive=true;this.dmg=10;this.scoreVal=10;
    this.color='#fff';this.bobT=Math.random()*TAU;
    this.hitFlash=0;this.attackCD=0;this.burning=0;
    this.lastX = x; this.lastY = y;
    this.stuckT = 0;
    this.tangentSign = Math.random()<0.5 ? 1 : -1;
    this.repathT = 0;
  }
  // Steering: obstacle avoidance + tangent escape
  applyAvoidance(vx, vy){
    const safePad = 30;
    let ax = 0, ay = 0;
    for(const o of game.obstacles){
      if(!o.alive) continue;
      const cx = clamp(this.x, o.x, o.x+o.w);
      const cy = clamp(this.y, o.y, o.y+o.h);
      const d = dist(this.x, this.y, cx, cy);
      const safeR = this.r + safePad;
      if(d < safeR){
        const dd = Math.max(d, 0.5);
        const ra = ang(cx, cy, this.x, this.y);
        const force = (safeR - dd) / safeR;
        ax += Math.cos(ra)*force*this.speed*2.2;
        ay += Math.sin(ra)*force*this.speed*2.2;
        // Tangent component to slide around the obstacle
        const ta = ra + this.tangentSign*Math.PI*0.5;
        ax += Math.cos(ta)*force*this.speed*1.0;
        ay += Math.sin(ta)*force*this.speed*1.0;
      }
    }
    // Avoid barrels too
    for(const b of game.barrels){
      if(!b.alive) continue;
      const d = dist(this.x, this.y, b.x, b.y);
      const safeR = this.r + b.r + 20;
      if(d < safeR){
        const dd = Math.max(d, 0.5);
        const ra = ang(b.x, b.y, this.x, this.y);
        const force = (safeR - dd) / safeR;
        ax += Math.cos(ra)*force*this.speed*2;
        ay += Math.sin(ra)*force*this.speed*2;
      }
    }
    vx += ax; vy += ay;
    const mag = Math.hypot(vx, vy);
    if(mag > this.speed){ vx = vx/mag*this.speed; vy = vy/mag*this.speed; }
    return [vx, vy];
  }
  // Detect stuck and flip tangent direction
  checkStuck(dt){
    const moved = dist(this.x, this.y, this.lastX, this.lastY);
    if(moved < this.speed*dt*0.3){
      this.stuckT += dt;
      if(this.stuckT > 0.4){
        this.tangentSign = -this.tangentSign;
        this.stuckT = 0;
      }
    } else {
      this.stuckT = Math.max(0, this.stuckT - dt*0.5);
    }
    this.lastX = this.x; this.lastY = this.y;
  }
  hurt(d, color){
    this.hp -= d;
    this.hitFlash = 0.1;
    spawnDamage(this.x, this.y - this.r, d, color);
    if(this.hp <= 0){
      this.alive = false;
      game.score += this.scoreVal;
      // XP gain proportional to enemy value
      game.player.gainXP(Math.max(5, Math.floor(this.scoreVal * 0.5)));
      game.player.killCount++;
      // Drop coins
      const coinCount = Math.max(1, Math.floor((this.scoreVal/15) * game.player.coinMultiplier * rnd(0.7, 1.3)));
      for(let i=0;i<Math.min(coinCount, 12);i++){
        game.coins.push(new Coin(this.x+rnd(-8,8), this.y+rnd(-8,8), 1));
      }
      this.onDeath();
      addBlood(this.x, this.y);
      // Death burst
      for(let i=0;i<12;i++){
        game.particles.spawn({
          x:this.x, y:this.y, vx:rnd(-200,200), vy:rnd(-200,200),
          life:0.6, size:rnd(2,5), color:this.color, glow:false
        });
      }
    }
  }
  onDeath(){}
  update(dt){
    if(this.burning > 0){
      this.burning -= dt;
      if(Math.random() < 0.3){
        game.particles.spawn({
          x:this.x+rnd(-this.r,this.r), y:this.y+rnd(-this.r,this.r),
          vx:rnd(-20,20), vy:rnd(-60,-30),
          life:0.4, size:rnd(3,6), color:Math.random()<0.5?'#ff4500':'#ffaa00', glow:true
        });
      }
      if(Math.floor(this.burning*10) % 2 === 0){
        if(Math.random() < 0.05) this.hp -= 0.3;
      }
    }
    if(this.hitFlash > 0) this.hitFlash -= dt;
    this.bobT += dt*4;
    this.ai(dt);
    // Move on X and Y separately so collision on one axis doesn't freeze the other
    const stepX = this.vx*dt, stepY = this.vy*dt;
    this.x += stepX;
    for(const o of game.obstacles){
      if(!o.alive) continue;
      if(o.collides(this.x, this.y, this.r)){
        if(stepX > 0) this.x = o.x - this.r - 0.1;
        else if(stepX < 0) this.x = o.x + o.w + this.r + 0.1;
      }
    }
    this.y += stepY;
    for(const o of game.obstacles){
      if(!o.alive) continue;
      if(o.collides(this.x, this.y, this.r)){
        if(stepY > 0) this.y = o.y - this.r - 0.1;
        else if(stepY < 0) this.y = o.y + o.h + this.r + 0.1;
      }
    }
    // Barrel collision push-out
    for(const b of game.barrels){
      if(!b.alive) continue;
      if(b.collides(this.x, this.y, this.r)){
        const a = ang(b.x, b.y, this.x, this.y);
        const overlap = b.r + this.r - dist(this.x, this.y, b.x, b.y);
        this.x += Math.cos(a)*overlap;
        this.y += Math.sin(a)*overlap;
      }
    }
    this.x = clamp(this.x, this.r, MAP_W-this.r);
    this.y = clamp(this.y, this.r, MAP_H-this.r);
    this.checkStuck(dt);
    if(this.attackCD > 0) this.attackCD -= dt;
  }
  ai(dt){
    const p = game.player;
    const a = ang(this.x, this.y, p.x, p.y);
    let vx = Math.cos(a)*this.speed;
    let vy = Math.sin(a)*this.speed;
    [vx, vy] = this.applyAvoidance(vx, vy);
    // Smooth velocity to avoid jitter
    this.vx = lerp(this.vx, vx, 0.25);
    this.vy = lerp(this.vy, vy, 0.25);
    if(dist(this.x,this.y,p.x,p.y) < this.r + p.r && this.attackCD <= 0){
      p.hurt(this.dmg);
      this.attackCD = 1;
    }
  }
  drawShadow(cam){
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(this.x-cam.x, this.y-cam.y+this.r*0.6, this.r*0.8, this.r*0.3, 0, 0, TAU); ctx.fill();
  }
  drawHPBar(cam, w=30, alwaysShow=false){
    if(this.hp >= this.maxHp && !alwaysShow) return;
    const sx = this.x-cam.x, sy = this.y-cam.y-this.r-10;
    ctx.fillStyle = '#000';
    ctx.fillRect(sx-w/2-1, sy-1, w+2, 5);
    ctx.fillStyle = '#5a0000';
    ctx.fillRect(sx-w/2, sy, w, 3);
    ctx.fillStyle = '#ff3030';
    ctx.fillRect(sx-w/2, sy, w*(this.hp/this.maxHp), 3);
  }
  draw(cam){}
}

class Shooter extends Enemy {
  constructor(x,y){
    super(x,y);
    this.hp=this.maxHp=40; this.r=12; this.speed=50; this.dmg=10;
    this.scoreVal=25; this.color='#c8a800'; this.shootCD=0; this.recoil=0;
  }
  hasLOS(){
    const p = game.player;
    const steps = 10;
    for(let s=1;s<=steps;s++){
      const t = s/steps;
      const x = lerp(this.x, p.x, t);
      const y = lerp(this.y, p.y, t);
      for(const o of game.obstacles){
        if(o.alive && o.collides(x, y, 4)) return false;
      }
    }
    return true;
  }
  findCover(){
    const p = game.player;
    let best = null, bestScore = Infinity;
    for(const o of game.obstacles){
      if(!o.alive) continue;
      const ox = o.x + o.w/2, oy = o.y + o.h/2;
      // Position behind obstacle relative to player
      const aFromPlayer = ang(p.x, p.y, ox, oy);
      const coverDist = Math.max(o.w, o.h)/2 + this.r + 12;
      const cx = ox + Math.cos(aFromPlayer)*coverDist;
      const cy = oy + Math.sin(aFromPlayer)*coverDist;
      const dToCover = dist(this.x, this.y, cx, cy);
      const dPlayerToObst = dist(p.x, p.y, ox, oy);
      // Prefer cover that's between us and player
      if(dPlayerToObst > 100 && dToCover < 400){
        const score = dToCover + Math.abs(dPlayerToObst - 250)*0.3;
        if(score < bestScore){ bestScore = score; best = {x:cx, y:cy}; }
      }
    }
    return best;
  }
  ai(dt){
    const p = game.player;
    const d = dist(this.x,this.y,p.x,p.y);
    const a = ang(this.x, this.y, p.x, p.y);
    const losClear = this.hasLOS();
    let tvx = 0, tvy = 0;
    if(!losClear){
      // Try to step out to get a shot
      tvx = Math.cos(a + Math.PI*0.5*this.tangentSign)*this.speed*0.7;
      tvy = Math.sin(a + Math.PI*0.5*this.tangentSign)*this.speed*0.7;
    } else if(d < 250){
      // Too close — find cover
      const cover = this.findCover();
      if(cover){
        const ca = ang(this.x, this.y, cover.x, cover.y);
        tvx = Math.cos(ca)*this.speed;
        tvy = Math.sin(ca)*this.speed;
      } else {
        tvx = -Math.cos(a)*this.speed;
        tvy = -Math.sin(a)*this.speed;
      }
    } else if(d > 400){
      tvx = Math.cos(a)*this.speed*0.6;
      tvy = Math.sin(a)*this.speed*0.6;
    } else {
      // Strafe at good distance
      tvx = Math.cos(a + Math.PI*0.5*this.tangentSign)*this.speed*0.4;
      tvy = Math.sin(a + Math.PI*0.5*this.tangentSign)*this.speed*0.4;
    }
    [tvx, tvy] = this.applyAvoidance(tvx, tvy);
    this.vx = lerp(this.vx, tvx, 0.2);
    this.vy = lerp(this.vy, tvy, 0.2);
    if(this.shootCD <= 0 && d < 550 && losClear){
      this.shootCD = 1.6;
      this.recoil = 0.2;
      game.spawnEnemyProjectile(this.x+Math.cos(a)*16, this.y+Math.sin(a)*16, Math.cos(a)*450, Math.sin(a)*450, this.dmg, '#c8a800');
    } else this.shootCD -= dt;
    if(this.recoil > 0) this.recoil -= dt;
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    this.drawShadow(cam);
    const a = ang(this.x, this.y, game.player.x, game.player.y);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(a);
    if(this.recoil > 0) ctx.translate(-4*this.recoil/0.2, 0);
    // Body
    ctx.fillStyle = this.hitFlash>0?'#fff':'#a88800';
    ctx.beginPath(); ctx.ellipse(0,0,8,11,0,0,TAU); ctx.fill();
    // Head
    ctx.fillStyle = this.hitFlash>0?'#fff':'#c8956c';
    ctx.beginPath(); ctx.arc(5,0,6,0,TAU); ctx.fill();
    // Hood triangle
    ctx.fillStyle = '#6a4a00';
    ctx.beginPath();
    ctx.moveTo(2,-8); ctx.lineTo(10,0); ctx.lineTo(2,8); ctx.fill();
    // Gun
    ctx.fillStyle = '#222';
    ctx.fillRect(6,-1,16,3);
    // Eyes
    ctx.shadowBlur = 4; ctx.shadowColor = '#ffff00';
    ctx.fillStyle = '#ffff00';
    ctx.beginPath(); ctx.arc(7,-2,1,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(7,2,1,0,TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
    this.drawHPBar(cam);
  }
}

class Exploder extends Enemy {
  constructor(x,y){
    super(x,y);
    this.hp=this.maxHp=25; this.r=18; this.speed=90; this.dmg=35;
    this.scoreVal=30; this.color='#e05a00'; this.pulse=0;
  }
  ai(dt){
    super.ai(dt);
    const d = dist(this.x,this.y,game.player.x,game.player.y);
    this.pulseRate = d < 80 ? 12 : (d < 200 ? 6 : 3);
    this.pulse += dt * this.pulseRate;
    if(d < 35 && this.attackCD <= 0){
      game.explode(this.x, this.y, 80, this.dmg);
      this.hp = 0;
      this.alive = false;
      game.score += this.scoreVal;
      addBlood(this.x, this.y, '#5a2000');
    }
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    this.drawShadow(cam);
    const scale = 1 + Math.sin(this.pulse)*0.08;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(scale, scale);
    // Sparks
    for(let i=0;i<5;i++){
      const a = this.pulse + i*TAU/5;
      ctx.strokeStyle = '#ffaa00';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*18, Math.sin(a)*18);
      ctx.lineTo(Math.cos(a)*24, Math.sin(a)*24);
      ctx.stroke();
    }
    ctx.shadowBlur = 12 + Math.sin(this.pulse)*8;
    ctx.shadowColor = '#ff4500';
    ctx.fillStyle = this.hitFlash>0?'#fff':'#e05a00';
    ctx.beginPath(); ctx.arc(0,0,16,0,TAU); ctx.fill();
    ctx.shadowBlur = 0;
    // Cross/skull
    ctx.fillStyle = '#000';
    ctx.fillRect(-1,-7,2,14);
    ctx.fillRect(-7,-1,14,2);
    ctx.restore();
    this.drawHPBar(cam);
  }
}

class Ghost extends Enemy {
  constructor(x,y){
    super(x,y);
    this.hp=this.maxHp=35; this.r=16; this.speed=100; this.dmg=12;
    this.scoreVal=20; this.color='#7b2d8b'; this.flick=Math.random()*TAU;
    this.trail = [];
  }
  ai(dt){
    const p = game.player;
    const d = dist(this.x, this.y, p.x, p.y);
    // Flank: approach from perpendicular to player's aim direction
    if(d > 80){
      const playerFacing = p.aimAng;
      const flankSide = playerFacing + Math.PI*0.5*this.tangentSign;
      const targetDist = 70;
      const tx = p.x + Math.cos(playerFacing + Math.PI)*30 + Math.cos(flankSide)*targetDist;
      const ty = p.y + Math.sin(playerFacing + Math.PI)*30 + Math.sin(flankSide)*targetDist;
      const a = ang(this.x, this.y, tx, ty);
      let tvx = Math.cos(a)*this.speed;
      let tvy = Math.sin(a)*this.speed;
      [tvx, tvy] = this.applyAvoidance(tvx, tvy);
      this.vx = lerp(this.vx, tvx, 0.18);
      this.vy = lerp(this.vy, tvy, 0.18);
    } else {
      // Close enough: dive in
      const a = ang(this.x, this.y, p.x, p.y);
      this.vx = Math.cos(a)*this.speed*1.2;
      this.vy = Math.sin(a)*this.speed*1.2;
    }
    if(d < this.r + p.r && this.attackCD <= 0){
      p.hurt(this.dmg);
      this.attackCD = 1;
    }
    this.flick += dt*3;
    this.trail.push({x:this.x,y:this.y,t:0.3});
    if(this.trail.length > 8) this.trail.shift();
    for(const t of this.trail) t.t -= dt;
  }
  draw(cam){
    const a = 0.45 + Math.sin(this.flick)*0.25;
    // Trail
    for(const t of this.trail){
      if(t.t<=0) continue;
      ctx.globalAlpha = t.t * 0.3;
      this.drawBody(t.x-cam.x, t.y-cam.y);
    }
    ctx.globalAlpha = a;
    this.drawBody(this.x-cam.x, this.y-cam.y);
    ctx.globalAlpha = 1;
    this.drawHPBar(cam);
  }
  drawBody(sx, sy){
    ctx.fillStyle = this.hitFlash>0?'#fff':'#7b2d8b';
    ctx.beginPath();
    ctx.arc(sx, sy-4, 14, Math.PI, 0);
    ctx.bezierCurveTo(sx+14, sy+8, sx+8, sy+12, sx+4, sy+8);
    ctx.bezierCurveTo(sx, sy+14, sx-4, sy+8, sx-8, sy+12);
    ctx.bezierCurveTo(sx-14, sy+8, sx-14, sy+4, sx-14, sy-4);
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(sx-4,sy-6,3,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+4,sy-6,3,0,TAU); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(sx-4,sy-6,1.5,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+4,sy-6,1.5,0,TAU); ctx.fill();
  }
}

class Swarm extends Enemy {
  constructor(x,y){
    super(x,y);
    this.hp=this.maxHp=8; this.r=8; this.speed=140; this.dmg=4;
    this.scoreVal=5; this.color='#e040a0'; this.wing=Math.random()*TAU;
  }
  ai(dt){
    const p = game.player;
    let ax = 0, ay = 0;
    const toP = ang(this.x, this.y, p.x, p.y);
    ax += Math.cos(toP); ay += Math.sin(toP);
    // Swarm flocking
    let nx=0,ny=0,n=0;
    for(const e of game.enemies){
      if(e === this || !(e instanceof Swarm) || !e.alive) continue;
      const d2 = dist2(this.x,this.y,e.x,e.y);
      if(d2 < 60*60){
        const a = ang(e.x, e.y, this.x, this.y);
        nx += Math.cos(a); ny += Math.sin(a);
        n++;
      }
    }
    if(n > 0){ ax += nx/n*0.6; ay += ny/n*0.6; }
    const mag = Math.hypot(ax,ay);
    if(mag > 0){ ax/=mag; ay/=mag; }
    let tvx = ax*this.speed, tvy = ay*this.speed;
    [tvx, tvy] = this.applyAvoidance(tvx, tvy);
    this.vx = lerp(this.vx, tvx, 0.3);
    this.vy = lerp(this.vy, tvy, 0.3);
    if(dist(this.x,this.y,p.x,p.y) < this.r + p.r && this.attackCD <= 0){
      p.hurt(this.dmg);
      this.attackCD = 0.5;
    }
    this.wing += dt*20;
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    const a = Math.atan2(this.vy, this.vx);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(a);
    // Wings
    const wingScale = Math.sin(this.wing)*0.6;
    ctx.fillStyle = 'rgba(255,100,180,0.6)';
    ctx.beginPath(); ctx.ellipse(-2,-4-wingScale*2,6,2,-0.5,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-2,4+wingScale*2,6,2,0.5,0,TAU); ctx.fill();
    // Legs
    ctx.strokeStyle = '#a02080'; ctx.lineWidth = 1;
    for(let i=-1;i<=1;i+=2){
      ctx.beginPath();
      ctx.moveTo(0,0); ctx.lineTo(-3,i*5);
      ctx.moveTo(0,0); ctx.lineTo(3,i*5);
      ctx.stroke();
    }
    // Body
    ctx.fillStyle = this.hitFlash>0?'#fff':'#e040a0';
    ctx.beginPath(); ctx.ellipse(0,0,6,4,0,0,TAU); ctx.fill();
    ctx.restore();
  }
}

class MiniBossAssassin extends Enemy {
  constructor(x, y){
    super(x, y);
    this.hp = this.maxHp = 220;
    this.r = 16; this.speed = 200; this.dmg = 28;
    this.scoreVal = 250; this.color = '#330033';
    this.alphaBase = 0.15;
    this.revealT = 0;
    this.dashT = 0;
    this.dashing = false;
  }
  hurt(d, color){
    this.revealT = 1.2;
    super.hurt(d, color);
  }
  ai(dt){
    const p = game.player;
    const d = dist(this.x, this.y, p.x, p.y);
    const a = ang(this.x, this.y, p.x, p.y);
    if(this.revealT > 0) this.revealT -= dt;
    this.dashT -= dt;
    if(this.dashing){
      this.vx = Math.cos(a)*this.speed*2.5;
      this.vy = Math.sin(a)*this.speed*2.5;
      if(this.dashT <= 0){ this.dashing = false; this.dashT = rnd(2.5, 4); }
    } else if(this.dashT <= 0 && d < 350){
      this.dashing = true;
      this.dashT = 0.4;
      this.revealT = 0.5;
    } else {
      let tvx = Math.cos(a)*this.speed*0.7;
      let tvy = Math.sin(a)*this.speed*0.7;
      [tvx, tvy] = this.applyAvoidance(tvx, tvy);
      this.vx = lerp(this.vx, tvx, 0.18);
      this.vy = lerp(this.vy, tvy, 0.18);
    }
    if(d < this.r + p.r && this.attackCD <= 0){
      p.hurt(this.dmg);
      this.attackCD = 0.7;
    }
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    const closeAlpha = clamp(1 - dist(this.x,this.y,game.player.x,game.player.y)/180, 0, 1);
    const baseAlpha = Math.max(this.alphaBase + closeAlpha*0.3, this.dashing ? 0.6 : 0);
    const alpha = this.revealT > 0 ? Math.min(1, baseAlpha + this.revealT) : baseAlpha;
    ctx.save();
    ctx.globalAlpha = clamp(alpha, 0, 1);
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(sx, sy+12, 14, 5, 0, 0, TAU); ctx.fill();
    const a = ang(this.x, this.y, game.player.x, game.player.y);
    ctx.translate(sx, sy);
    ctx.rotate(a);
    // Cloak
    ctx.fillStyle = this.hitFlash>0?'#ff6666':'#1a001a';
    ctx.beginPath(); ctx.ellipse(0, 0, 14, 11, 0, 0, TAU); ctx.fill();
    // Hood
    ctx.fillStyle = '#0a000a';
    ctx.beginPath();
    ctx.moveTo(-5,-9); ctx.lineTo(8,0); ctx.lineTo(-5,9); ctx.closePath();
    ctx.fill();
    // Daggers
    ctx.strokeStyle = '#cc0066'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(8,-6); ctx.lineTo(20,-9);
    ctx.moveTo(8,6); ctx.lineTo(20,9);
    ctx.stroke();
    // Glowing eyes
    ctx.shadowBlur = 8; ctx.shadowColor = '#ff0066';
    ctx.fillStyle = '#ff0066';
    ctx.beginPath(); ctx.arc(4,-3,1.5,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(4,3,1.5,0,TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
    if(this.revealT > 0 || closeAlpha > 0.3) this.drawHPBar(cam, 50, true);
    // Dash trail
    if(this.dashing){
      for(let i=0;i<3;i++){
        game.particles.spawn({
          x:this.x, y:this.y, vx:rnd(-30,30), vy:rnd(-30,30),
          life:0.3, size:rnd(4,8), color:'#660066', glow:true
        });
      }
    }
  }
}

class Boss extends Enemy {
  constructor(x,y, tier=1){
    super(x,y);
    this.tier = tier;
    this.hp = this.maxHp = 1500 + tier*500;
    this.r = 60; this.speed = 35; this.dmg = 30;
    this.scoreVal = 500; this.color='#1a0a2e';
    this.attackT = 0;
    this.eyeGlow = 0;
  }
  ai(dt){
    super.ai(dt);
    this.attackT += dt;
    this.eyeGlow += dt*3;
    const p = game.player;
    if(this.attackT > 2.5){
      this.attackT = 0;
      const a = ang(this.x, this.y, p.x, p.y);
      // Spread shot
      for(let i=-2;i<=2;i++){
        const aa = a + i*0.18;
        game.spawnEnemyProjectile(this.x+Math.cos(aa)*60, this.y+Math.sin(aa)*60, Math.cos(aa)*400, Math.sin(aa)*400, this.dmg, '#ff4400');
      }
    }
    if(this.hp < this.maxHp*0.6 && this.attackT > 1.2 && Math.random()<0.3){
      // Summon swarm in phase 2+
      if(game.enemies.filter(e=>e instanceof Swarm).length < 8){
        for(let i=0;i<3;i++){
          game.enemies.push(new Swarm(this.x+rnd(-40,40), this.y+rnd(-40,40)));
        }
      }
    }
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    const hpr = this.hp / this.maxHp;
    const phase = hpr > 0.6 ? 1 : (hpr > 0.3 ? 2 : 3);
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.ellipse(sx, sy+40, 60, 16, 0, 0, TAU); ctx.fill();
    const a = ang(this.x, this.y, game.player.x, game.player.y);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(a);
    // Shoulders with spikes
    for(const sgn of [-1,1]){
      ctx.fillStyle = this.hitFlash>0?'#fff':'#0a0518';
      ctx.beginPath(); ctx.arc(-5, sgn*35, 20, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
      for(let i=0;i<6;i++){
        const sa = (i/6)*TAU;
        ctx.beginPath();
        ctx.moveTo(-5+Math.cos(sa)*16, sgn*35+Math.sin(sa)*16);
        ctx.lineTo(-5+Math.cos(sa)*26, sgn*35+Math.sin(sa)*26);
        ctx.stroke();
      }
    }
    // Body
    let bodyColor = '#1a0a2e';
    if(phase === 3){
      const pulse = 0.5 + Math.sin(this.eyeGlow*2)*0.5;
      bodyColor = `rgb(${50+pulse*150},${20+pulse*30},${30})`;
    } else if(this.hitFlash > 0) bodyColor = '#fff';
    ctx.fillStyle = bodyColor;
    ctx.fillRect(-40,-40,80,80);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.strokeRect(-40,-40,80,80);
    // Phase 2+ cracks
    if(phase >= 2){
      ctx.strokeStyle = '#ff6600';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 6; ctx.shadowColor = '#ff6600';
      ctx.beginPath();
      ctx.moveTo(-30,-20); ctx.lineTo(-10,5); ctx.lineTo(-25,25);
      ctx.moveTo(20,-30); ctx.lineTo(30,-5); ctx.lineTo(15,15); ctx.lineTo(30,30);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    // Crown of spikes
    ctx.fillStyle = '#000';
    for(let i=-3;i<=3;i++){
      ctx.beginPath();
      ctx.moveTo(35+i*2,-40); ctx.lineTo(40+i*2,-55); ctx.lineTo(45+i*2,-40); ctx.fill();
    }
    // Eyes
    const eg = 0.7 + Math.sin(this.eyeGlow)*0.3;
    ctx.shadowBlur = 20*eg; ctx.shadowColor = phase===3?'#ff6600':'#ff0000';
    ctx.fillStyle = phase===3?'#ffaa00':'#ff0000';
    ctx.beginPath(); ctx.arc(20,-12,6,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(20,12,6,0,TAU); ctx.fill();
    if(phase === 3){
      // Flame eyes
      for(let i=0;i<3;i++){
        const ay = 20 - i*3;
        ctx.fillStyle = i===0?'#fff':(i===1?'#ffaa00':'#ff4400');
        ctx.beginPath(); ctx.arc(20+rnd(-2,2),-12+rnd(-2,2)-i*2,4-i,0,TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(20+rnd(-2,2),12+rnd(-2,2)-i*2,4-i,0,TAU); ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}
