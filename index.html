<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Joguinho — Top-Down Arena</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;color:#fff;user-select:none}
  #game{display:block;cursor:crosshair;image-rendering:pixelated}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.85);z-index:10;text-align:center;padding:20px}
  #overlay h1{font-size:48px;color:#ffd700;margin-bottom:10px;text-shadow:0 0 20px #ffd700}
  #overlay p{font-size:18px;margin:6px 0;color:#ccc}
  #overlay button{margin-top:20px;padding:12px 30px;font-size:20px;background:#4a7c59;color:#fff;border:2px solid #ffd700;cursor:pointer;font-family:inherit}
  #overlay button:hover{background:#5a8c69}
  .hidden{display:none!important}
  .key{display:inline-block;background:#222;border:1px solid #555;padding:2px 8px;border-radius:4px;color:#ffd700}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay">
  <h1>JOGUINHO — TOP-DOWN ARENA</h1>
  <p><span class="key">WASD</span> mover · <span class="key">Mouse</span> mirar · <span class="key">Clique</span> atirar</p>
  <p><span class="key">1-9</span> trocar arma · <span class="key">Espaço</span> especial · <span class="key">Shift</span> dash</p>
  <p style="color:#888;margin-top:10px">Sobreviva às ondas. Pegue armas e curas dropadas. Derrote os bosses.</p>
  <p style="color:#888;font-size:14px">Soco e Katana têm munição infinita · Pegue a mesma arma de novo para recarregar</p>
  <button id="startBtn">INICIAR</button>
</div>
<script>
"use strict";

// ============================================================
// CORE / UTIL
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = window.innerWidth, H = window.innerHeight;
function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

const TAU = Math.PI*2;
const rnd = (a,b)=>a+Math.random()*(b-a);
const rndi = (a,b)=>Math.floor(rnd(a,b+1));
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp = (a,b,t)=>a+(b-a)*t;
const dist2 = (ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy};
const dist = (ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const ang = (ax,ay,bx,by)=>Math.atan2(by-ay,bx-ax);

// Input
const keys = {};
const mouse = { x:0, y:0, wx:0, wy:0, down:false, pressed:false };
window.addEventListener('keydown', e=>{ keys[e.key.toLowerCase()] = true; if(['1','2','3','4','5','6','7','8','9'].includes(e.key)) game?.player?.switchWeapon(parseInt(e.key)-1); if(e.key===' '){ game?.player?.useSpecial(); e.preventDefault(); }});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e=>{ mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', e=>{ mouse.down = true; mouse.pressed = true; });
canvas.addEventListener('mouseup', e=>{ mouse.down = false; });
canvas.addEventListener('contextmenu', e=>e.preventDefault());

// ============================================================
// PARTICLE SYSTEM (object pool)
// ============================================================
class Particle {
  constructor(){ this.alive=false; this.reset(); }
  reset(){
    this.x=0;this.y=0;this.vx=0;this.vy=0;this.life=0;this.maxLife=1;
    this.size=2;this.color='#fff';this.shrink=true;this.gravity=0;this.alpha=1;
    this.glow=false;this.type='circle';this.rot=0;this.vrot=0;
  }
}
class ParticleSystem {
  constructor(size=500){
    this.pool = [];
    for(let i=0;i<size;i++) this.pool.push(new Particle());
    this.size = size;
  }
  spawn(opts){
    for(let i=0;i<this.size;i++){
      const p = this.pool[i];
      if(!p.alive){
        p.reset(); p.alive = true;
        Object.assign(p, opts);
        p.maxLife = p.life;
        return p;
      }
    }
    return null;
  }
  update(dt){
    for(let i=0;i<this.size;i++){
      const p = this.pool[i];
      if(!p.alive) continue;
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vy += p.gravity*dt;
      p.vx *= 0.98; p.vy *= 0.98;
      p.rot += p.vrot*dt;
      p.life -= dt;
      if(p.life <= 0){ p.alive = false; }
    }
  }
  draw(cam){
    for(let i=0;i<this.size;i++){
      const p = this.pool[i];
      if(!p.alive) continue;
      const t = p.life / p.maxLife;
      const a = p.alpha * (p.shrink ? t : 1);
      ctx.globalAlpha = clamp(a, 0, 1);
      if(p.glow){ ctx.shadowBlur = 12; ctx.shadowColor = p.color; }
      ctx.fillStyle = p.color;
      const sx = p.x - cam.x, sy = p.y - cam.y;
      if(p.type === 'circle'){
        const s = p.size * (p.shrink ? t : 1);
        ctx.beginPath(); ctx.arc(sx, sy, Math.max(0.5,s), 0, TAU); ctx.fill();
      } else if(p.type === 'line'){
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.size * (p.shrink ? t : 1);
        ctx.beginPath();
        const len = p.size * 3;
        ctx.moveTo(sx - Math.cos(p.rot)*len, sy - Math.sin(p.rot)*len);
        ctx.lineTo(sx + Math.cos(p.rot)*len, sy + Math.sin(p.rot)*len);
        ctx.stroke();
      } else if(p.type === 'rect'){
        const s = p.size * (p.shrink?t:1);
        ctx.save(); ctx.translate(sx,sy); ctx.rotate(p.rot);
        ctx.fillRect(-s/2,-s/2,s,s); ctx.restore();
      }
      if(p.glow){ ctx.shadowBlur = 0; }
    }
    ctx.globalAlpha = 1;
  }
}

// ============================================================
// CAMERA
// ============================================================
class Camera {
  constructor(){ this.x=0;this.y=0;this.tx=0;this.ty=0;this.shake=0;this.zoom=1;this.tzoom=1; }
  follow(target){
    this.tx = target.x - W/(2*this.zoom);
    this.ty = target.y - H/(2*this.zoom);
    this.x = lerp(this.x, this.tx, 0.12);
    this.y = lerp(this.y, this.ty, 0.12);
    this.zoom = lerp(this.zoom, this.tzoom, 0.1);
    if(this.shake > 0){
      this.x += rnd(-this.shake, this.shake);
      this.y += rnd(-this.shake, this.shake);
      this.shake *= 0.88;
      if(this.shake < 0.1) this.shake = 0;
    }
  }
  doShake(s){ this.shake = Math.max(this.shake, s); }
}

// ============================================================
// DAMAGE NUMBERS
// ============================================================
const damageNumbers = [];
function spawnDamage(x,y,amount,color='#fff'){
  const text = typeof amount === 'string' ? amount : Math.round(amount);
  damageNumbers.push({ x, y, vy:-60, life:1, amount:text, color });
}
function updateDamage(dt){
  for(let i=damageNumbers.length-1;i>=0;i--){
    const d = damageNumbers[i];
    d.y += d.vy*dt; d.vy += 30*dt; d.life -= dt;
    if(d.life <= 0) damageNumbers.splice(i,1);
  }
}
function drawDamage(cam){
  ctx.font = 'bold 16px Courier New';
  ctx.textAlign = 'center';
  for(const d of damageNumbers){
    ctx.globalAlpha = clamp(d.life,0,1);
    ctx.fillStyle = '#000';
    ctx.fillText(d.amount, d.x-cam.x+1, d.y-cam.y+1);
    ctx.fillStyle = d.color;
    ctx.fillText(d.amount, d.x-cam.x, d.y-cam.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

// ============================================================
// BLOOD STAINS (FIFO max 50)
// ============================================================
const bloodStains = [];
function addBlood(x,y,color='#5a0000'){
  bloodStains.push({ x, y, r: rnd(8,16), color });
  if(bloodStains.length > 50) bloodStains.shift();
}
function drawBlood(cam){
  ctx.globalAlpha = 0.35;
  for(const b of bloodStains){
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x-cam.x, b.y-cam.y, b.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// MAP
// ============================================================
const MAP_W = 3000, MAP_H = 3000;
const TILE = 64;
class Obstacle {
  constructor(x,y,w,h,type='crate'){
    this.x=x;this.y=y;this.w=w;this.h=h;this.type=type;
    this.color = type==='crate' ? '#4a3728' : '#3a3a4a';
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    if(sx+this.w < 0 || sx > W || sy+this.h < 0 || sy > H) return;
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(sx+4, sy+4, this.w, this.h);
    // Body
    ctx.fillStyle = this.color;
    ctx.fillRect(sx, sy, this.w, this.h);
    // Top highlight
    ctx.fillStyle = this.type==='crate' ? '#6a5040' : '#5a5a6a';
    ctx.fillRect(sx, sy, this.w, 6);
    ctx.fillRect(sx, sy, 6, this.h);
    // Border
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx, sy, this.w, this.h);
    if(this.type==='crate'){
      ctx.strokeStyle = '#2a1f18';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx, sy+this.h/2); ctx.lineTo(sx+this.w, sy+this.h/2);
      ctx.moveTo(sx+this.w/2, sy); ctx.lineTo(sx+this.w/2, sy+this.h);
      ctx.stroke();
    }
  }
  collides(x,y,r){
    const cx = clamp(x, this.x, this.x+this.w);
    const cy = clamp(y, this.y, this.y+this.h);
    return dist2(x,y,cx,cy) < r*r;
  }
}

function drawFloor(cam){
  const sx0 = Math.floor(cam.x/TILE)*TILE;
  const sy0 = Math.floor(cam.y/TILE)*TILE;
  for(let x=sx0; x<cam.x+W+TILE; x+=TILE){
    for(let y=sy0; y<cam.y+H+TILE; y+=TILE){
      const i = ((x/TILE) + (y/TILE)) & 1;
      ctx.fillStyle = i ? '#0d0d1a' : '#111122';
      ctx.fillRect(x-cam.x, y-cam.y, TILE, TILE);
    }
  }
  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let x=sx0; x<cam.x+W+TILE; x+=TILE){
    ctx.moveTo(x-cam.x, 0); ctx.lineTo(x-cam.x, H);
  }
  for(let y=sy0; y<cam.y+H+TILE; y+=TILE){
    ctx.moveTo(0, y-cam.y); ctx.lineTo(W, y-cam.y);
  }
  ctx.stroke();
  // Map boundary
  ctx.strokeStyle = '#2a2a4a';
  ctx.lineWidth = 4;
  ctx.strokeRect(-cam.x, -cam.y, MAP_W, MAP_H);
}

// ============================================================
// WEAPONS
// ============================================================
class Weapon {
  constructor(name, color){
    this.name = name; this.color = color;
    this.fireRate = 0.3; this.cooldown = 0;
    this.specialCD = 8; this.specialT = 0;
    this.damage = 10;
    this.auto = true;
    this.unlimited = false;
    this.maxAmmo = 100;
    this.ammo = 100;
    this.refillAmount = 30;
  }
  update(dt){
    if(this.cooldown > 0) this.cooldown -= dt;
    if(this.specialT > 0) this.specialT -= dt;
  }
  canFire(){ return this.cooldown <= 0 && (this.unlimited || this.ammo > 0); }
  consumeAmmo(){ if(!this.unlimited) this.ammo = Math.max(0, this.ammo - 1); }
  refill(){
    if(this.unlimited) return;
    this.ammo = Math.min(this.maxAmmo, this.ammo + this.refillAmount);
  }
  fire(player, tx, ty){ this.cooldown = this.fireRate; }
  drawHand(ctx, player, aimAng){
    ctx.fillStyle = '#222';
    ctx.fillRect(8, -3, 18, 6);
  }
  special(player){ if(this.specialT <= 0) this.specialT = this.specialCD; }
}

class Punch extends Weapon {
  constructor(){
    super('Soco', '#ffcc99');
    this.fireRate = 0.35; this.damage = 22; this.specialCD = 5;
    this.unlimited = true;
  }
  fire(player, tx, ty){
    if(!this.canFire()) return;
    this.cooldown = this.fireRate;
    const a = ang(player.x, player.y, tx, ty);
    player.punchAnim = { ang: a, t: 0.18, max: 0.18 };
    let hit = false;
    for(const e of game.enemies){
      if(!e.alive) continue;
      const d = dist(player.x, player.y, e.x, e.y);
      if(d < 55){
        const ea = ang(player.x, player.y, e.x, e.y);
        let diff = ea - a;
        while(diff > Math.PI) diff -= TAU;
        while(diff < -Math.PI) diff += TAU;
        if(Math.abs(diff) < Math.PI*0.4){
          e.hurt(this.damage, '#ffe0aa');
          e.x += Math.cos(a)*25;
          e.y += Math.sin(a)*25;
          hit = true;
          for(let i=0;i<6;i++){
            game.particles.spawn({
              x:e.x, y:e.y, vx:rnd(-180,180), vy:rnd(-180,180),
              life:0.4, size:rnd(3,5), color:'#ffaa66', glow:true
            });
          }
        }
      }
    }
    if(hit) game.camera.doShake(2);
  }
  drawHand(ctx){
    ctx.fillStyle = '#3d5d3d';
    ctx.fillRect(2,-3,8,6);
    ctx.fillStyle = '#c8956c';
    ctx.beginPath(); ctx.arc(14, 0, 5, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#8a6244'; ctx.lineWidth = 1; ctx.stroke();
  }
  special(player){
    if(this.specialT > 0) return;
    this.specialT = this.specialCD;
    player.shockwave = { r:0, max:160, life:0.5, dmg:this.damage*2 };
    game.camera.doShake(10);
    for(const e of game.enemies){
      if(!e.alive) continue;
      const d = dist(player.x, player.y, e.x, e.y);
      if(d < 160){
        const a = ang(player.x, player.y, e.x, e.y);
        e.hurt(this.damage*2, '#fff');
        e.x += Math.cos(a)*70;
        e.y += Math.sin(a)*70;
        for(let i=0;i<8;i++){
          game.particles.spawn({
            x:e.x, y:e.y, vx:rnd(-250,250), vy:rnd(-250,250),
            life:0.5, size:rnd(3,6), color:'#ffaa66', glow:true
          });
        }
      }
    }
  }
}

class Pistol extends Weapon {
  constructor(){ super('Pistola', '#ffe066'); this.fireRate=0.25; this.damage=14; this.specialCD=4; this.maxAmmo=120; this.ammo=120; this.refillAmount=40; }
  fire(player,tx,ty){
    if(!this.canFire()) return;
    this.cooldown = this.fireRate;
    this.consumeAmmo();
    const a = ang(player.x, player.y, tx, ty);
    game.spawnProjectile({ x:player.x+Math.cos(a)*20, y:player.y+Math.sin(a)*20, vx:Math.cos(a)*700, vy:Math.sin(a)*700, dmg:this.damage, color:'#ffe066', size:4, weapon:'pistol', trail:true, life:1 });
    game.muzzleFlash(player.x+Math.cos(a)*24, player.y+Math.sin(a)*24, '#ffe066', 8);
  }
  drawHand(ctx){ ctx.fillStyle='#333'; ctx.fillRect(8,-3,16,6); ctx.fillStyle='#111'; ctx.fillRect(22,-2,4,4); }
  special(player){
    if(this.specialT > 0) return;
    this.specialT = this.specialCD;
    const a = ang(player.x, player.y, mouse.wx, mouse.wy);
    let i = 0;
    const offsets = [0.04, 0, -0.04];
    const fire = ()=>{
      if(i >= 3) return;
      const aa = a + offsets[i];
      game.spawnProjectile({ x:player.x+Math.cos(aa)*20, y:player.y+Math.sin(aa)*20, vx:Math.cos(aa)*700, vy:Math.sin(aa)*700, dmg:this.damage*1.2, color:'#ffaa66', size:5, weapon:'pistol', trail:true, life:1 });
      game.muzzleFlash(player.x+Math.cos(aa)*24, player.y+Math.sin(aa)*24, '#ffaa66', 10);
      i++;
      setTimeout(fire, 80);
    };
    fire();
  }
}

class MachineGun extends Weapon {
  constructor(){ super('Metralhadora', '#ff8c00'); this.fireRate=0.08; this.damage=8; this.specialCD=10; this.maxAmmo=300; this.ammo=300; this.refillAmount=100; }
  fire(player,tx,ty){
    if(!this.canFire()) return;
    this.cooldown = this.fireRate;
    this.consumeAmmo();
    const a = ang(player.x, player.y, tx, ty) + rnd(-0.08, 0.08);
    game.spawnProjectile({ x:player.x+Math.cos(a)*22, y:player.y+Math.sin(a)*22, vx:Math.cos(a)*900, vy:Math.sin(a)*900, dmg:this.damage, color:'#ff8c00', size:3, weapon:'mg', elongated:true, life:0.6 });
    game.muzzleFlash(player.x+Math.cos(a)*26, player.y+Math.sin(a)*26, '#ffd066', 10);
    game.camera.doShake(1.2);
  }
  drawHand(ctx){
    ctx.fillStyle='#444'; ctx.fillRect(8,-3,24,6);
    ctx.fillStyle='#222'; ctx.fillRect(14,3,8,5);
  }
  special(player){
    if(this.specialT > 0) return;
    this.specialT = this.specialCD;
    player.spin360 = 2;
    player.spin360Rot = 0;
  }
}

class Shotgun extends Weapon {
  constructor(){ super('Shotgun', '#dddddd'); this.fireRate=0.7; this.damage=9; this.specialCD=6; this.maxAmmo=30; this.ammo=30; this.refillAmount=12; }
  fire(player,tx,ty){
    if(!this.canFire()) return;
    this.cooldown = this.fireRate;
    this.consumeAmmo();
    const a = ang(player.x, player.y, tx, ty);
    for(let i=0;i<6;i++){
      const aa = a + rnd(-0.25, 0.25);
      const sp = rnd(600, 800);
      game.spawnProjectile({ x:player.x+Math.cos(aa)*20, y:player.y+Math.sin(aa)*20, vx:Math.cos(aa)*sp, vy:Math.sin(aa)*sp, dmg:this.damage, color:'#eee', size:3, weapon:'shotgun', life:0.4 });
    }
    game.muzzleFlash(player.x+Math.cos(a)*30, player.y+Math.sin(a)*30, '#fff', 30);
    game.camera.doShake(6);
    player.vx -= Math.cos(a)*150;
    player.vy -= Math.sin(a)*150;
  }
  drawHand(ctx){
    ctx.fillStyle='#5a4a2a'; ctx.fillRect(8,-5,20,10);
    ctx.fillStyle='#333'; ctx.fillRect(20,-4,8,3);
    ctx.fillRect(20,1,8,3);
  }
  special(player){
    if(this.specialT > 0) return;
    this.specialT = this.specialCD;
    const a = ang(player.x, player.y, mouse.wx, mouse.wy);
    for(let i=0;i<14;i++){
      const aa = a + rnd(-0.45, 0.45);
      const sp = rnd(550, 850);
      game.spawnProjectile({ x:player.x+Math.cos(aa)*20, y:player.y+Math.sin(aa)*20, vx:Math.cos(aa)*sp, vy:Math.sin(aa)*sp, dmg:this.damage*1.3, color:'#fff', size:4, weapon:'shotgun', life:0.5 });
    }
    game.muzzleFlash(player.x+Math.cos(a)*30, player.y+Math.sin(a)*30, '#fff', 80);
    game.camera.doShake(14);
    game.flashScreen = 0.15;
  }
}

class Sniper extends Weapon {
  constructor(){ super('Sniper', '#00ffff'); this.fireRate=1.0; this.damage=80; this.specialCD=12; this.charging=0; this.maxAmmo=15; this.ammo=15; this.refillAmount=6; }
  fire(player,tx,ty){
    if(!this.canFire()) return;
    this.cooldown = this.fireRate;
    this.consumeAmmo();
    const a = ang(player.x, player.y, tx, ty);
    game.spawnProjectile({ x:player.x+Math.cos(a)*22, y:player.y+Math.sin(a)*22, vx:Math.cos(a)*1500, vy:Math.sin(a)*1500, dmg:this.damage, color:'#00ffff', size:4, weapon:'sniper', pierce:true, life:0.8 });
    game.muzzleFlash(player.x+Math.cos(a)*28, player.y+Math.sin(a)*28, '#00ffff', 14);
    game.camera.doShake(4);
  }
  drawHand(ctx){
    ctx.fillStyle='#1a3a3a'; ctx.fillRect(8,-3,32,6);
    ctx.fillStyle='#0a2a2a'; ctx.fillRect(16,-5,8,3);
  }
  drawLaserSight(player, cam){
    const a = ang(player.x, player.y, mouse.wx, mouse.wy);
    ctx.save();
    ctx.strokeStyle = 'rgba(255,0,0,0.4)';
    ctx.lineWidth = 1;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.moveTo(player.x-cam.x, player.y-cam.y);
    ctx.lineTo(player.x-cam.x + Math.cos(a)*2000, player.y-cam.y + Math.sin(a)*2000);
    ctx.stroke();
    ctx.restore();
  }
  special(player){
    if(this.specialT > 0) return;
    this.specialT = this.specialCD;
    game.camera.tzoom = 2;
    player.sniperCharge = 2;
    setTimeout(()=>{
      game.camera.tzoom = 1;
      const a = ang(player.x, player.y, mouse.wx, mouse.wy);
      game.spawnProjectile({ x:player.x+Math.cos(a)*22, y:player.y+Math.sin(a)*22, vx:Math.cos(a)*1800, vy:Math.sin(a)*1800, dmg:this.damage*3, color:'#fff', size:14, weapon:'sniper', pierce:true, life:1, charged:true });
      game.flashScreen = 0.2;
      game.camera.doShake(20);
      player.sniperCharge = 0;
    }, 2000);
  }
}

class Flamethrower extends Weapon {
  constructor(){ super('Lança-Chamas', '#ff4500'); this.fireRate=0.02; this.damage=2.5; this.specialCD=10; this.maxAmmo=400; this.ammo=400; this.refillAmount=150; }
  fire(player,tx,ty){
    if(!this.canFire()) return;
    this.cooldown = this.fireRate;
    this.consumeAmmo();
    const a = ang(player.x, player.y, tx, ty);
    for(let i=0;i<3;i++){

  fire(player,tx,ty){

    // Beam is drawn directly, hit detection here
    const a = ang(player.x, player.y, tx, ty);

    for(const e of game.enemies){
      if(!e.alive) continue;

      if(t < 0 || t > range) continue;

      const py = player.y + Math.sin(a)*t;
      if(dist2(px,py,e.x,e.y) < e.r*e.r){

}

// PROJECTILES
// ============================================================
class Projectile {
  constructor(opts){
    Object.assign(this, opts);
    this.alive = true;
    this.history = [];
  }
  update(dt){
    if(this.trail || this.weapon==='mg' || this.weapon==='rocket'){
      this.history.push({x:this.x,y:this.y});
      if(this.history.length > 5) this.history.shift();
    }
    this.x += this.vx*dt; this.y += this.vy*dt;
    this.life -= dt;
    if(this.life <= 0){ this.alive = false; if(this.weapon==='rocket'){ game.explode(this.x, this.y, 80, this.dmg); } }
    if(this.x<0||this.x>MAP_W||this.y<0||this.y>MAP_H){ this.alive = false; }
    // Obstacle collision
    for(const o of game.obstacles){
      if(o.collides(this.x, this.y, this.size)){
        if(this.weapon==='rocket') game.explode(this.x, this.y, 80, this.dmg);
        else game.hitSpark(this.x, this.y, this.color);
        this.alive = false;
        return;
      }
    }
    // Rocket smoke trail
    if(this.weapon==='rocket'){
      game.particles.spawn({
        x:this.x+rnd(-3,3), y:this.y+rnd(-3,3), vx:rnd(-30,30), vy:rnd(-30,30),
        life:0.6, size:rnd(4,8), color:'#888', glow:false
      });
    }
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    if(this.history.length > 0){
      ctx.globalAlpha = 0.3;
      for(let i=0;i<this.history.length;i++){
        const h = this.history[i];
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(h.x-cam.x, h.y-cam.y, this.size*(i/this.history.length), 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    if(this.weapon === 'rocket'){
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(Math.atan2(this.vy, this.vx));
      ctx.fillStyle = '#5a7c4a';
      ctx.beginPath(); ctx.ellipse(0,0,12,5,0,0,TAU); ctx.fill();
      ctx.fillStyle = '#3a3a3a';
      ctx.beginPath(); ctx.moveTo(10,-5); ctx.lineTo(18,0); ctx.lineTo(10,5); ctx.fill();
      ctx.fillStyle = '#aaa';
      ctx.fillRect(-12,-6,4,3); ctx.fillRect(-12,3,4,3);
      // Flame
      ctx.fillStyle = '#ff8c00';
      ctx.beginPath(); ctx.moveTo(-12,-3); ctx.lineTo(-22,0); ctx.lineTo(-12,3); ctx.fill();
      ctx.restore();
    } else if(this.weapon === 'sniper'){
      ctx.save();
      ctx.shadowBlur = 20; ctx.shadowColor = this.color;
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(sx, sy, this.size, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    } else if(this.elongated){
      const len = 12;
      const a = Math.atan2(this.vy, this.vx);
      ctx.save();
      ctx.shadowBlur = 8; ctx.shadowColor = this.color;
      ctx.strokeStyle = this.color;
      ctx.lineWidth = this.size;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx - Math.cos(a)*len, sy - Math.sin(a)*len);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();
    } else {
      ctx.save();
      ctx.shadowBlur = 6; ctx.shadowColor = this.color;
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(sx, sy, this.size, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
}

// ENEMIES
// ============================================================
class Enemy {
  constructor(x,y){
    this.x=x;this.y=y;this.vx=0;this.vy=0;
    this.hp=10;this.maxHp=10;this.r=14;this.speed=80;
    this.alive=true;this.dmg=10;this.scoreVal=10;
    this.color='#fff';this.bobT=Math.random()*TAU;
    this.hitFlash=0;this.attackCD=0;this.burning=0;
    this.lastX = x; this.lastY = y;
    this.stuckT = 0;
    this.tangentSign = Math.random()<0.5 ? 1 : -1;
    this.repathT = 0;
  }
  // Steering: obstacle avoidance + tangent escape
  applyAvoidance(vx, vy){
    const safePad = 30;
    let ax = 0, ay = 0;
    for(const o of game.obstacles){
      const cx = clamp(this.x, o.x, o.x+o.w);
      const cy = clamp(this.y, o.y, o.y+o.h);
      const d = dist(this.x, this.y, cx, cy);
      const safeR = this.r + safePad;
      if(d < safeR){
        const dd = Math.max(d, 0.5);
        const ra = ang(cx, cy, this.x, this.y);
        const force = (safeR - dd) / safeR;
        ax += Math.cos(ra)*force*this.speed*2.2;
        ay += Math.sin(ra)*force*this.speed*2.2;
        // Tangent component to slide around the obstacle
        const ta = ra + this.tangentSign*Math.PI*0.5;
        ax += Math.cos(ta)*force*this.speed*1.0;
        ay += Math.sin(ta)*force*this.speed*1.0;
      }
    }
    vx += ax; vy += ay;
    const mag = Math.hypot(vx, vy);
    if(mag > this.speed){ vx = vx/mag*this.speed; vy = vy/mag*this.speed; }
    return [vx, vy];
  }
  // Detect stuck and flip tangent direction
  checkStuck(dt){
    const moved = dist(this.x, this.y, this.lastX, this.lastY);
    if(moved < this.speed*dt*0.3){
      this.stuckT += dt;
      if(this.stuckT > 0.4){
        this.tangentSign = -this.tangentSign;
        this.stuckT = 0;
      }
    } else {
      this.stuckT = Math.max(0, this.stuckT - dt*0.5);
    }
    this.lastX = this.x; this.lastY = this.y;
  }
  hurt(d, color){
    this.hp -= d;
    this.hitFlash = 0.1;
    spawnDamage(this.x, this.y - this.r, d, color);
    if(this.hp <= 0){
      this.alive = false;
      game.score += this.scoreVal;
      this.onDeath();
      addBlood(this.x, this.y);
      // Death burst
      for(let i=0;i<12;i++){
        game.particles.spawn({
          x:this.x, y:this.y, vx:rnd(-200,200), vy:rnd(-200,200),
          life:0.6, size:rnd(2,5), color:this.color, glow:false
        });
      }
    }
  }
  onDeath(){}
  update(dt){
    if(this.burning > 0){
      this.burning -= dt;
      if(Math.random() < 0.3){
        game.particles.spawn({
          x:this.x+rnd(-this.r,this.r), y:this.y+rnd(-this.r,this.r),
          vx:rnd(-20,20), vy:rnd(-60,-30),
          life:0.4, size:rnd(3,6), color:Math.random()<0.5?'#ff4500':'#ffaa00', glow:true
        });
      }
      if(Math.floor(this.burning*10) % 2 === 0){
        if(Math.random() < 0.05) this.hp -= 0.3;
      }
    }
    if(this.hitFlash > 0) this.hitFlash -= dt;
    this.bobT += dt*4;
    this.ai(dt);
    // Move on X and Y separately so collision on one axis doesn't freeze the other
    const stepX = this.vx*dt, stepY = this.vy*dt;
    this.x += stepX;
    for(const o of game.obstacles){
      if(o.collides(this.x, this.y, this.r)){
        if(stepX > 0) this.x = o.x - this.r - 0.1;
        else if(stepX < 0) this.x = o.x + o.w + this.r + 0.1;
      }
    }
    this.y += stepY;
    for(const o of game.obstacles){
      if(o.collides(this.x, this.y, this.r)){
        if(stepY > 0) this.y = o.y - this.r - 0.1;
        else if(stepY < 0) this.y = o.y + o.h + this.r + 0.1;
      }
    }
    this.x = clamp(this.x, this.r, MAP_W-this.r);
    this.y = clamp(this.y, this.r, MAP_H-this.r);
    this.checkStuck(dt);
    if(this.attackCD > 0) this.attackCD -= dt;
  }
  ai(dt){
    const p = game.player;
    const a = ang(this.x, this.y, p.x, p.y);
    let vx = Math.cos(a)*this.speed;
    let vy = Math.sin(a)*this.speed;
    [vx, vy] = this.applyAvoidance(vx, vy);
    // Smooth velocity to avoid jitter
    this.vx = lerp(this.vx, vx, 0.25);
    this.vy = lerp(this.vy, vy, 0.25);
    if(dist(this.x,this.y,p.x,p.y) < this.r + p.r && this.attackCD <= 0){
      p.hurt(this.dmg);
      this.attackCD = 1;
    }
  }
  drawShadow(cam){
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(this.x-cam.x, this.y-cam.y+this.r*0.6, this.r*0.8, this.r*0.3, 0, 0, TAU); ctx.fill();
  }
  drawHPBar(cam, w=30, alwaysShow=false){
    if(this.hp >= this.maxHp && !alwaysShow) return;
    const sx = this.x-cam.x, sy = this.y-cam.y-this.r-10;
    ctx.fillStyle = '#000';
    ctx.fillRect(sx-w/2-1, sy-1, w+2, 5);
    ctx.fillStyle = '#5a0000';
    ctx.fillRect(sx-w/2, sy, w, 3);
    ctx.fillStyle = '#ff3030';
    ctx.fillRect(sx-w/2, sy, w*(this.hp/this.maxHp), 3);
  }
  draw(cam){}
}

class Shooter extends Enemy {
  constructor(x,y){
    super(x,y);
    this.hp=this.maxHp=40; this.r=12; this.speed=50; this.dmg=10;
    this.scoreVal=25; this.color='#c8a800'; this.shootCD=0; this.recoil=0;
  }
  ai(dt){
    const p = game.player;
    const d = dist(this.x,this.y,p.x,p.y);
    const a = ang(this.x, this.y, p.x, p.y);
    let tvx, tvy;
    if(d > 300){
      tvx = Math.cos(a)*this.speed;
      tvy = Math.sin(a)*this.speed;
    } else if(d < 200){
      tvx = -Math.cos(a)*this.speed;
      tvy = -Math.sin(a)*this.speed;
    } else {
      tvx = Math.cos(a + Math.PI*0.5*this.tangentSign)*this.speed*0.5;
      tvy = Math.sin(a + Math.PI*0.5*this.tangentSign)*this.speed*0.5;
    }
    [tvx, tvy] = this.applyAvoidance(tvx, tvy);
    this.vx = lerp(this.vx, tvx, 0.2);
    this.vy = lerp(this.vy, tvy, 0.2);
    if(this.shootCD <= 0 && d < 500){
      this.shootCD = 1.8;
      this.recoil = 0.2;
      game.spawnEnemyProjectile(this.x+Math.cos(a)*16, this.y+Math.sin(a)*16, Math.cos(a)*450, Math.sin(a)*450, this.dmg, '#c8a800');
    } else this.shootCD -= dt;
    if(this.recoil > 0) this.recoil -= dt;
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    this.drawShadow(cam);
    const a = ang(this.x, this.y, game.player.x, game.player.y);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(a);
    if(this.recoil > 0) ctx.translate(-4*this.recoil/0.2, 0);
    // Body
    ctx.fillStyle = this.hitFlash>0?'#fff':'#a88800';
    ctx.beginPath(); ctx.ellipse(0,0,8,11,0,0,TAU); ctx.fill();
    // Head
    ctx.fillStyle = this.hitFlash>0?'#fff':'#c8956c';
    ctx.beginPath(); ctx.arc(5,0,6,0,TAU); ctx.fill();
    // Hood triangle
    ctx.fillStyle = '#6a4a00';
    ctx.beginPath();
    ctx.moveTo(2,-8); ctx.lineTo(10,0); ctx.lineTo(2,8); ctx.fill();
    // Gun
    ctx.fillStyle = '#222';
    ctx.fillRect(6,-1,16,3);
    // Eyes
    ctx.shadowBlur = 4; ctx.shadowColor = '#ffff00';
    ctx.fillStyle = '#ffff00';
    ctx.beginPath(); ctx.arc(7,-2,1,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(7,2,1,0,TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
    this.drawHPBar(cam);
  }
}

class Exploder extends Enemy {
  constructor(x,y){
    super(x,y);
    this.hp=this.maxHp=25; this.r=18; this.speed=90; this.dmg=35;
    this.scoreVal=30; this.color='#e05a00'; this.pulse=0;
  }
  ai(dt){
    super.ai(dt);
    const d = dist(this.x,this.y,game.player.x,game.player.y);
    this.pulseRate = d < 80 ? 12 : (d < 200 ? 6 : 3);
    this.pulse += dt * this.pulseRate;
    if(d < 35 && this.attackCD <= 0){
      game.explode(this.x, this.y, 80, this.dmg);
      this.hp = 0;
      this.alive = false;
      game.score += this.scoreVal;
      addBlood(this.x, this.y, '#5a2000');
    }
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    this.drawShadow(cam);
    const scale = 1 + Math.sin(this.pulse)*0.08;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(scale, scale);
    // Sparks
    for(let i=0;i<5;i++){
      const a = this.pulse + i*TAU/5;
      ctx.strokeStyle = '#ffaa00';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*18, Math.sin(a)*18);
      ctx.lineTo(Math.cos(a)*24, Math.sin(a)*24);
      ctx.stroke();
    }
    ctx.shadowBlur = 12 + Math.sin(this.pulse)*8;
    ctx.shadowColor = '#ff4500';
    ctx.fillStyle = this.hitFlash>0?'#fff':'#e05a00';
    ctx.beginPath(); ctx.arc(0,0,16,0,TAU); ctx.fill();
    ctx.shadowBlur = 0;
    // Cross/skull
    ctx.fillStyle = '#000';
    ctx.fillRect(-1,-7,2,14);
    ctx.fillRect(-7,-1,14,2);
    ctx.restore();
    this.drawHPBar(cam);
  }
}

class Ghost extends Enemy {
  constructor(x,y){
    super(x,y);
    this.hp=this.maxHp=35; this.r=16; this.speed=100; this.dmg=12;
    this.scoreVal=20; this.color='#7b2d8b'; this.flick=Math.random()*TAU;
    this.trail = [];
  }
  ai(dt){
    super.ai(dt);
    this.flick += dt*3;
    this.trail.push({x:this.x,y:this.y,t:0.3});
    if(this.trail.length > 8) this.trail.shift();
    for(const t of this.trail) t.t -= dt;
  }
  draw(cam){
    const a = 0.45 + Math.sin(this.flick)*0.25;
    // Trail
    for(const t of this.trail){
      if(t.t<=0) continue;
      ctx.globalAlpha = t.t * 0.3;
      this.drawBody(t.x-cam.x, t.y-cam.y);
    }
    ctx.globalAlpha = a;
    this.drawBody(this.x-cam.x, this.y-cam.y);
    ctx.globalAlpha = 1;
    this.drawHPBar(cam);
  }
  drawBody(sx, sy){
    ctx.fillStyle = this.hitFlash>0?'#fff':'#7b2d8b';
    ctx.beginPath();
    ctx.arc(sx, sy-4, 14, Math.PI, 0);
    ctx.bezierCurveTo(sx+14, sy+8, sx+8, sy+12, sx+4, sy+8);
    ctx.bezierCurveTo(sx, sy+14, sx-4, sy+8, sx-8, sy+12);
    ctx.bezierCurveTo(sx-14, sy+8, sx-14, sy+4, sx-14, sy-4);
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(sx-4,sy-6,3,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+4,sy-6,3,0,TAU); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(sx-4,sy-6,1.5,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+4,sy-6,1.5,0,TAU); ctx.fill();
  }
}

class Swarm extends Enemy {
  constructor(x,y){
    super(x,y);
    this.hp=this.maxHp=8; this.r=8; this.speed=140; this.dmg=4;
    this.scoreVal=5; this.color='#e040a0'; this.wing=Math.random()*TAU;
  }
  ai(dt){
    const p = game.player;
    let ax = 0, ay = 0;
    const toP = ang(this.x, this.y, p.x, p.y);
    ax += Math.cos(toP); ay += Math.sin(toP);
    // Swarm flocking
    let nx=0,ny=0,n=0;
    for(const e of game.enemies){
      if(e === this || !(e instanceof Swarm) || !e.alive) continue;
      const d2 = dist2(this.x,this.y,e.x,e.y);
      if(d2 < 60*60){
        const a = ang(e.x, e.y, this.x, this.y);
        nx += Math.cos(a); ny += Math.sin(a);
        n++;
      }
    }
    if(n > 0){ ax += nx/n*0.6; ay += ny/n*0.6; }
    const mag = Math.hypot(ax,ay);
    if(mag > 0){ ax/=mag; ay/=mag; }
    let tvx = ax*this.speed, tvy = ay*this.speed;
    [tvx, tvy] = this.applyAvoidance(tvx, tvy);
    this.vx = lerp(this.vx, tvx, 0.3);
    this.vy = lerp(this.vy, tvy, 0.3);
    if(dist(this.x,this.y,p.x,p.y) < this.r + p.r && this.attackCD <= 0){
      p.hurt(this.dmg);
      this.attackCD = 0.5;
    }
    this.wing += dt*20;
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    const a = Math.atan2(this.vy, this.vx);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(a);
    // Wings
    const wingScale = Math.sin(this.wing)*0.6;
    ctx.fillStyle = 'rgba(255,100,180,0.6)';
    ctx.beginPath(); ctx.ellipse(-2,-4-wingScale*2,6,2,-0.5,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-2,4+wingScale*2,6,2,0.5,0,TAU); ctx.fill();
    // Legs
    ctx.strokeStyle = '#a02080'; ctx.lineWidth = 1;
    for(let i=-1;i<=1;i+=2){
      ctx.beginPath();
      ctx.moveTo(0,0); ctx.lineTo(-3,i*5);
      ctx.moveTo(0,0); ctx.lineTo(3,i*5);
      ctx.stroke();
    }
    // Body
    ctx.fillStyle = this.hitFlash>0?'#fff':'#e040a0';
    ctx.beginPath(); ctx.ellipse(0,0,6,4,0,0,TAU); ctx.fill();
    ctx.restore();
  }
}

class Boss extends Enemy {
  constructor(x,y, tier=1){
    super(x,y);
    this.tier = tier;
    this.hp = this.maxHp = 1500 + tier*500;
    this.r = 60; this.speed = 35; this.dmg = 30;
    this.scoreVal = 500; this.color='#1a0a2e';
    this.attackT = 0;
    this.eyeGlow = 0;
  }
  ai(dt){
    super.ai(dt);
    this.attackT += dt;
    this.eyeGlow += dt*3;
    const p = game.player;
    if(this.attackT > 2.5){
      this.attackT = 0;
      const a = ang(this.x, this.y, p.x, p.y);
      // Spread shot
      for(let i=-2;i<=2;i++){
        const aa = a + i*0.18;
        game.spawnEnemyProjectile(this.x+Math.cos(aa)*60, this.y+Math.sin(aa)*60, Math.cos(aa)*400, Math.sin(aa)*400, this.dmg, '#ff4400');
      }
    }
    if(this.hp < this.maxHp*0.6 && this.attackT > 1.2 && Math.random()<0.3){
      // Summon swarm in phase 2+
      if(game.enemies.filter(e=>e instanceof Swarm).length < 8){
        for(let i=0;i<3;i++){
          game.enemies.push(new Swarm(this.x+rnd(-40,40), this.y+rnd(-40,40)));
        }
      }
    }
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    const hpr = this.hp / this.maxHp;
    const phase = hpr > 0.6 ? 1 : (hpr > 0.3 ? 2 : 3);
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.ellipse(sx, sy+40, 60, 16, 0, 0, TAU); ctx.fill();
    const a = ang(this.x, this.y, game.player.x, game.player.y);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(a);
    // Shoulders with spikes
    for(const sgn of [-1,1]){
      ctx.fillStyle = this.hitFlash>0?'#fff':'#0a0518';
      ctx.beginPath(); ctx.arc(-5, sgn*35, 20, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
      for(let i=0;i<6;i++){
        const sa = (i/6)*TAU;
        ctx.beginPath();
        ctx.moveTo(-5+Math.cos(sa)*16, sgn*35+Math.sin(sa)*16);
        ctx.lineTo(-5+Math.cos(sa)*26, sgn*35+Math.sin(sa)*26);
        ctx.stroke();
      }
    }
    // Body
    let bodyColor = '#1a0a2e';
    if(phase === 3){
      const pulse = 0.5 + Math.sin(this.eyeGlow*2)*0.5;
      bodyColor = `rgb(${50+pulse*150},${20+pulse*30},${30})`;
    } else if(this.hitFlash > 0) bodyColor = '#fff';
    ctx.fillStyle = bodyColor;
    ctx.fillRect(-40,-40,80,80);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.strokeRect(-40,-40,80,80);
    // Phase 2+ cracks
    if(phase >= 2){
      ctx.strokeStyle = '#ff6600';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 6; ctx.shadowColor = '#ff6600';
      ctx.beginPath();
      ctx.moveTo(-30,-20); ctx.lineTo(-10,5); ctx.lineTo(-25,25);
      ctx.moveTo(20,-30); ctx.lineTo(30,-5); ctx.lineTo(15,15); ctx.lineTo(30,30);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    // Crown of spikes
    ctx.fillStyle = '#000';
    for(let i=-3;i<=3;i++){
      ctx.beginPath();
      ctx.moveTo(35+i*2,-40); ctx.lineTo(40+i*2,-55); ctx.lineTo(45+i*2,-40); ctx.fill();
    }
    // Eyes
    const eg = 0.7 + Math.sin(this.eyeGlow)*0.3;
    ctx.shadowBlur = 20*eg; ctx.shadowColor = phase===3?'#ff6600':'#ff0000';
    ctx.fillStyle = phase===3?'#ffaa00':'#ff0000';
    ctx.beginPath(); ctx.arc(20,-12,6,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(20,12,6,0,TAU); ctx.fill();
    if(phase === 3){
      // Flame eyes
      for(let i=0;i<3;i++){
        const ay = 20 - i*3;
        ctx.fillStyle = i===0?'#fff':(i===1?'#ffaa00':'#ff4400');
        ctx.beginPath(); ctx.arc(20+rnd(-2,2),-12+rnd(-2,2)-i*2,4-i,0,TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(20+rnd(-2,2),12+rnd(-2,2)-i*2,4-i,0,TAU); ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

// WEAPON DROPS
// ============================================================
class WeaponDrop {
  constructor(x,y,idx){
    this.x=x;this.y=y;this.idx=idx;
    const cls = WEAPON_CLASSES[idx];
    const tmp = new cls();
    this.name = tmp.name;
    this.color = tmp.color;
    this.t = 0;
    this.alive = true;
  }
  update(dt){
    this.t += dt;
    if(dist(this.x, this.y, game.player.x, game.player.y) < 28){
      const idx = this.idx;
      const existing = game.player.weapons[idx];
      if(!existing){
        game.player.weapons[idx] = new WEAPON_CLASSES[idx]();
        game.player.switchWeapon(idx);
        spawnDamage(game.player.x, game.player.y - game.player.r - 10, this.name.toUpperCase(), this.color);
      } else {
        if(existing.unlimited){
          spawnDamage(game.player.x, game.player.y - game.player.r - 10, '∞', this.color);
        } else {
          const before = existing.ammo;
          existing.refill();
          const gained = existing.ammo - before;
          spawnDamage(game.player.x, game.player.y - game.player.r - 10, '+'+gained+' ammo', this.color);
        }
      }
      // Pickup particles
      for(let i=0;i<10;i++){
        const a = Math.random()*TAU;
        game.particles.spawn({
          x:this.x, y:this.y, vx:Math.cos(a)*120, vy:Math.sin(a)*120,
          life:0.5, size:rnd(2,4), color:this.color, glow:true
        });
      }
      this.alive = false;
    }
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    const scale = 1 + Math.sin(this.t*3)*0.15;
    const close = dist(this.x, this.y, game.player.x, game.player.y) < 100;
    const blink = close ? (Math.sin(this.t*15)*0.5+0.5) : 0;
    // Aura rotating
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(this.t*2);
    const grad = ctx.createRadialGradient(0,0,4,0,0,24);
    grad.addColorStop(0, this.color+'88');
    grad.addColorStop(1, this.color+'00');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0,0,24,0,TAU); ctx.fill();
    // Rays
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    for(let i=0;i<4;i++){
      const a = i*TAU/4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*14, Math.sin(a)*14);
      ctx.lineTo(Math.cos(a)*22, Math.sin(a)*22);
      ctx.stroke();
    }
    ctx.restore();
    // Icon
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(scale, scale);
    ctx.fillStyle = '#222';
    ctx.fillRect(-12,-3,24,6);
    ctx.fillStyle = this.color;
    ctx.fillRect(-10,-2,20,4);
    if(blink > 0){
      ctx.globalAlpha = blink*0.5;
      ctx.fillStyle = '#fff';
      ctx.fillRect(-12,-3,24,6);
    }
    ctx.restore();
    // Name
    ctx.font = 'bold 11px Courier New';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#000';
    ctx.fillText(this.name, sx+1, sy-18+1);
    ctx.fillStyle = this.color;
    ctx.fillText(this.name, sx, sy-18);
    ctx.textAlign = 'left';
  }
}

// ============================================================
// HEALTH DROPS (20/30/50% of max HP)
// ============================================================
class HealthDrop {
  constructor(x,y, amount=null){
    this.x=x;this.y=y;
    if(amount === null){
      const r = Math.random();
      this.amount = r < 0.6 ? 20 : (r < 0.9 ? 30 : 50);
    } else this.amount = amount;
    this.color = this.amount === 50 ? '#ff66bb' : (this.amount === 30 ? '#66ff88' : '#aaffaa');
    this.glowColor = this.amount === 50 ? '#ff66bb' : (this.amount === 30 ? '#33ff55' : '#88ee88');
    this.t = 0;
    this.alive = true;
  }
  update(dt){
    this.t += dt;
    if(dist(this.x, this.y, game.player.x, game.player.y) < 28){
      const heal = Math.round(game.player.maxHp * (this.amount/100));
      const before = game.player.hp;
      game.player.hp = Math.min(game.player.maxHp, game.player.hp + heal);
      const gained = Math.round(game.player.hp - before);
      spawnDamage(game.player.x, game.player.y - game.player.r - 10, '+'+gained+' HP', '#22ff44');
      for(let i=0;i<18;i++){
        const a = Math.random()*TAU;
        game.particles.spawn({
          x:this.x, y:this.y, vx:Math.cos(a)*rnd(80,180), vy:Math.sin(a)*rnd(80,180),
          life:rnd(0.4,0.8), size:rnd(3,6), color:this.color, glow:true
        });
      }
      // Hearts floating up
      for(let i=0;i<5;i++){
        game.particles.spawn({
          x:game.player.x+rnd(-10,10), y:game.player.y, vx:rnd(-30,30), vy:rnd(-120,-60),
          life:0.8, size:5, color:'#ff5577', glow:true
        });
      }
      this.alive = false;
    }
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    const scale = 1 + Math.sin(this.t*4)*0.18;
    // Rotating aura
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(-this.t*2);
    const grad = ctx.createRadialGradient(0,0,4,0,0,24);
    grad.addColorStop(0, this.glowColor+'aa');
    grad.addColorStop(1, this.glowColor+'00');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0,0,24,0,TAU); ctx.fill();
    ctx.restore();
    // Cross icon
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(scale, scale);
    ctx.shadowBlur = 14; ctx.shadowColor = this.glowColor;
    ctx.fillStyle = this.color;
    ctx.fillRect(-3,-11,6,22);
    ctx.fillRect(-11,-3,22,6);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-3,-11,6,22);
    ctx.strokeRect(-11,-3,22,6);
    ctx.restore();
    // Amount label
    ctx.font = 'bold 12px Courier New';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#000';
    ctx.fillText(`+${this.amount}%`, sx+1, sy-20+1);
    ctx.fillStyle = this.color;
    ctx.fillText(`+${this.amount}%`, sx, sy-20);
    ctx.textAlign = 'left';
  }
}

// ============================================================
// PLAYER
// ============================================================
class Player {
  constructor(){
    this.x = MAP_W/2; this.y = MAP_H/2;
    this.vx=0;this.vy=0;
    this.r = 14;
    this.hp = this.maxHp = 100;
    this.speed = 240;
    this.weapons = [new Punch(), new Pistol(), null, null, null, null, null, null, null];
    this.weaponIdx = 1;
    this.aimAng = 0;
    this.walkT = 0;
    this.invuln = 0;
    this.dashCD = 0;
    this.dash = null;
    this.swing = null;
    this.spin360 = 0; this.spin360Rot = 0;
    this.fireRing = null;
    this.missileTarget = null;
    this.laserBeam = null;
    this.rotLaser = null;
    this.sniperCharge = 0;
    this.punchAnim = null;
    this.shockwave = null;
  }
  get weapon(){ return this.weapons[this.weaponIdx]; }
  switchWeapon(idx){
    if(idx < 0 || idx >= NUM_SLOTS) return;
    if(!this.weapons[idx]) return;
    this.weaponIdx = idx;
  }
  autoSwitchIfEmpty(){
    const w = this.weapon;
    if(!w) return;
    if(w.unlimited || w.ammo > 0) return;
    // Find any weapon with ammo, prefer Pistol then Punch
    for(let i=1;i<NUM_SLOTS;i++){
      const ww = this.weapons[i];
      if(ww && (ww.unlimited || ww.ammo > 0)){ this.weaponIdx = i; return; }
    }
    if(this.weapons[0]) this.weaponIdx = 0;
  }
  hurt(d){
    if(this.invuln > 0) return;
    this.hp -= d;
    this.invuln = 0.5;
    game.camera.doShake(8);
    spawnDamage(this.x, this.y - this.r, d, '#ff4444');
    if(this.hp <= 0){ this.hp = 0; game.gameOver(); }
  }
  useSpecial(){
    this.weapon?.special(this);
  }
  update(dt){
    this.aimAng = ang(this.x, this.y, mouse.wx, mouse.wy);
    if(this.invuln > 0) this.invuln -= dt;
    if(this.dashCD > 0) this.dashCD -= dt;

    // Dash from shift
    if(keys['shift'] && this.dashCD <= 0){
      const ix = (keys['d']?1:0) - (keys['a']?1:0);
      const iy = (keys['s']?1:0) - (keys['w']?1:0);
      if(ix !== 0 || iy !== 0){
        const a = Math.atan2(iy, ix);
        this.x += Math.cos(a)*80;
        this.y += Math.sin(a)*80;
        this.dashCD = 1.5;
        this.invuln = 0.2;
        for(let i=0;i<10;i++){
          game.particles.spawn({ x:this.x, y:this.y, vx:rnd(-100,100), vy:rnd(-100,100), life:0.4, size:rnd(2,4), color:'#fff', glow:true });
        }
      }
    }

    // Movement
    let ix = (keys['d']?1:0) - (keys['a']?1:0);
    let iy = (keys['s']?1:0) - (keys['w']?1:0);
    if(ix !== 0 || iy !== 0){
      const mag = Math.hypot(ix, iy);
      ix /= mag; iy /= mag;
      this.vx = lerp(this.vx, ix*this.speed, 0.2);
      this.vy = lerp(this.vy, iy*this.speed, 0.2);
      this.walkT += dt*8;
    } else {
      this.vx *= 0.85; this.vy *= 0.85;
    }

    // Dash slash override
    if(this.dash){
      this.dash.t -= dt;
      const t = 1 - this.dash.t/this.dash.max;
      this.x = lerp(this.dash.sx, this.dash.tx, t);
      this.y = lerp(this.dash.sy, this.dash.ty, t);
      if(this.dash.t <= 0) this.dash = null;
      // Ghost trail
      if(Math.random() < 0.5){
        game.particles.spawn({ x:this.x, y:this.y, vx:0, vy:0, life:0.3, size:14, color:'#88aaff', glow:true, type:'circle' });
      }
    } else {
      this.x += this.vx*dt;
      this.y += this.vy*dt;
    }

    // Obstacle collision
    for(const o of game.obstacles){
      if(o.collides(this.x, this.y, this.r)){
        const cx = clamp(this.x, o.x, o.x+o.w);
        const cy = clamp(this.y, o.y, o.y+o.h);
        const a = ang(cx, cy, this.x, this.y);
        this.x = cx + Math.cos(a)*this.r;
        this.y = cy + Math.sin(a)*this.r;
      }
    }
    this.x = clamp(this.x, this.r, MAP_W-this.r);
    this.y = clamp(this.y, this.r, MAP_H-this.r);

    // Weapon update
    for(const w of this.weapons) if(w) w.update(dt);

    // Fire
    if(mouse.down || mouse.pressed){
      this.weapon.fire(this, mouse.wx, mouse.wy);
      mouse.pressed = false;
      this.autoSwitchIfEmpty();
    }

    // Punch swing anim
    if(this.punchAnim){
      this.punchAnim.t -= dt;
      if(this.punchAnim.t <= 0) this.punchAnim = null;
    }
    // Shockwave (punch special)
    if(this.shockwave){
      this.shockwave.life -= dt;
      const t = 1 - this.shockwave.life/0.5;
      this.shockwave.r = lerp(0, this.shockwave.max, Math.min(1, t));
      if(this.shockwave.life <= 0) this.shockwave = null;
    }

    // Spin 360 special (MG)
    if(this.spin360 > 0){
      this.spin360 -= dt;
      this.spin360Rot += dt*12;
      if(Math.random() < 0.6){
        const a = this.spin360Rot;
        game.spawnProjectile({ x:this.x+Math.cos(a)*22, y:this.y+Math.sin(a)*22, vx:Math.cos(a)*900, vy:Math.sin(a)*900, dmg:10, color:'#ff8c00', size:3, weapon:'mg', elongated:true, life:0.5 });
      }
    }

    // Fire ring (flamethrower special)
    if(this.fireRing){
      this.fireRing.life -= dt;
      const t = 1 - this.fireRing.life/1.5;
      this.fireRing.r = lerp(0, 150, Math.min(1, t*3));
      // Damage enemies
      for(const e of game.enemies){
        if(!e.alive) continue;
        const d = dist(this.x, this.y, e.x, e.y);
        if(Math.abs(d - this.fireRing.r) < 30){
          e.hurt(this.fireRing.dmg * dt * 5, '#ff4500');
          e.burning = 3;
        }
      }
      // Particles
      for(let i=0;i<5;i++){
        const a = Math.random()*TAU;
        game.particles.spawn({
          x:this.x+Math.cos(a)*this.fireRing.r, y:this.y+Math.sin(a)*this.fireRing.r,
          vx:Math.cos(a)*30, vy:Math.sin(a)*30 - 40,
          life:0.5, size:rnd(4,10), color:Math.random()<0.5?'#ff4500':'#ffaa00', glow:true
        });
      }
      if(this.fireRing.life <= 0) this.fireRing = null;
    }

    // Missile target preview
    if(this.missileTarget){
      this.missileTarget.life -= dt;
      if(this.missileTarget.life <= 0) this.missileTarget = null;
    }

    // Rotating laser
    if(this.rotLaser){
      this.rotLaser.t -= dt;
      this.rotLaser.ang += dt*TAU/3;
      const a = this.rotLaser.ang;
      const range = 600;
      for(const e of game.enemies){
        if(!e.alive) continue;
        const dx = e.x - this.x, dy = e.y - this.y;
        const t = (dx*Math.cos(a) + dy*Math.sin(a));
        if(t < 0 || t > range) continue;
        const px = this.x + Math.cos(a)*t;
        const py = this.y + Math.sin(a)*t;
        if(dist2(px,py,e.x,e.y) < e.r*e.r){
          e.hurt(60*dt, '#00ff88');
        }
      }
      if(this.rotLaser.t <= 0) this.rotLaser = null;
    }

    // Swing decay
    if(this.swing){
      this.swing.t -= dt;
      if(this.swing.t <= 0) this.swing = null;
    }
  }
  drawLaserBeam(cam){
    if(this.laserBeam){
      const b = this.laserBeam;
      const ex = this.x + Math.cos(b.ang)*b.range;
      const ey = this.y + Math.sin(b.ang)*b.range;
      const sx = this.x-cam.x, sy = this.y-cam.y;
      const eex = ex-cam.x, eey = ey-cam.y;
      let col1 = '#00ff88';
      if(b.heat > 0.7) col1 = '#ffff00';
      if(b.heat > 0.9) col1 = '#ffffff';
      ctx.save();
      ctx.shadowBlur = 20; ctx.shadowColor = col1;
      ctx.strokeStyle = col1 + '66';
      ctx.lineWidth = 8 + b.heat*4;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(eex, eey); ctx.stroke();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(eex, eey); ctx.stroke();
      ctx.shadowBlur = 0;
      // Impact spark
      for(let i=0;i<3;i++){
        const a = Math.random()*TAU;
        game.particles.spawn({
          x:ex+rnd(-4,4), y:ey+rnd(-4,4), vx:Math.cos(a)*100, vy:Math.sin(a)*100,
          life:0.3, size:3, color:col1, glow:true
        });
      }
      ctx.restore();
      this.laserBeam = null;
    }
    if(this.rotLaser){
      const a = this.rotLaser.ang;
      const sx = this.x-cam.x, sy = this.y-cam.y;
      ctx.save();
      ctx.shadowBlur = 25; ctx.shadowColor = '#00ff88';
      ctx.strokeStyle = '#00ff8866';
      ctx.lineWidth = 12;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx+Math.cos(a)*600, sy+Math.sin(a)*600); ctx.stroke();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx+Math.cos(a)*600, sy+Math.sin(a)*600); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(sx, sy+10, 14, 5, 0, 0, TAU); ctx.fill();

    // Shockwave ring (punch special)
    if(this.shockwave){
      ctx.save();
      ctx.strokeStyle = '#ffcc99';
      ctx.lineWidth = 6;
      ctx.shadowBlur = 18; ctx.shadowColor = '#ffaa66';
      ctx.globalAlpha = clamp(this.shockwave.life/0.5, 0, 1);
      ctx.beginPath(); ctx.arc(sx, sy, this.shockwave.r, 0, TAU); ctx.stroke();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#fff';
      ctx.beginPath(); ctx.arc(sx, sy, this.shockwave.r, 0, TAU); ctx.stroke();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      ctx.restore();
    }

    // Sniper charge effect
    if(this.sniperCharge > 0){
      this.sniperCharge -= 0.016;
      const r = (1 - this.sniperCharge/2) * 30;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.8;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
      for(let i=0;i<2;i++){
        const a = Math.random()*TAU;
        game.particles.spawn({
          x:this.x+Math.cos(a)*30, y:this.y+Math.sin(a)*30,
          vx:-Math.cos(a)*60, vy:-Math.sin(a)*60,
          life:0.3, size:3, color:'#fff', glow:true
        });
      }
    }

    // Fire ring
    if(this.fireRing){
      ctx.save();
      ctx.strokeStyle = '#ff4500';
      ctx.lineWidth = 4;
      ctx.shadowBlur = 15; ctx.shadowColor = '#ff4500';
      ctx.globalAlpha = clamp(this.fireRing.life/1.5, 0, 1);
      ctx.beginPath(); ctx.arc(sx, sy, this.fireRing.r, 0, TAU); ctx.stroke();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      ctx.restore();
    }

    // Spin360 ring
    if(this.spin360 > 0){
      ctx.save();
      ctx.strokeStyle = '#ff8c00';
      ctx.lineWidth = 3;
      ctx.globalAlpha = this.spin360/2;
      const pulse = 25 + Math.sin(this.spin360*10)*8;
      ctx.beginPath(); ctx.arc(sx, sy, pulse, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // Missile target indicator
    if(this.missileTarget){
      const t = mouse.wx, ty2 = mouse.wy;
      ctx.save();
      ctx.strokeStyle = '#ff4400';
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 6]);
      ctx.globalAlpha = 0.7;
      ctx.beginPath(); ctx.arc(this.missileTarget.x-cam.x, this.missileTarget.y-cam.y, 120, 0, TAU); ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(this.aimAng);
    // Legs
    const legSwing = Math.sin(this.walkT)*3;
    ctx.fillStyle = '#2d4a2d';
    ctx.fillRect(-4, -8+legSwing, 5, 8);
    ctx.fillRect(-4, 3-legSwing, 5, 8);
    // Body
    ctx.fillStyle = this.invuln>0?'#fff':'#4a7c59';
    ctx.beginPath(); ctx.ellipse(0,0,11,9,0,0,TAU); ctx.fill();
    ctx.strokeStyle = '#2d4a2d'; ctx.lineWidth = 1;
    ctx.stroke();
    // Left arm
    ctx.fillStyle = '#3d5d3d';
    ctx.fillRect(-2, -10, 5, 4);
    // Right arm + weapon
    ctx.fillRect(2, 6, 8, 4);
    // Weapon held in front
    if(this.weapon) this.weapon.drawHand(ctx, this, this.aimAng);
    // Head
    ctx.fillStyle = '#c8956c';
    ctx.beginPath(); ctx.arc(2,0,6,0,TAU); ctx.fill();
    // Helmet
    ctx.fillStyle = '#2d4a2d';
    ctx.beginPath();
    ctx.arc(2,0,6.5,Math.PI*0.8,Math.PI*1.2,true);
    ctx.fill();
    ctx.fillRect(-1,-6,7,3);
    // Direction triangle
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(10,-2); ctx.lineTo(13,0); ctx.lineTo(10,2); ctx.fill();
    ctx.restore();

    // Punch animation (fist extends)
    if(this.punchAnim){
      const pt = 1 - this.punchAnim.t/this.punchAnim.max;
      const ext = Math.sin(pt*Math.PI)*22;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(this.punchAnim.ang);
      // Arm
      ctx.fillStyle = '#3d5d3d';
      ctx.fillRect(0,-3,12+ext*0.5,6);
      // Fist
      ctx.fillStyle = '#c8956c';
      ctx.beginPath(); ctx.arc(14+ext, 0, 7, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#8a6244'; ctx.lineWidth = 1.5; ctx.stroke();
      // Impact lines
      if(pt > 0.3 && pt < 0.85){
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        for(let i=-1;i<=1;i++){
          if(i===0) continue;
          ctx.beginPath();
          ctx.moveTo(20+ext, i*4);
          ctx.lineTo(30+ext, i*8);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    // Katana swing arc
    if(this.swing){
      const t = this.swing.t/this.swing.max;
      const big = this.swing.big;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(this.swing.ang);
      ctx.globalAlpha = t;
      ctx.strokeStyle = '#aaccff';
      ctx.lineWidth = big ? 8 : 4;
      ctx.shadowBlur = 15; ctx.shadowColor = '#00aaff';
      ctx.beginPath();
      ctx.arc(0, 0, big?100:60, -Math.PI*(big?0.5:0.4), Math.PI*(big?0.5:0.4));
      ctx.stroke();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = big ? 3 : 2;
      ctx.beginPath();
      ctx.arc(0, 0, big?100:60, -Math.PI*(big?0.5:0.4), Math.PI*(big?0.5:0.4));
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
      ctx.restore();
    }
  }
}

// ENEMY PROJECTILES
// ============================================================
const enemyProjectiles = [];
function spawnEP(x,y,vx,vy,dmg,color){
  enemyProjectiles.push({ x,y,vx,vy,dmg,color,life:3,alive:true });
}
function updateEP(dt){
  for(let i=enemyProjectiles.length-1;i>=0;i--){
    const p = enemyProjectiles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    if(p.life <= 0) p.alive = false;
    if(dist(p.x,p.y,game.player.x,game.player.y) < game.player.r+5){
      game.player.hurt(p.dmg);
      p.alive = false;
    }
    for(const o of game.obstacles){
      if(o.collides(p.x,p.y,4)){ p.alive = false; break; }
    }
    if(!p.alive) enemyProjectiles.splice(i,1);
  }
}
function drawEP(cam){
  for(const p of enemyProjectiles){
    ctx.save();
    ctx.shadowBlur = 8; ctx.shadowColor = p.color;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x-cam.x, p.y-cam.y, 5, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

// ============================================================
// GAME
// ============================================================
class Game {
  constructor(){
    this.player = new Player();
    this.camera = new Camera();
    this.particles = new ParticleSystem(500);
    this.projectiles = [];
    this.enemies = [];
    this.obstacles = [];
    this.drops = [];
    this.wave = 0;
    this.waveT = 0;
    this.waveState = 'starting'; // starting, active, complete
    this.waveTextT = 0;
    this.waveText = '';
    this.score = 0;
    this.gameOverState = false;
    this.flashScreen = 0;
    this.generateMap();
    this.startWave(1);
  }
  generateMap(){
    // Random obstacles around the map
    for(let i=0;i<40;i++){
      let x, y, tries=0;
      do {
        x = rnd(100, MAP_W-100); y = rnd(100, MAP_H-100);
        tries++;
      } while(dist(x,y,MAP_W/2,MAP_H/2) < 200 && tries < 20);
      const w = rnd(40,90), h = rnd(40,90);
      this.obstacles.push(new Obstacle(x,y,w,h, Math.random()<0.5?'crate':'wall'));
    }
  }
  startWave(n){
    this.wave = n;
    this.waveState = 'active';
    this.enemies = [];
    let cz=0, cs=0, ct=0, cx=0, cg=0, csw=0, cb=0;
    if(n === 1){ cz = 5; }
    else if(n === 2){ cz = 10; }
    else if(n === 3){ cz = 10; cs = 3; }
    else if(n === 4){ cz = 12; cs = 5; ct = 1; cx = 2; }
    else if(n % 5 === 0){ cb = 1; csw = 8; cz = 5; }
    else {
      const base = Math.floor(n*1.5);
      cz = base + 4;
      cs = Math.floor(base*0.4);
      ct = Math.floor(base*0.15);
      cx = Math.floor(base*0.25);
      cg = Math.floor(base*0.2);
      csw = Math.floor(base*0.3);
    }
    const spawn = (cls, count) => {
      for(let i=0;i<count;i++){
        let x, y, tries=0;
        do {
          const a = Math.random()*TAU;
          const r = rnd(400, 900);
          x = this.player.x + Math.cos(a)*r;
          y = this.player.y + Math.sin(a)*r;
          tries++;
        } while((x<50||x>MAP_W-50||y<50||y>MAP_H-50) && tries < 20);
        x = clamp(x, 50, MAP_W-50); y = clamp(y, 50, MAP_H-50);
        this.enemies.push(new cls(x, y));
      }
    };
    spawn(Zombie, cz);
    spawn(Shooter, cs);
    spawn(Tank, ct);
    spawn(Exploder, cx);
    spawn(Ghost, cg);
    spawn(Swarm, csw);
    for(let i=0;i<cb;i++){
      const a = Math.random()*TAU;
      const x = this.player.x + Math.cos(a)*700;
      const y = this.player.y + Math.sin(a)*700;
      this.enemies.push(new Boss(clamp(x,80,MAP_W-80), clamp(y,80,MAP_H-80), Math.floor(n/5)));
    }
    this.waveText = `ONDA ${n}`;
    this.waveTextT = 2;
  }
  spawnProjectile(opts){ this.projectiles.push(new Projectile(opts)); }
  spawnEnemyProjectile(x,y,vx,vy,d,c){ spawnEP(x,y,vx,vy,d,c); }
  muzzleFlash(x,y,color,size){
    for(let i=0;i<6;i++){
      const a = Math.random()*TAU;
      this.particles.spawn({
        x, y, vx:Math.cos(a)*rnd(50,150), vy:Math.sin(a)*rnd(50,150),
        life:0.2, size:size*rnd(0.6,1), color, glow:true
      });
    }
  }
  hitSpark(x,y,color){
    for(let i=0;i<6;i++){
      const a = Math.random()*TAU;
      this.particles.spawn({
        x, y, vx:Math.cos(a)*rnd(80,200), vy:Math.sin(a)*rnd(80,200),
        life:0.3, size:rnd(2,4), color, glow:true
      });
    }
  }
  explode(x,y,r,dmg){
    this.camera.doShake(10);
    // Damage enemies
    for(const e of this.enemies){
      if(!e.alive) continue;
      const d = dist(x,y,e.x,e.y);
      if(d < r){
        const falloff = 1 - d/r;
        e.hurt(dmg*falloff, '#ff8800');
      }
    }
    // Damage player
    const dp = dist(x,y,this.player.x,this.player.y);
    if(dp < r){
      this.player.hurt(dmg*(1 - dp/r)*0.5);
    }
    // Particles
    for(let i=0;i<30;i++){
      const a = Math.random()*TAU;
      const sp = rnd(100, 400);
      this.particles.spawn({
        x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
        life:rnd(0.4,0.8), size:rnd(4,12),
        color: Math.random()<0.4 ? '#ff4500' : (Math.random()<0.5?'#ffaa00':'#888'), glow:true
      });
    }
    // Shockwave ring
    for(let i=0;i<3;i++){
      setTimeout(()=>{
        for(let j=0;j<20;j++){
          const a = j*TAU/20;
          this.particles.spawn({
            x:x+Math.cos(a)*r*(0.3+i*0.3), y:y+Math.sin(a)*r*(0.3+i*0.3),
            vx:Math.cos(a)*100, vy:Math.sin(a)*100,
            life:0.3, size:5, color:'#ffaa00', glow:true
          });
        }
      }, i*50);
    }
  }
  gameOver(){
    this.gameOverState = true;
    setTimeout(()=>{
      document.getElementById('overlay').classList.remove('hidden');
      document.querySelector('#overlay h1').textContent = 'GAME OVER';
      document.querySelector('#overlay h1').style.color = '#ff4444';
      document.querySelectorAll('#overlay p')[0].innerHTML = `Você sobreviveu até a <span class="key">ONDA ${this.wave}</span>`;
      document.querySelectorAll('#overlay p')[1].innerHTML = `Pontuação final: <span class="key">${this.score}</span>`;
      document.getElementById('startBtn').textContent = 'JOGAR NOVAMENTE';
    }, 1500);
  }
  update(dt){
    if(this.gameOverState) return;
    this.player.update(dt);
    this.camera.follow(this.player);
    this.particles.update(dt);
    updateDamage(dt);
    updateEP(dt);

    // Projectiles
    for(let i=this.projectiles.length-1;i>=0;i--){
      const p = this.projectiles[i];
      p.update(dt);
      if(!p.alive){ this.projectiles.splice(i,1); continue; }
      // Hit enemies
      for(const e of this.enemies){
        if(!e.alive) continue;
        if(dist2(p.x,p.y,e.x,e.y) < (e.r+p.size)*(e.r+p.size)){
          e.hurt(p.dmg, p.weapon==='sniper'?'#00ffff':(p.weapon==='flame'?'#ff8800':'#fff'));
          if(p.burns) e.burning = 3;
          if(p.weapon === 'rocket'){
            this.explode(p.x, p.y, 80, p.dmg);
            p.alive = false;
          } else if(p.pierce){
            // Sniper pierces
            this.hitSpark(p.x, p.y, p.color);
          } else {
            this.hitSpark(p.x, p.y, p.color);
            p.alive = false;
            break;
          }
        }
      }
    }

    // Enemies
    for(let i=this.enemies.length-1;i>=0;i--){
      const e = this.enemies[i];
      e.update(dt);
      if(!e.alive){
        this.enemies.splice(i,1);
        const r = Math.random();
        if(r < 0.08){
          // Weapon drop (skip Punch idx 0)
          const idx = rndi(1, NUM_SLOTS-1);
          this.drops.push(new WeaponDrop(e.x, e.y, idx));
        } else if(r < 0.20){
          // Health drop with weighted random amount
          this.drops.push(new HealthDrop(e.x, e.y));
        }
        // Tank/Boss extra health drop
        if(e instanceof Tank && Math.random() < 0.5){
          this.drops.push(new HealthDrop(e.x+rnd(-20,20), e.y+rnd(-20,20), 30));
        }
        if(e instanceof Boss){
          this.drops.push(new HealthDrop(e.x, e.y, 50));
          // Boss drops a random weapon refill
          this.drops.push(new WeaponDrop(e.x+30, e.y, rndi(1, NUM_SLOTS-1)));
        }
      }
    }

    // Drops
    for(let i=this.drops.length-1;i>=0;i--){
      const d = this.drops[i];
      d.update(dt);
      if(!d.alive) this.drops.splice(i,1);
    }

    // Wave logic
    if(this.waveState === 'active' && this.enemies.length === 0){
      this.waveState = 'complete';
      this.waveT = 5;
      this.waveText = `ONDA ${this.wave} COMPLETA`;
      // Heal a little
      this.player.hp = Math.min(this.player.maxHp, this.player.hp + 25);
      // Drop a guaranteed weapon (skip Punch idx 0)
      const idx = rndi(1, NUM_SLOTS-1);
      this.drops.push(new WeaponDrop(this.player.x + rnd(-100,100), this.player.y + rnd(-100,100), idx));
      // Guaranteed health drop too
      this.drops.push(new HealthDrop(this.player.x + rnd(-100,100), this.player.y + rnd(-100,100), 30));
    }
    if(this.waveState === 'complete'){
      this.waveT -= dt;
      if(this.waveT <= 0){
        this.startWave(this.wave + 1);
      }
    }

    if(this.waveTextT > 0) this.waveTextT -= dt;
    if(this.flashScreen > 0) this.flashScreen -= dt;
  }
  draw(){
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,W,H);
    ctx.save();
    if(this.camera.zoom !== 1){
      ctx.translate(W/2, H/2);
      ctx.scale(this.camera.zoom, this.camera.zoom);
      ctx.translate(-W/2, -H/2);
    }
    drawFloor(this.camera);
    drawBlood(this.camera);
    // Obstacles
    for(const o of this.obstacles) o.draw(this.camera);
    // Drops
    for(const d of this.drops) d.draw(this.camera);
    // Enemies
    for(const e of this.enemies) e.draw(this.camera);
    // Player
    this.player.draw(this.camera);
    // Sniper laser sight
    if(this.player.weapon instanceof Sniper) this.player.weapon.drawLaserSight(this.player, this.camera);
    // Projectiles
    for(const p of this.projectiles) p.draw(this.camera);
    // Enemy projectiles
    drawEP(this.camera);
    // Particles
    this.particles.draw(this.camera);
    // Laser beam
    this.player.drawLaserBeam(this.camera);
    // Damage numbers
    drawDamage(this.camera);
    ctx.restore();
    // Screen flash
    if(this.flashScreen > 0){
      ctx.fillStyle = `rgba(255,255,255,${clamp(this.flashScreen*5,0,0.7)})`;
      ctx.fillRect(0,0,W,H);
    }
    // HUD
    this.drawHUD();
  }
  drawHUD(){
    // HP bar
    ctx.fillStyle = '#000';
    ctx.fillRect(15, 15, 230, 30);
    ctx.fillStyle = '#222';
    ctx.fillRect(18, 18, 224, 24);
    const hpr = this.player.hp / this.player.maxHp;
    let hpc = '#22dd22';
    if(hpr < 0.6) hpc = '#dddd22';
    if(hpr < 0.3) hpc = '#dd2222';
    ctx.fillStyle = hpc;
    ctx.fillRect(20, 20, 220*hpr, 20);
    // Heart icon
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.arc(30, 30, 6, 0, TAU);
    ctx.fill();
    ctx.font = 'bold 14px Courier New';
    ctx.fillStyle = '#fff';
    ctx.fillText(`${Math.ceil(this.player.hp)}/${this.player.maxHp}`, 80, 35);

    // Score - top center
    ctx.font = 'bold 28px Courier New';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#000';
    ctx.fillText(`${this.score}`, W/2+2, 42);
    ctx.fillStyle = '#ffd700';
    ctx.fillText(`${this.score}`, W/2, 40);
    ctx.font = '12px Courier New';
    ctx.fillStyle = '#888';
    ctx.fillText('SCORE', W/2, 55);

    // Wave - top right
    ctx.textAlign = 'right';
    ctx.font = 'bold 22px Courier New';
    ctx.fillStyle = '#ffd700';
    ctx.fillText(`ONDA ${this.wave}`, W-15, 35);
    ctx.font = '14px Courier New';
    ctx.fillStyle = '#fff';
    ctx.fillText(`☠ ${this.enemies.length}`, W-15, 55);
    ctx.textAlign = 'left';

    // Weapon bar bottom center
    const w = this.player.weapon;
    if(w){
      const bx = W/2 - 110, by = H - 78;
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(bx, by, 220, 60);
      ctx.strokeStyle = w.color;
      ctx.lineWidth = 2;
      ctx.strokeRect(bx, by, 220, 60);
      // Name
      ctx.font = 'bold 15px Courier New';
      ctx.fillStyle = w.color;
      ctx.textAlign = 'center';
      ctx.fillText(w.name.toUpperCase(), W/2+15, by+20);
      // Ammo
      ctx.font = 'bold 13px Courier New';
      if(w.unlimited){
        ctx.fillStyle = '#ffd700';
        ctx.fillText('∞ MUNIÇÃO', W/2+15, by+40);
      } else {
        const empty = w.ammo === 0;
        ctx.fillStyle = empty ? '#ff4444' : (w.ammo < w.maxAmmo*0.25 ? '#ffaa00' : '#fff');
        ctx.fillText(`${w.ammo}/${w.maxAmmo}`, W/2+15, by+40);
      }
      // Ammo bar mini
      if(!w.unlimited){
        ctx.fillStyle = '#222';
        ctx.fillRect(bx+60, by+45, 140, 6);
        ctx.fillStyle = w.color;
        ctx.fillRect(bx+60, by+45, 140 * (w.ammo/w.maxAmmo), 6);
      }
      // Special cooldown arc
      const cr = w.specialT/w.specialCD;
      ctx.beginPath();
      ctx.arc(bx + 25, by + 30, 18, -Math.PI/2, -Math.PI/2 + TAU*(1-cr));
      ctx.strokeStyle = w.color;
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.font = 'bold 11px Courier New';
      ctx.fillStyle = w.specialT <= 0 ? '#ffd700' : '#888';
      ctx.fillText('ESP', bx+25, by+34);
      ctx.textAlign = 'left';
      // Weapon slots (9)
      ctx.font = 'bold 10px Courier New';
      for(let i=0;i<NUM_SLOTS;i++){
        const slot = this.player.weapons[i];
        const sx = bx + 232 + i*22;
        const active = i===this.player.weaponIdx;
        ctx.fillStyle = slot ? (active?'#ffd700':'#444') : '#1a1a2a';
        ctx.fillRect(sx, by+10, 20, 40);
        if(slot){
          ctx.fillStyle = active?'#000':slot.color;
          ctx.fillText(i+1, sx+7, by+22);
          // Ammo mini
          ctx.font = '8px Courier New';
          ctx.fillStyle = active?'#000':'#aaa';
          if(slot.unlimited) ctx.fillText('∞', sx+7, by+34);
          else ctx.fillText(slot.ammo, sx+10-(''+slot.ammo).length*2, by+34);
          if(!slot.unlimited){
            // Mini ammo bar
            ctx.fillStyle = active?'#000':'#333';
            ctx.fillRect(sx+2, by+44, 16, 3);
            ctx.fillStyle = slot.color;
            ctx.fillRect(sx+2, by+44, 16*(slot.ammo/slot.maxAmmo), 3);
          }
          ctx.font = 'bold 10px Courier New';
        } else {
          ctx.fillStyle = '#333';
          ctx.fillText(i+1, sx+7, by+30);
        }
      }
    }

    // Boss HP bar
    const boss = this.enemies.find(e => e instanceof Boss);
    if(boss){
      const bx = W/2 - 250, by = 80;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(bx, by, 500, 30);
      const hpr2 = boss.hp/boss.maxHp;
      let bc = '#7b2d8b';
      if(hpr2 < 0.6) bc = '#ff8800';
      if(hpr2 < 0.3) bc = '#ff2200';
      ctx.fillStyle = bc;
      ctx.fillRect(bx+2, by+2, (500-4)*hpr2, 26);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(bx, by, 500, 30);
      ctx.font = 'bold 16px Courier New';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.fillText(`BOSS - TIER ${boss.tier}`, W/2, by+20);
      ctx.textAlign = 'left';
    }

    // Wave text
    if(this.waveState === 'complete' || this.waveTextT > 0){
      ctx.font = 'bold 56px Courier New';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillText(this.waveText, W/2+3, H/2+3);
      ctx.fillStyle = '#ffd700';
      ctx.fillText(this.waveText, W/2, H/2);
      if(this.waveState === 'complete'){
        // Countdown circle
        ctx.beginPath();
        ctx.arc(W/2, H/2 + 70, 30, -Math.PI/2, -Math.PI/2 + TAU*(1 - this.waveT/5));
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.font = 'bold 28px Courier New';
        ctx.fillStyle = '#fff';
        ctx.fillText(Math.ceil(this.waveT), W/2, H/2+80);
      }
      ctx.textAlign = 'left';
    }

    // Minimap
    const mmS = 150;
    const mmX = W - mmS - 15, mmY = H - mmS - 15;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(mmX, mmY, mmS, mmS);
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 2;
    ctx.strokeRect(mmX, mmY, mmS, mmS);
    const scale = mmS / MAP_W;
    ctx.fillStyle = '#5a3a2a';
    for(const o of this.obstacles){
      ctx.fillRect(mmX + o.x*scale, mmY + o.y*scale, o.w*scale, o.h*scale);
    }
    for(const e of this.enemies){
      ctx.fillStyle = e instanceof Boss ? '#ff00ff' : '#ff3333';
      const ms = e instanceof Boss ? 4 : 2;
      ctx.fillRect(mmX + e.x*scale - ms/2, mmY + e.y*scale - ms/2, ms, ms);
    }
    ctx.fillStyle = '#22dd22';
    ctx.fillRect(mmX + this.player.x*scale - 2, mmY + this.player.y*scale - 2, 4, 4);

    // Dash CD indicator
    if(this.player.dashCD > 0){
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(15, 55, 120, 14);
      ctx.fillStyle = '#88aaff';
      ctx.fillRect(17, 57, 116*(1 - this.player.dashCD/1.5), 10);
      ctx.font = '10px Courier New';
      ctx.fillStyle = '#fff';
      ctx.fillText('DASH (SHIFT)', 20, 67);
    } else {
      ctx.fillStyle = 'rgba(80,120,200,0.6)';
      ctx.fillRect(15, 55, 120, 14);
      ctx.font = 'bold 10px Courier New';
      ctx.fillStyle = '#fff';
      ctx.fillText('DASH READY (SHIFT)', 20, 67);
    }
  }
}

// ============================================================
// MAIN LOOP
// ============================================================
let game;
let lastT = 0;
function loop(t){
  const dt = Math.min(0.033, (t - lastT)/1000);
  lastT = t;
  if(game){
    // Update mouse world coords
    mouse.wx = mouse.x/game.camera.zoom + game.camera.x;
    mouse.wy = mouse.y/game.camera.zoom + game.camera.y;
    if(game.camera.zoom !== 1){
      // Adjust for zoom-centered transform
      mouse.wx = (mouse.x - W/2)/game.camera.zoom + W/2 + game.camera.x;
      mouse.wy = (mouse.y - H/2)/game.camera.zoom + H/2 + game.camera.y;
    }
    game.update(dt);
    game.draw();
  }
  requestAnimationFrame(loop);
}

document.getElementById('startBtn').addEventListener('click', ()=>{
  document.getElementById('overlay').classList.add('hidden');
  document.querySelector('#overlay h1').textContent = 'JOGUINHO — TOP-DOWN ARENA';
  document.querySelector('#overlay h1').style.color = '#ffd700';
  game = new Game();
});
requestAnimationFrame(loop);
</script>
