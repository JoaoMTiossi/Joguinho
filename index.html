// WEAPON DROPS
// ============================================================
class WeaponDrop {
  constructor(x,y,idx){
    this.x=x;this.y=y;this.idx=idx;
    const cls = WEAPON_CLASSES[idx];
    const tmp = new cls();
    this.name = tmp.name;
    this.color = tmp.color;
    this.t = 0;
    this.alive = true;
  }
  update(dt){
    this.t += dt;
    if(dist(this.x, this.y, game.player.x, game.player.y) < 28){
      const idx = this.idx;
      let existing = game.player.weapons[idx];
      if(!existing){
        game.player.weapons[idx] = new WEAPON_CLASSES[idx]();
        existing = game.player.weapons[idx];
        game.player.switchWeapon(idx);
        spawnDamage(game.player.x, game.player.y - game.player.r - 10, this.name.toUpperCase(), this.color);
      } else {
        if(existing.unlimited){
          spawnDamage(game.player.x, game.player.y - game.player.r - 10, '∞', this.color);
        } else {
          const before = existing.ammo;
          existing.refill();
          const gained = existing.ammo - before;
          spawnDamage(game.player.x, game.player.y - game.player.r - 10, '+'+gained+' ammo', this.color);
        }
      }
      // Track pickup count for golden upgrade
      game.weaponDropCounts[idx] = (game.weaponDropCounts[idx] || 0) + 1;
      const count = game.weaponDropCounts[idx];
      if(count >= 3 && !existing.golden){
        existing.golden = true;
        existing.damage = (existing.damage || 10) * 1.5;
        existing.fireRate = (existing.fireRate || 0.3) * 0.7;
        existing.color = '#ffd700';
        existing.name = '★ ' + existing.name;
        spawnDamage(game.player.x, game.player.y - 50, '★ DOURADA!', '#ffd700');
        game.camera.doShake(6);
        game.flashScreen = 0.15;
        for(let i=0;i<25;i++){
          const a = Math.random()*TAU;
          game.particles.spawn({
            x:game.player.x, y:game.player.y, vx:Math.cos(a)*rnd(150,300), vy:Math.sin(a)*rnd(150,300),
            life:0.8, size:rnd(3,6), color:'#ffd700', glow:true
          });
        }
      }
      // Pickup particles
      for(let i=0;i<10;i++){
        const a = Math.random()*TAU;
        game.particles.spawn({
          x:this.x, y:this.y, vx:Math.cos(a)*120, vy:Math.sin(a)*120,
          life:0.5, size:rnd(2,4), color:existing.color, glow:true
        });
      }
      this.alive = false;
    }
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    const scale = 1 + Math.sin(this.t*3)*0.15;
    const close = dist(this.x, this.y, game.player.x, game.player.y) < 100;
    const blink = close ? (Math.sin(this.t*15)*0.5+0.5) : 0;
    // Aura rotating
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(this.t*2);
    const grad = ctx.createRadialGradient(0,0,4,0,0,24);
    grad.addColorStop(0, this.color+'88');
    grad.addColorStop(1, this.color+'00');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0,0,24,0,TAU); ctx.fill();
    // Rays
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    for(let i=0;i<4;i++){
      const a = i*TAU/4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*14, Math.sin(a)*14);
      ctx.lineTo(Math.cos(a)*22, Math.sin(a)*22);
      ctx.stroke();
    }
    ctx.restore();
    // Icon
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(scale, scale);
    ctx.fillStyle = '#222';
    ctx.fillRect(-12,-3,24,6);
    ctx.fillStyle = this.color;
    ctx.fillRect(-10,-2,20,4);
    if(blink > 0){
      ctx.globalAlpha = blink*0.5;
      ctx.fillStyle = '#fff';
      ctx.fillRect(-12,-3,24,6);
    }
    ctx.restore();
    // Name
    ctx.font = 'bold 11px Courier New';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#000';
    ctx.fillText(this.name, sx+1, sy-18+1);
    ctx.fillStyle = this.color;
    ctx.fillText(this.name, sx, sy-18);
    ctx.textAlign = 'left';
  }
}

// ============================================================
// HEALTH DROPS (20/30/50% of max HP)
// ============================================================
class HealthDrop {
  constructor(x,y, amount=null){
    this.x=x;this.y=y;
    if(amount === null){
      const r = Math.random();
      this.amount = r < 0.6 ? 20 : (r < 0.9 ? 30 : 50);
    } else this.amount = amount;
    this.color = this.amount === 50 ? '#ff66bb' : (this.amount === 30 ? '#66ff88' : '#aaffaa');
    this.glowColor = this.amount === 50 ? '#ff66bb' : (this.amount === 30 ? '#33ff55' : '#88ee88');
    this.t = 0;
    this.alive = true;
  }
  update(dt){
    this.t += dt;
    if(dist(this.x, this.y, game.player.x, game.player.y) < 28){
      const heal = Math.round(game.player.maxHp * (this.amount/100) * game.player.healMultiplier);
      const before = game.player.hp;
      game.player.hp = Math.min(game.player.maxHp, game.player.hp + heal);
      const gained = Math.round(game.player.hp - before);
      spawnDamage(game.player.x, game.player.y - game.player.r - 10, '+'+gained+' HP', '#22ff44');
      for(let i=0;i<18;i++){
        const a = Math.random()*TAU;
        game.particles.spawn({
          x:this.x, y:this.y, vx:Math.cos(a)*rnd(80,180), vy:Math.sin(a)*rnd(80,180),
          life:rnd(0.4,0.8), size:rnd(3,6), color:this.color, glow:true
        });
      }
      // Hearts floating up
      for(let i=0;i<5;i++){
        game.particles.spawn({
          x:game.player.x+rnd(-10,10), y:game.player.y, vx:rnd(-30,30), vy:rnd(-120,-60),
          life:0.8, size:5, color:'#ff5577', glow:true
        });
      }
      this.alive = false;
    }
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    const scale = 1 + Math.sin(this.t*4)*0.18;
    // Rotating aura
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(-this.t*2);
    const grad = ctx.createRadialGradient(0,0,4,0,0,24);
    grad.addColorStop(0, this.glowColor+'aa');
    grad.addColorStop(1, this.glowColor+'00');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0,0,24,0,TAU); ctx.fill();
    ctx.restore();
    // Cross icon
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(scale, scale);
    ctx.shadowBlur = 14; ctx.shadowColor = this.glowColor;
    ctx.fillStyle = this.color;
    ctx.fillRect(-3,-11,6,22);
    ctx.fillRect(-11,-3,22,6);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-3,-11,6,22);
    ctx.strokeRect(-11,-3,22,6);
    ctx.restore();
    // Amount label
    ctx.font = 'bold 12px Courier New';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#000';
    ctx.fillText(`+${this.amount}%`, sx+1, sy-20+1);
    ctx.fillStyle = this.color;
    ctx.fillText(`+${this.amount}%`, sx, sy-20);
    ctx.textAlign = 'left';
  }
}

// ============================================================
// PLAYER
// ============================================================
class Player {
  constructor(){
    this.x = MAP_W/2; this.y = MAP_H/2;
    this.vx=0;this.vy=0;
    this.r = 14;
    this.hp = this.maxHp = 100;
    this.speed = 240;
    this.weapons = [new Punch(), new Pistol(), null, null, null, null, null, null, null];
    this.weaponIdx = 1;
    this.aimAng = 0;
    this.walkT = 0;
    this.invuln = 0;
    // Dash stamina (3 charges, individual regen)
    this.dashCharges = 3;
    this.dashChargesMax = 3;
    this.dashRegenT = 0;
    this.dashRegenTime = 1.5;
    this.shiftHeldFromLast = false;
    this.dash = null;
    this.swing = null;
    this.spin360 = 0; this.spin360Rot = 0;
    this.fireRing = null;
    this.missileTarget = null;
    this.laserBeam = null;
    this.rotLaser = null;
    this.sniperCharge = 0;
    this.punchAnim = null;
    this.shockwave = null;
    // XP / Level / Coins
    this.xp = 0;
    this.level = 1;
    this.xpToNext = 80;
    this.coins = 0;
    this.damageMultiplier = 1;
    this.healMultiplier = 1;
    this.critChance = 0.05;
    this.coinMultiplier = 1;
    this.killCount = 0;
  }
  get weapon(){ return this.weapons[this.weaponIdx]; }
  switchWeapon(idx){
    if(idx < 0 || idx >= NUM_SLOTS) return;
    if(!this.weapons[idx]) return;
    this.weaponIdx = idx;
  }
  cycleWeapon(dir){
    // dir: +1 next, -1 previous; skip empty slots
    let idx = this.weaponIdx;
    for(let i=0;i<NUM_SLOTS;i++){
      idx = (idx + dir + NUM_SLOTS) % NUM_SLOTS;
      if(this.weapons[idx]){ this.weaponIdx = idx; return; }
    }
  }
  autoSwitchIfEmpty(){
    const w = this.weapon;
    if(!w) return;
    if(w.unlimited || w.ammo > 0) return;
    // Find any weapon with ammo, prefer Pistol then Punch
    for(let i=1;i<NUM_SLOTS;i++){
      const ww = this.weapons[i];
      if(ww && (ww.unlimited || ww.ammo > 0)){ this.weaponIdx = i; return; }
    }
    if(this.weapons[0]) this.weaponIdx = 0;
  }
  hurt(d){
    if(this.invuln > 0) return;
    this.hp -= d;
    this.invuln = 0.5;
    game.camera.doShake(8);
    spawnDamage(this.x, this.y - this.r, d, '#ff4444');
    if(this.hp <= 0){ this.hp = 0; game.gameOver(); }
  }
  useSpecial(){
    this.weapon?.special(this);
  }
  gainXP(amount){
    this.xp += amount;
    while(this.xp >= this.xpToNext){
      this.xp -= this.xpToNext;
      this.level++;
      this.xpToNext = Math.floor(this.xpToNext * 1.35);
      this.triggerLevelUp();
    }
  }
  rollDamage(base){
    const crit = Math.random() < this.critChance;
    return { dmg: base * this.damageMultiplier * (crit ? 2 : 1), crit };
  }
  triggerLevelUp(){
    // Heal a bit and shake
    this.hp = Math.min(this.maxHp, this.hp + this.maxHp*0.15);
    game.camera.doShake(4);
    game.flashScreen = 0.1;
    // Generate 3 unique upgrades
    const pool = [
      { label:'+15% Velocidade', desc:'Mover-se mais rápido', color:'#88ff88', apply: p => p.speed *= 1.15 },
      { label:'+30 HP Máximo', desc:'Mais vida total', color:'#ff6666', apply: p => { p.maxHp += 30; p.hp = Math.min(p.maxHp, p.hp + 30); } },
      { label:'+20% Dano', desc:'Todas as armas', color:'#ff8800', apply: p => p.damageMultiplier *= 1.2 },
      { label:'-25% CD Especial', desc:'Especiais mais rápidos', color:'#ffd700', apply: p => { for(const w of p.weapons) if(w) w.specialCD *= 0.75; } },
      { label:'+1 Carga de Dash', desc:'Mais mobilidade', color:'#88aaff', apply: p => { if(p.dashChargesMax<6){p.dashChargesMax++; p.dashCharges = Math.min(p.dashChargesMax, p.dashCharges+1);} } },
      { label:'Crítico +15%', desc:'Mais chance de 2× dano', color:'#ffff44', apply: p => p.critChance = Math.min(0.7, p.critChance + 0.15) },
      { label:'+50% Munição Máx', desc:'Comporta mais balas', color:'#aaccff', apply: p => { for(const w of p.weapons) if(w && !w.unlimited){ w.maxAmmo = Math.floor(w.maxAmmo*1.5); w.ammo = Math.min(w.maxAmmo, w.ammo + Math.floor(w.maxAmmo*0.3)); } } },
      { label:'+50% Cura', desc:'Drops curam mais', color:'#22ff44', apply: p => p.healMultiplier *= 1.5 },
      { label:'+50% Moedas', desc:'Mais ouro de inimigos', color:'#ffcc00', apply: p => p.coinMultiplier *= 1.5 },
      { label:'Recarga Total', desc:'Munição cheia agora', color:'#44ddff', apply: p => { for(const w of p.weapons) if(w && !w.unlimited) w.ammo = w.maxAmmo; } },
      { label:'Cura Completa', desc:'HP 100% agora', color:'#ff44aa', apply: p => p.hp = p.maxHp },
    ];
    const picked = [];
    while(picked.length < 3 && pool.length > 0){
      const idx = Math.floor(Math.random()*pool.length);
      picked.push(pool.splice(idx,1)[0]);
    }
    game.levelUpOptions = picked;
    game.levelUpOpen = true;
  }
  update(dt){
    this.aimAng = ang(this.x, this.y, mouse.wx, mouse.wy);
    if(this.invuln > 0) this.invuln -= dt;
    // Dash regen
    if(this.dashCharges < this.dashChargesMax){
      this.dashRegenT -= dt;
      if(this.dashRegenT <= 0){
        this.dashCharges++;
        this.dashRegenT = this.dashRegenTime;
      }
    }

    // Dash from shift (use 1 charge per press)
    const shiftNow = !!keys['shift'];
    if(shiftNow && !this.shiftHeldFromLast && this.dashCharges > 0){
      const ix = (keys['d']?1:0) - (keys['a']?1:0);
      const iy = (keys['s']?1:0) - (keys['w']?1:0);
      if(ix !== 0 || iy !== 0){
        const a = Math.atan2(iy, ix);
        this.x += Math.cos(a)*90;
        this.y += Math.sin(a)*90;
        this.dashCharges--;
        if(this.dashRegenT <= 0) this.dashRegenT = this.dashRegenTime;
        this.invuln = 0.25;
        for(let i=0;i<12;i++){
          game.particles.spawn({ x:this.x, y:this.y, vx:rnd(-100,100), vy:rnd(-100,100), life:0.4, size:rnd(2,4), color:'#88ccff', glow:true });
        }
      }
    }
    this.shiftHeldFromLast = shiftNow;

    // Movement
    let ix = (keys['d']?1:0) - (keys['a']?1:0);
    let iy = (keys['s']?1:0) - (keys['w']?1:0);
    if(ix !== 0 || iy !== 0){
      const mag = Math.hypot(ix, iy);
      ix /= mag; iy /= mag;
      this.vx = lerp(this.vx, ix*this.speed, 0.2);
      this.vy = lerp(this.vy, iy*this.speed, 0.2);
      this.walkT += dt*8;
    } else {
      this.vx *= 0.85; this.vy *= 0.85;
    }

    // Dash slash override
    if(this.dash){
      this.dash.t -= dt;
      const t = 1 - this.dash.t/this.dash.max;
      this.x = lerp(this.dash.sx, this.dash.tx, t);
      this.y = lerp(this.dash.sy, this.dash.ty, t);
      if(this.dash.t <= 0) this.dash = null;
      // Ghost trail
      if(Math.random() < 0.5){
        game.particles.spawn({ x:this.x, y:this.y, vx:0, vy:0, life:0.3, size:14, color:'#88aaff', glow:true, type:'circle' });
      }
    } else {
      this.x += this.vx*dt;
      this.y += this.vy*dt;
    }

    // Obstacle collision
    for(const o of game.obstacles){
      if(!o.alive) continue;
      if(o.collides(this.x, this.y, this.r)){
        const cx = clamp(this.x, o.x, o.x+o.w);
        const cy = clamp(this.y, o.y, o.y+o.h);
        const a = ang(cx, cy, this.x, this.y);
        this.x = cx + Math.cos(a)*this.r;
        this.y = cy + Math.sin(a)*this.r;
      }
    }
    // Barrel collision
    for(const b of game.barrels){
      if(!b.alive) continue;
      if(b.collides(this.x, this.y, this.r)){
        const a = ang(b.x, b.y, this.x, this.y);
        const overlap = b.r + this.r - dist(this.x, this.y, b.x, b.y);
        this.x += Math.cos(a)*overlap;
        this.y += Math.sin(a)*overlap;
      }
    }
    this.x = clamp(this.x, this.r, MAP_W-this.r);
    this.y = clamp(this.y, this.r, MAP_H-this.r);

    // Weapon update
    for(const w of this.weapons) if(w) w.update(dt);

    // Fire
    if(mouse.down || mouse.pressed){
      this.weapon.fire(this, mouse.wx, mouse.wy);
      mouse.pressed = false;
      this.autoSwitchIfEmpty();
    }

    // Punch swing anim
    if(this.punchAnim){
      this.punchAnim.t -= dt;
      if(this.punchAnim.t <= 0) this.punchAnim = null;
    }
    // Shockwave (punch special)
    if(this.shockwave){
      this.shockwave.life -= dt;
      const t = 1 - this.shockwave.life/0.5;
      this.shockwave.r = lerp(0, this.shockwave.max, Math.min(1, t));
      if(this.shockwave.life <= 0) this.shockwave = null;
    }

    // Spin 360 special (MG)
    if(this.spin360 > 0){
      this.spin360 -= dt;
      this.spin360Rot += dt*12;
      if(Math.random() < 0.6){
        const a = this.spin360Rot;
        game.spawnProjectile({ x:this.x+Math.cos(a)*22, y:this.y+Math.sin(a)*22, vx:Math.cos(a)*900, vy:Math.sin(a)*900, dmg:10, color:'#ff8c00', size:3, weapon:'mg', elongated:true, life:0.5 });
      }
    }

    // Fire ring (flamethrower special)
    if(this.fireRing){
      this.fireRing.life -= dt;
      const t = 1 - this.fireRing.life/1.5;
      this.fireRing.r = lerp(0, 150, Math.min(1, t*3));
      // Damage enemies
      for(const e of game.enemies){
        if(!e.alive) continue;
        const d = dist(this.x, this.y, e.x, e.y);
        if(Math.abs(d - this.fireRing.r) < 30){
          e.hurt(this.fireRing.dmg * dt * 5, '#ff4500');
          e.burning = 3;
        }
      }
      // Particles
      for(let i=0;i<5;i++){
        const a = Math.random()*TAU;
        game.particles.spawn({
          x:this.x+Math.cos(a)*this.fireRing.r, y:this.y+Math.sin(a)*this.fireRing.r,
          vx:Math.cos(a)*30, vy:Math.sin(a)*30 - 40,
          life:0.5, size:rnd(4,10), color:Math.random()<0.5?'#ff4500':'#ffaa00', glow:true
        });
      }
      if(this.fireRing.life <= 0) this.fireRing = null;
    }

    // Missile target preview
    if(this.missileTarget){
      this.missileTarget.life -= dt;
      if(this.missileTarget.life <= 0) this.missileTarget = null;
    }

    // Rotating laser
    if(this.rotLaser){
      this.rotLaser.t -= dt;
      this.rotLaser.ang += dt*TAU/3;
      const a = this.rotLaser.ang;
      const range = 600;
      for(const e of game.enemies){
        if(!e.alive) continue;
        const dx = e.x - this.x, dy = e.y - this.y;
        const t = (dx*Math.cos(a) + dy*Math.sin(a));
        if(t < 0 || t > range) continue;
        const px = this.x + Math.cos(a)*t;
        const py = this.y + Math.sin(a)*t;
        if(dist2(px,py,e.x,e.y) < e.r*e.r){
          e.hurt(60*dt, '#00ff88');
        }
      }
      if(this.rotLaser.t <= 0) this.rotLaser = null;
    }

    // Swing decay
    if(this.swing){
      this.swing.t -= dt;
      if(this.swing.t <= 0) this.swing = null;
    }
  }
  drawLaserBeam(cam){
    if(this.laserBeam){
      const b = this.laserBeam;
      const ex = this.x + Math.cos(b.ang)*b.range;
      const ey = this.y + Math.sin(b.ang)*b.range;
      const sx = this.x-cam.x, sy = this.y-cam.y;
      const eex = ex-cam.x, eey = ey-cam.y;
      let col1 = '#00ff88';
      if(b.heat > 0.7) col1 = '#ffff00';
      if(b.heat > 0.9) col1 = '#ffffff';
      ctx.save();
      ctx.shadowBlur = 20; ctx.shadowColor = col1;
      ctx.strokeStyle = col1 + '66';
      ctx.lineWidth = 8 + b.heat*4;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(eex, eey); ctx.stroke();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(eex, eey); ctx.stroke();
      ctx.shadowBlur = 0;
      // Impact spark
      for(let i=0;i<3;i++){
        const a = Math.random()*TAU;
        game.particles.spawn({
          x:ex+rnd(-4,4), y:ey+rnd(-4,4), vx:Math.cos(a)*100, vy:Math.sin(a)*100,
          life:0.3, size:3, color:col1, glow:true
        });
      }
      ctx.restore();
      this.laserBeam = null;
    }
    if(this.rotLaser){
      const a = this.rotLaser.ang;
      const sx = this.x-cam.x, sy = this.y-cam.y;
      ctx.save();
      ctx.shadowBlur = 25; ctx.shadowColor = '#00ff88';
      ctx.strokeStyle = '#00ff8866';
      ctx.lineWidth = 12;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx+Math.cos(a)*600, sy+Math.sin(a)*600); ctx.stroke();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx+Math.cos(a)*600, sy+Math.sin(a)*600); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
  draw(cam){
    const sx = this.x-cam.x, sy = this.y-cam.y;
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(sx, sy+10, 14, 5, 0, 0, TAU); ctx.fill();

    // Shockwave ring (punch special)
    if(this.shockwave){
      ctx.save();
      ctx.strokeStyle = '#ffcc99';
      ctx.lineWidth = 6;
      ctx.shadowBlur = 18; ctx.shadowColor = '#ffaa66';
      ctx.globalAlpha = clamp(this.shockwave.life/0.5, 0, 1);
      ctx.beginPath(); ctx.arc(sx, sy, this.shockwave.r, 0, TAU); ctx.stroke();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#fff';
      ctx.beginPath(); ctx.arc(sx, sy, this.shockwave.r, 0, TAU); ctx.stroke();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      ctx.restore();
    }

    // Sniper charge effect
    if(this.sniperCharge > 0){
      this.sniperCharge -= 0.016;
      const r = (1 - this.sniperCharge/2) * 30;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.8;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
      for(let i=0;i<2;i++){
        const a = Math.random()*TAU;
        game.particles.spawn({
          x:this.x+Math.cos(a)*30, y:this.y+Math.sin(a)*30,
          vx:-Math.cos(a)*60, vy:-Math.sin(a)*60,
          life:0.3, size:3, color:'#fff', glow:true
        });
      }
    }

    // Fire ring
    if(this.fireRing){
      ctx.save();
      ctx.strokeStyle = '#ff4500';
      ctx.lineWidth = 4;
      ctx.shadowBlur = 15; ctx.shadowColor = '#ff4500';
      ctx.globalAlpha = clamp(this.fireRing.life/1.5, 0, 1);
      ctx.beginPath(); ctx.arc(sx, sy, this.fireRing.r, 0, TAU); ctx.stroke();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      ctx.restore();
    }

    // Spin360 ring
    if(this.spin360 > 0){
      ctx.save();
      ctx.strokeStyle = '#ff8c00';
      ctx.lineWidth = 3;
      ctx.globalAlpha = this.spin360/2;
      const pulse = 25 + Math.sin(this.spin360*10)*8;
      ctx.beginPath(); ctx.arc(sx, sy, pulse, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // Missile target indicator
    if(this.missileTarget){
      const t = mouse.wx, ty2 = mouse.wy;
      ctx.save();
      ctx.strokeStyle = '#ff4400';
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 6]);
      ctx.globalAlpha = 0.7;
      ctx.beginPath(); ctx.arc(this.missileTarget.x-cam.x, this.missileTarget.y-cam.y, 120, 0, TAU); ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(this.aimAng);
    // Legs
    const legSwing = Math.sin(this.walkT)*3;
    ctx.fillStyle = '#2d4a2d';
    ctx.fillRect(-4, -8+legSwing, 5, 8);
    ctx.fillRect(-4, 3-legSwing, 5, 8);
    // Body
    ctx.fillStyle = this.invuln>0?'#fff':'#4a7c59';
    ctx.beginPath(); ctx.ellipse(0,0,11,9,0,0,TAU); ctx.fill();
    ctx.strokeStyle = '#2d4a2d'; ctx.lineWidth = 1;
    ctx.stroke();
    // Left arm
    ctx.fillStyle = '#3d5d3d';
    ctx.fillRect(-2, -10, 5, 4);
    // Right arm + weapon
    ctx.fillRect(2, 6, 8, 4);
    // Weapon held in front
    if(this.weapon) this.weapon.drawHand(ctx, this, this.aimAng);
    // Head
    ctx.fillStyle = '#c8956c';
    ctx.beginPath(); ctx.arc(2,0,6,0,TAU); ctx.fill();
    // Helmet
    ctx.fillStyle = '#2d4a2d';
    ctx.beginPath();
    ctx.arc(2,0,6.5,Math.PI*0.8,Math.PI*1.2,true);
    ctx.fill();
    ctx.fillRect(-1,-6,7,3);
    // Direction triangle
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(10,-2); ctx.lineTo(13,0); ctx.lineTo(10,2); ctx.fill();
    ctx.restore();

    // Punch animation (fist extends)
    if(this.punchAnim){
      const pt = 1 - this.punchAnim.t/this.punchAnim.max;
      const ext = Math.sin(pt*Math.PI)*22;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(this.punchAnim.ang);
      // Arm
      ctx.fillStyle = '#3d5d3d';
      ctx.fillRect(0,-3,12+ext*0.5,6);
      // Fist
      ctx.fillStyle = '#c8956c';
      ctx.beginPath(); ctx.arc(14+ext, 0, 7, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#8a6244'; ctx.lineWidth = 1.5; ctx.stroke();
      // Impact lines
      if(pt > 0.3 && pt < 0.85){
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        for(let i=-1;i<=1;i++){
          if(i===0) continue;
          ctx.beginPath();
          ctx.moveTo(20+ext, i*4);
          ctx.lineTo(30+ext, i*8);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    // Katana swing arc
    if(this.swing){
      const t = this.swing.t/this.swing.max;
      const big = this.swing.big;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(this.swing.ang);
      ctx.globalAlpha = t;
      ctx.strokeStyle = '#aaccff';
      ctx.lineWidth = big ? 8 : 4;
      ctx.shadowBlur = 15; ctx.shadowColor = '#00aaff';
      ctx.beginPath();
      ctx.arc(0, 0, big?100:60, -Math.PI*(big?0.5:0.4), Math.PI*(big?0.5:0.4));
      ctx.stroke();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = big ? 3 : 2;
      ctx.beginPath();
      ctx.arc(0, 0, big?100:60, -Math.PI*(big?0.5:0.4), Math.PI*(big?0.5:0.4));
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
      ctx.restore();
    }
  }
}

// ============================================================
// ENEMY PROJECTILES
// ============================================================
const enemyProjectiles = [];
function spawnEP(x,y,vx,vy,dmg,color){
  enemyProjectiles.push({ x,y,vx,vy,dmg,color,life:3,alive:true });
}
function updateEP(dt){
  for(let i=enemyProjectiles.length-1;i>=0;i--){
    const p = enemyProjectiles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    if(p.life <= 0) p.alive = false;
    if(dist(p.x,p.y,game.player.x,game.player.y) < game.player.r+5){
      game.player.hurt(p.dmg);
      p.alive = false;
    }
    for(const o of game.obstacles){
      if(o.collides(p.x,p.y,4)){ p.alive = false; break; }
    }
    if(!p.alive) enemyProjectiles.splice(i,1);
  }
}
function drawEP(cam){
  for(const p of enemyProjectiles){
    ctx.save();
    ctx.shadowBlur = 8; ctx.shadowColor = p.color;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x-cam.x, p.y-cam.y, 5, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

// ============================================================
// GAME
// ============================================================
class Game {
  constructor(){
    this.player = new Player();
    this.camera = new Camera();
    this.particles = new ParticleSystem(500);
    this.projectiles = [];
    this.enemies = [];
    this.obstacles = [];
    this.drops = [];
    this.coins = [];
    this.barrels = [];
    this.dangerZones = [];
    this.weaponDropCounts = {};
    this.wave = 0;
    this.waveT = 0;
    this.waveState = 'starting';
    this.waveTextT = 0;
    this.waveText = '';
    this.eventWave = null;
    this.score = 0;
    this.gameOverState = false;
    this.flashScreen = 0;
    // Shop
    this.shopOpen = false;
    this.shopItems = [];
    // Level-up
    this.levelUpOpen = false;
    this.levelUpOptions = [];
    // UI hover/click cache (computed in drawHUD)
    this.uiClickAreas = [];
    // Slow-mo on wave clear
    this.slowMo = 0;
    this.generateMap();
    this.startWave(1);
  }
  generateMap(){
    this.obstacles = [];
    this.barrels = [];
    this.dangerZones = [];
    const safeFromCenter = (x,y) => dist(x, y, MAP_W/2, MAP_H/2) > 200;
    // Obstacles
    for(let i=0;i<45;i++){
      let x, y, tries=0;
      do {
        x = rnd(100, MAP_W-100); y = rnd(100, MAP_H-100);
        tries++;
      } while(!safeFromCenter(x,y) && tries < 20);
      const w = rnd(40,90), h = rnd(40,90);
      this.obstacles.push(new Obstacle(x,y,w,h, Math.random()<0.55?'crate':'wall'));
    }
    // Explosive barrels scattered
    for(let i=0;i<14;i++){
      let x, y, tries=0;
      do {
        x = rnd(200, MAP_W-200); y = rnd(200, MAP_H-200);
        tries++;
      } while(!safeFromCenter(x,y) && tries < 20);
      // Avoid overlap with obstacles
      let bad = false;
      for(const o of this.obstacles){
        if(x>=o.x-30 && x<=o.x+o.w+30 && y>=o.y-30 && y<=o.y+o.h+30){ bad = true; break; }
      }
      if(!bad) this.barrels.push(new Barrel(x, y));
    }
    // Danger zones
    for(let i=0;i<6;i++){
      let x, y, tries=0;
      do {
        x = rnd(250, MAP_W-250); y = rnd(250, MAP_H-250);
        tries++;
      } while(dist(x,y,MAP_W/2,MAP_H/2) < 350 && tries < 20);
      let bad = false;
      for(const o of this.obstacles){
        if(x>=o.x-60 && x<=o.x+o.w+60 && y>=o.y-60 && y<=o.y+o.h+60){ bad = true; break; }
      }
      if(!bad) this.dangerZones.push(new DangerZone(x, y, Math.random()<0.5?'lava':'acid'));
    }
  }
  startWave(n){
    this.wave = n;
    this.waveState = 'active';
    this.enemies = [];
    this.eventWave = null;
    // Mini-boss every 3 waves (skip boss waves)
    const isBossWave = n % 5 === 0;
    const isMiniBossWave = n > 3 && n % 3 === 0 && !isBossWave;
    // Event wave types (also non-boss)
    const isEventWave = !isBossWave && !isMiniBossWave && n > 4 && n % 4 === 0;
    let cz=0, cs=0, ct=0, cx=0, cg=0, csw=0, cb=0, miniBoss=null;
    if(isEventWave){
      const events = ['horda', 'tanques', 'escuridao'];
      this.eventWave = events[Math.floor((n-4)/4) % events.length];
      if(this.eventWave === 'horda'){ csw = 50; cz = 8; }
      else if(this.eventWave === 'tanques'){ ct = Math.min(8, 3 + Math.floor(n/6)); cz = 4; }
      else if(this.eventWave === 'escuridao'){
        const base = Math.floor(n*1.2);
        cz = base; cg = Math.floor(base*0.6); cx = 3;
      }
    } else if(isBossWave){
      cb = 1; csw = 8; cz = 5;
    } else if(n === 1){ cz = 5; }
    else if(n === 2){ cz = 10; }
    else if(n === 3){ cz = 10; cs = 3; }
    else if(n === 4){ cz = 12; cs = 5; ct = 1; cx = 2; }
    else {
      const base = Math.floor(n*1.5);
      cz = base + 4;
      cs = Math.floor(base*0.4);
      ct = Math.floor(base*0.15);
      cx = Math.floor(base*0.25);
      cg = Math.floor(base*0.2);
      csw = Math.floor(base*0.3);
    }
    if(isMiniBossWave){
      miniBoss = (Math.floor(n/3) % 2 === 0) ? MiniBossAssassin : MiniBossGiantExploder;
    }
    const spawn = (cls, count) => {
      for(let i=0;i<count;i++){
        let x, y, tries=0;
        do {
          const a = Math.random()*TAU;
          const r = rnd(400, 900);
          x = this.player.x + Math.cos(a)*r;
          y = this.player.y + Math.sin(a)*r;
          tries++;
        } while((x<50||x>MAP_W-50||y<50||y>MAP_H-50) && tries < 20);
        x = clamp(x, 50, MAP_W-50); y = clamp(y, 50, MAP_H-50);
        this.enemies.push(new cls(x, y));
      }
    };
    spawn(Zombie, cz);
    spawn(Shooter, cs);
    spawn(Tank, ct);
    spawn(Exploder, cx);
    spawn(Ghost, cg);
    spawn(Swarm, csw);
    for(let i=0;i<cb;i++){
      const a = Math.random()*TAU;
      const x = this.player.x + Math.cos(a)*700;
      const y = this.player.y + Math.sin(a)*700;
      this.enemies.push(new Boss(clamp(x,80,MAP_W-80), clamp(y,80,MAP_H-80), Math.floor(n/5)));
    }
    if(miniBoss){
      const a = Math.random()*TAU;
      const x = clamp(this.player.x + Math.cos(a)*600, 100, MAP_W-100);
      const y = clamp(this.player.y + Math.sin(a)*600, 100, MAP_H-100);
      this.enemies.push(new miniBoss(x, y));
      this.waveText = '⚠ MINI-BOSS!';
      this.waveTextT = 3;
      this.flashScreen = 0.2;
      this.camera.doShake(8);
    } else if(this.eventWave){
      const titles = { horda:'⚡ HORDA RÁPIDA!', tanques:'⚙ INVASÃO DE TANQUES!', escuridao:'☾ ESCURIDÃO!' };
      this.waveText = titles[this.eventWave];
      this.waveTextT = 3;
      this.flashScreen = 0.15;
    } else {
      this.waveText = `ONDA ${n}`;
      this.waveTextT = 2;
    }
    // Re-spawn destroyed barrels (some)
    let aliveBarrels = this.barrels.filter(b => b.alive).length;
    while(aliveBarrels < 14){
      let x, y, tries=0, bad=true;
      while(bad && tries < 20){
        x = rnd(200, MAP_W-200); y = rnd(200, MAP_H-200);
        bad = dist(x,y,this.player.x,this.player.y) < 250;
        if(!bad){
          for(const o of this.obstacles){
            if(o.alive && x>=o.x-30 && x<=o.x+o.w+30 && y>=o.y-30 && y<=o.y+o.h+30){ bad = true; break; }
          }
        }
        tries++;
      }
      if(!bad) this.barrels.push(new Barrel(x, y));
      aliveBarrels++;
    }
  }
  spawnProjectile(opts){ this.projectiles.push(new Projectile(opts)); }
  spawnEnemyProjectile(x,y,vx,vy,d,c){ spawnEP(x,y,vx,vy,d,c); }
  muzzleFlash(x,y,color,size){
    for(let i=0;i<6;i++){
      const a = Math.random()*TAU;
      this.particles.spawn({
        x, y, vx:Math.cos(a)*rnd(50,150), vy:Math.sin(a)*rnd(50,150),
        life:0.2, size:size*rnd(0.6,1), color, glow:true
      });
    }
  }
  hitSpark(x,y,color){
    for(let i=0;i<6;i++){
      const a = Math.random()*TAU;
      this.particles.spawn({
        x, y, vx:Math.cos(a)*rnd(80,200), vy:Math.sin(a)*rnd(80,200),
        life:0.3, size:rnd(2,4), color, glow:true
      });
    }
  }
  explode(x,y,r,dmg){
    this.camera.doShake(10);
    // Damage enemies
    for(const e of this.enemies){
      if(!e.alive) continue;
      const d = dist(x,y,e.x,e.y);
      if(d < r){
        const falloff = 1 - d/r;
        e.hurt(dmg*falloff, '#ff8800');
      }
    }
    // Damage player
    const dp = dist(x,y,this.player.x,this.player.y);
    if(dp < r){
      this.player.hurt(dmg*(1 - dp/r)*0.5);
    }
    // Particles
    for(let i=0;i<30;i++){
      const a = Math.random()*TAU;
      const sp = rnd(100, 400);
      this.particles.spawn({
        x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
        life:rnd(0.4,0.8), size:rnd(4,12),
        color: Math.random()<0.4 ? '#ff4500' : (Math.random()<0.5?'#ffaa00':'#888'), glow:true
      });
    }
    // Shockwave ring
    for(let i=0;i<3;i++){
      setTimeout(()=>{
        for(let j=0;j<20;j++){
          const a = j*TAU/20;
          this.particles.spawn({
            x:x+Math.cos(a)*r*(0.3+i*0.3), y:y+Math.sin(a)*r*(0.3+i*0.3),
            vx:Math.cos(a)*100, vy:Math.sin(a)*100,
            life:0.3, size:5, color:'#ffaa00', glow:true
          });
        }
      }, i*50);
    }
  }
  gameOver(){
    this.gameOverState = true;
    setTimeout(()=>{
      document.getElementById('overlay').classList.remove('hidden');
      document.querySelector('#overlay h1').textContent = 'GAME OVER';
      document.querySelector('#overlay h1').style.color = '#ff4444';
      document.querySelectorAll('#overlay p')[0].innerHTML = `Você sobreviveu até a <span class="key">ONDA ${this.wave}</span>`;
      document.querySelectorAll('#overlay p')[1].innerHTML = `Pontuação final: <span class="key">${this.score}</span>`;
      document.getElementById('startBtn').textContent = 'JOGAR NOVAMENTE';
    }, 1500);
  }
  generateShopItems(){
    const all = [
      { label:'Curar 50 HP', cost:15, color:'#ff66bb', apply:p => p.hp = Math.min(p.maxHp, p.hp + 50) },
      { label:'Recarga Total', cost:25, color:'#44ddff', apply:p => { for(const w of p.weapons) if(w && !w.unlimited) w.ammo = w.maxAmmo; } },
      { label:'+25 HP Máximo', cost:30, color:'#ff8888', apply:p => { p.maxHp += 25; p.hp += 25; } },
      { label:'+15% Velocidade', cost:35, color:'#88ff88', apply:p => p.speed *= 1.15 },
      { label:'+15% Dano', cost:40, color:'#ff8800', apply:p => p.damageMultiplier *= 1.15 },
      { label:'+1 Carga Dash', cost:35, color:'#88aaff', apply:p => { if(p.dashChargesMax<6){ p.dashChargesMax++; p.dashCharges++; } } },
      { label:'+10% Crítico', cost:30, color:'#ffff44', apply:p => p.critChance = Math.min(0.7, p.critChance + 0.1) },
      { label:'Arma Aleatória', cost:20, color:'#aaccff', apply:p => { const idx = rndi(1, NUM_SLOTS-1); if(!p.weapons[idx]) p.weapons[idx] = new WEAPON_CLASSES[idx](); else if(!p.weapons[idx].unlimited) p.weapons[idx].refill(); } },
    ];
    const picked = [];
    const pool = [...all];
    while(picked.length < 4 && pool.length > 0){
      const i = Math.floor(Math.random()*pool.length);
      picked.push(pool.splice(i,1)[0]);
    }
    return picked;
  }
  buyShopItem(idx){
    if(!this.shopOpen) return;
    const item = this.shopItems[idx];
    if(!item || item.bought) return;
    if(this.player.coins < item.cost) return;
    this.player.coins -= item.cost;
    item.apply(this.player);
    item.bought = true;
    spawnDamage(this.player.x, this.player.y - 40, '✓ '+item.label, item.color);
    for(let i=0;i<15;i++){
      const a = Math.random()*TAU;
      this.particles.spawn({
        x:this.player.x, y:this.player.y, vx:Math.cos(a)*150, vy:Math.sin(a)*150,
        life:0.5, size:rnd(2,5), color:item.color, glow:true
      });
    }
  }
  pickLevelUp(idx){
    if(!this.levelUpOpen) return;
    const opt = this.levelUpOptions[idx];
    if(!opt) return;
    opt.apply(this.player);
    this.levelUpOpen = false;
    spawnDamage(this.player.x, this.player.y - 50, '✓ '+opt.label, opt.color);
    game.flashScreen = 0.15;
    for(let i=0;i<25;i++){
      const a = Math.random()*TAU;
      this.particles.spawn({
        x:this.player.x, y:this.player.y, vx:Math.cos(a)*rnd(100,250), vy:Math.sin(a)*rnd(100,250),
        life:0.7, size:rnd(3,6), color:opt.color, glow:true
      });
    }
  }
  update(dt){
    if(this.gameOverState) return;
    // Pause game updates while level-up open
    if(this.levelUpOpen) return;
    // Apply slow-mo
    if(this.slowMo > 0){ dt *= 0.4; this.slowMo -= dt; }
    this.player.update(dt);
    this.camera.follow(this.player);
    this.particles.update(dt);
    updateDamage(dt);
    updateEP(dt);

    // Projectiles
    for(let i=this.projectiles.length-1;i>=0;i--){
      const p = this.projectiles[i];
      p.update(dt);
      if(!p.alive){ this.projectiles.splice(i,1); continue; }
      // Hit enemies
      for(const e of this.enemies){
        if(!e.alive) continue;
        if(dist2(p.x,p.y,e.x,e.y) < (e.r+p.size)*(e.r+p.size)){
          const { dmg, crit } = this.player.rollDamage(p.dmg);
          let dmgColor = p.weapon==='sniper'?'#00ffff':(p.weapon==='flame'?'#ff8800':'#fff');
          if(crit) dmgColor = '#ffff00';
          e.hurt(dmg, dmgColor);
          if(p.burns) e.burning = 3;
          if(p.weapon === 'rocket'){
            this.explode(p.x, p.y, 80, dmg);
            p.alive = false;
          } else if(p.pierce){
            this.hitSpark(p.x, p.y, p.color);
          } else {
            this.hitSpark(p.x, p.y, p.color);
            p.alive = false;
            break;
          }
        }
      }
    }

    // Enemies
    for(let i=this.enemies.length-1;i>=0;i--){
      const e = this.enemies[i];
      e.update(dt);
      if(!e.alive){
        this.enemies.splice(i,1);
        const r = Math.random();
        if(r < 0.06){
          const idx = rndi(1, NUM_SLOTS-1);
          this.drops.push(new WeaponDrop(e.x, e.y, idx));
        } else if(r < 0.18){
          this.drops.push(new HealthDrop(e.x, e.y));
        }
        if(e instanceof Tank && Math.random() < 0.5){
          this.drops.push(new HealthDrop(e.x+rnd(-20,20), e.y+rnd(-20,20), 30));
        }
        if(e instanceof Boss){
          this.drops.push(new HealthDrop(e.x, e.y, 50));
          this.drops.push(new WeaponDrop(e.x+30, e.y, rndi(1, NUM_SLOTS-1)));
          // Boss drops big coins
          for(let i=0;i<15;i++){
            this.coins.push(new Coin(e.x+rnd(-30,30), e.y+rnd(-30,30), 2));
          }
        }
        if(e instanceof MiniBossAssassin || e instanceof MiniBossGiantExploder){
          this.drops.push(new HealthDrop(e.x, e.y, 30));
          this.drops.push(new WeaponDrop(e.x, e.y, rndi(1, NUM_SLOTS-1)));
          for(let i=0;i<8;i++){
            this.coins.push(new Coin(e.x+rnd(-20,20), e.y+rnd(-20,20), 2));
          }
        }
      }
    }

    // Obstacles (clean up dead)
    for(let i=this.obstacles.length-1;i>=0;i--){
      const o = this.obstacles[i];
      if(o.update) o.update(dt);
      if(!o.alive) this.obstacles.splice(i,1);
    }

    // Barrels
    for(let i=this.barrels.length-1;i>=0;i--){
      const b = this.barrels[i];
      b.update(dt);
      if(!b.alive){
        this.barrels.splice(i,1);
        // Small loot from barrel
        for(let j=0;j<rndi(1,3);j++){
          this.coins.push(new Coin(b.x+rnd(-10,10), b.y+rnd(-10,10), 1));
        }
      }
    }

    // Danger zones
    for(const dz of this.dangerZones) dz.update(dt);

    // Coins
    for(let i=this.coins.length-1;i>=0;i--){
      this.coins[i].update(dt);
      if(!this.coins[i].alive) this.coins.splice(i,1);
    }

    // Drops
    for(let i=this.drops.length-1;i>=0;i--){
      const d = this.drops[i];
      d.update(dt);
      if(!d.alive) this.drops.splice(i,1);
    }

    // Wave logic
    if(this.waveState === 'active' && this.enemies.length === 0){
      this.waveState = 'complete';
      this.waveT = 8;
      this.waveText = `ONDA ${this.wave} COMPLETA`;
      this.player.hp = Math.min(this.player.maxHp, this.player.hp + 20);
      const idx = rndi(1, NUM_SLOTS-1);
      this.drops.push(new WeaponDrop(this.player.x + rnd(-100,100), this.player.y + rnd(-100,100), idx));
      this.drops.push(new HealthDrop(this.player.x + rnd(-100,100), this.player.y + rnd(-100,100), 30));
      // Bonus coins for clearing
      for(let i=0;i<6;i++){
        this.coins.push(new Coin(this.player.x+rnd(-80,80), this.player.y+rnd(-80,80), 1));
      }
      // Open shop
      this.shopItems = this.generateShopItems();
      this.shopOpen = true;
      this.slowMo = 0.6;
    }
    if(this.waveState === 'complete' && !this.levelUpOpen){
      this.waveT -= dt;
      if(this.waveT <= 0){
        this.shopOpen = false;
        this.startWave(this.wave + 1);
      }
    }

    if(this.waveTextT > 0) this.waveTextT -= dt;
    if(this.flashScreen > 0) this.flashScreen -= dt;

    // Ambient floating dust motes around the camera view
    if(Math.random() < 0.25){
      this.particles.spawn({
        x: this.camera.x + rnd(0, W), y: this.camera.y + rnd(0, H),
        vx: rnd(-12, 12), vy: rnd(-18, -6),
        life: rnd(2, 4), size: rnd(0.8, 2),
        color: 'rgba(180,180,220,0.5)', alpha: 0.35, glow: false, shrink: true
      });
    }
  }
  draw(){
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,W,H);
    ctx.save();
    if(this.camera.zoom !== 1){
      ctx.translate(W/2, H/2);
      ctx.scale(this.camera.zoom, this.camera.zoom);
      ctx.translate(-W/2, -H/2);
    }
    drawFloor(this.camera);
    drawBlood(this.camera);
    // Warm ambient light pool around the player (ground level)
    {
      const px = this.player.x - this.camera.x, py = this.player.y - this.camera.y;
      const lg = ctx.createRadialGradient(px, py, 20, px, py, 220);
      lg.addColorStop(0, 'rgba(255,240,200,0.10)');
      lg.addColorStop(0.6, 'rgba(255,230,180,0.04)');
      lg.addColorStop(1, 'rgba(255,230,180,0)');
      ctx.fillStyle = lg;
      ctx.fillRect(px-220, py-220, 440, 440);
    }
    // Danger zones (drawn on the floor)
    for(const dz of this.dangerZones) dz.draw(this.camera);
    // Obstacles
    for(const o of this.obstacles) o.draw(this.camera);
    // Barrels
    for(const b of this.barrels) b.draw(this.camera);
    // Coins
    for(const c of this.coins) c.draw(this.camera);
    // Drops
    for(const d of this.drops) d.draw(this.camera);
    // Enemies
    for(const e of this.enemies) e.draw(this.camera);
    // Player
    this.player.draw(this.camera);
    // Sniper laser sight
    if(this.player.weapon instanceof Sniper) this.player.weapon.drawLaserSight(this.player, this.camera);
    // Projectiles
    for(const p of this.projectiles) p.draw(this.camera);
    // Enemy projectiles
    drawEP(this.camera);
    // Particles
    this.particles.draw(this.camera);
    // Laser beam
    this.player.drawLaserBeam(this.camera);
    // Damage numbers
    drawDamage(this.camera);
    ctx.restore();
    // Darkness event overlay (after world, before HUD)
    if(this.eventWave === 'escuridao' && this.waveState === 'active'){
      const ps = { x: this.player.x - this.camera.x, y: this.player.y - this.camera.y };
      const grad = ctx.createRadialGradient(ps.x, ps.y, 60, ps.x, ps.y, 280);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(0.5, 'rgba(0,0,0,0.55)');
      grad.addColorStop(1, 'rgba(0,0,0,0.95)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    }
    // Vignette — darkens screen edges for depth
    {
      const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.45, W/2, H/2, Math.max(W,H)*0.75);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(0,0,10,0.45)');
      ctx.fillStyle = vg;
      ctx.fillRect(0,0,W,H);
    }
    // Low-HP red pulse at screen edges
    {
      const hpr = this.player.hp / this.player.maxHp;
      if(hpr < 0.35){
        const pulse = (0.5 + Math.sin(performance.now()/250)*0.5) * (1 - hpr/0.35);
        const rg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.7);
        rg.addColorStop(0, 'rgba(255,0,0,0)');
        rg.addColorStop(1, `rgba(180,0,0,${0.35*pulse})`);
        ctx.fillStyle = rg;
        ctx.fillRect(0,0,W,H);
      }
    }
    // Screen flash
    if(this.flashScreen > 0){
      ctx.fillStyle = `rgba(255,255,255,${clamp(this.flashScreen*5,0,0.7)})`;
      ctx.fillRect(0,0,W,H);
    }
    // HUD
    this.drawHUD();
    // Minimap additions: barrels and danger zones
    this.drawMinimapExtras();
    // Shop / level-up overlays (these handle their own click areas)
    this.uiClickAreas = [];
    if(this.levelUpOpen) this.drawLevelUpOverlay();
    else if(this.shopOpen) this.drawShopOverlay();
    // Custom crosshair (drawn last, above everything)
    this.drawCrosshair();
  }
  drawCrosshair(){
    const mx = mouse.x, my = mouse.y;
    const w = this.player.weapon;
    const col = w ? w.color : '#fff';
    const t = performance.now()/1000;
    // Expands while firing, breathes when idle
    const spread = mouse.down ? 12 : 7 + Math.sin(t*2)*1.5;
    ctx.save();
    ctx.translate(mx, my);
    if(this.levelUpOpen || this.shopOpen){
      // Pointer mode for menus
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.stroke();
      ctx.fillStyle = '#ffd700';
      ctx.beginPath(); ctx.arc(0, 0, 2, 0, TAU); ctx.fill();
      ctx.restore();
      return;
    }
    ctx.shadowBlur = 6; ctx.shadowColor = col;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    // 4 ticks
    ctx.beginPath();
    ctx.moveTo(0, -spread-6); ctx.lineTo(0, -spread);
    ctx.moveTo(0, spread); ctx.lineTo(0, spread+6);
    ctx.moveTo(-spread-6, 0); ctx.lineTo(-spread, 0);
    ctx.moveTo(spread, 0); ctx.lineTo(spread+6, 0);
    ctx.stroke();
    // Center dot
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, 1.5, 0, TAU); ctx.fill();
    // Special-ready ring
    if(w && w.specialT <= 0){
      ctx.globalAlpha = 0.5 + Math.sin(t*5)*0.3;
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, spread+11, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  }
  drawHUD(){
    // HP bar — rounded panel with gradient fill
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    roundRect(ctx, 15, 15, 230, 30, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1;
    roundRect(ctx, 15, 15, 230, 30, 8); ctx.stroke();
    const hpr = this.player.hp / this.player.maxHp;
    // Inner track
    ctx.fillStyle = '#1a0a0a';
    roundRect(ctx, 20, 20, 220, 20, 5); ctx.fill();
    // Gradient fill green→yellow→red, clipped to current HP
    if(hpr > 0){
      ctx.save();
      roundRect(ctx, 20, 20, 220*hpr, 20, 5); ctx.clip();
      const hg = ctx.createLinearGradient(20, 0, 240, 0);
      hg.addColorStop(0, '#dd2222');
      hg.addColorStop(0.4, '#dddd22');
      hg.addColorStop(0.75, '#22dd22');
      ctx.fillStyle = hg;
      ctx.fillRect(20, 20, 220, 20);
      // Glass shine on top half
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillRect(20, 20, 220, 8);
      ctx.restore();
    }
    // Heart icon (two arcs + point)
    ctx.save();
    ctx.shadowBlur = 6; ctx.shadowColor = '#ff4444';
    ctx.fillStyle = '#ff4455';
    ctx.beginPath();
    ctx.arc(27, 28, 4, Math.PI, 0);
    ctx.arc(35, 28, 4, Math.PI, 0);
    ctx.lineTo(31, 37);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
    ctx.font = 'bold 14px Courier New';
    ctx.fillStyle = '#000';
    ctx.fillText(`${Math.ceil(this.player.hp)}/${this.player.maxHp}`, 81, 36);
    ctx.fillStyle = '#fff';
    ctx.fillText(`${Math.ceil(this.player.hp)}/${this.player.maxHp}`, 80, 35);

    // Score - top center (rounded panel)
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(ctx, W/2-80, 12, 160, 50, 10); ctx.fill();

    ctx.lineWidth = 1;
    roundRect(ctx, W/2-80, 12, 160, 50, 10); ctx.stroke();
    ctx.font = 'bold 28px Courier New';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#000';
    ctx.fillText(`${this.score}`, W/2+2, 42);
    ctx.shadowBlur = 8; ctx.shadowColor = '#ffd700';
    ctx.fillStyle = '#ffd700';
    ctx.fillText(`${this.score}`, W/2, 40);
    ctx.shadowBlur = 0;
    ctx.font = '12px Courier New';
    ctx.fillStyle = '#888';
    ctx.fillText('SCORE', W/2, 55);

    // Wave - top right (rounded panel)
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(ctx, W-150, 12, 135, 50, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    roundRect(ctx, W-150, 12, 135, 50, 10); ctx.stroke();
    ctx.textAlign = 'right';
    ctx.font = 'bold 22px Courier New';
    ctx.fillStyle = '#ffd700';
    ctx.fillText(`ONDA ${this.wave}`, W-25, 35);
    ctx.font = '14px Courier New';
    ctx.fillStyle = '#ff6666';
    ctx.fillText(`☠ ${this.enemies.length}`, W-25, 55);
    ctx.textAlign = 'left';

    // Weapon bar bottom center
    const w = this.player.weapon;
    if(w){
      const bx = W/2 - 110, by = H - 78;
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      roundRect(ctx, bx, by, 220, 60, 10); ctx.fill();
      ctx.save();
      ctx.shadowBlur = w.golden ? 14 : 6; ctx.shadowColor = w.color;
      ctx.strokeStyle = w.color;
      ctx.lineWidth = 2;
      roundRect(ctx, bx, by, 220, 60, 10); ctx.stroke();
      ctx.restore();
      // Name
      ctx.font = 'bold 15px Courier New';
      ctx.fillStyle = w.color;
      ctx.textAlign = 'center';
      ctx.fillText(w.name.toUpperCase(), W/2+15, by+20);
      // Ammo
      ctx.font = 'bold 13px Courier New';
      if(w.unlimited){
        ctx.fillStyle = '#ffd700';
        ctx.fillText('∞ MUNIÇÃO', W/2+15, by+40);
      } else {
        const empty = w.ammo === 0;
        ctx.fillStyle = empty ? '#ff4444' : (w.ammo < w.maxAmmo*0.25 ? '#ffaa00' : '#fff');
        ctx.fillText(`${w.ammo}/${w.maxAmmo}`, W/2+15, by+40);
      }
      // Ammo bar mini
      if(!w.unlimited){
        ctx.fillStyle = '#222';
        ctx.fillRect(bx+60, by+45, 140, 6);
        ctx.fillStyle = w.color;
        ctx.fillRect(bx+60, by+45, 140 * (w.ammo/w.maxAmmo), 6);
      }
      // Special cooldown arc
      const cr = w.specialT/w.specialCD;
      ctx.beginPath();
      ctx.arc(bx + 25, by + 30, 18, -Math.PI/2, -Math.PI/2 + TAU*(1-cr));
      ctx.strokeStyle = w.color;
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.font = 'bold 11px Courier New';
      ctx.fillStyle = w.specialT <= 0 ? '#ffd700' : '#888';
      ctx.fillText('ESP', bx+25, by+34);
      ctx.textAlign = 'left';
      // Weapon slots (9)
      ctx.font = 'bold 10px Courier New';
      for(let i=0;i<NUM_SLOTS;i++){
        const slot = this.player.weapons[i];
        const sx = bx + 232 + i*22;
        const active = i===this.player.weaponIdx;
        ctx.fillStyle = slot ? (active?'#ffd700':'#444') : '#1a1a2a';
        ctx.fillRect(sx, by+10, 20, 40);
        if(slot){
          ctx.fillStyle = active?'#000':slot.color;
          ctx.fillText(i+1, sx+7, by+22);
          // Ammo mini
          ctx.font = '8px Courier New';
          ctx.fillStyle = active?'#000':'#aaa';
          if(slot.unlimited) ctx.fillText('∞', sx+7, by+34);
          else ctx.fillText(slot.ammo, sx+10-(''+slot.ammo).length*2, by+34);
          if(!slot.unlimited){
            // Mini ammo bar
            ctx.fillStyle = active?'#000':'#333';
            ctx.fillRect(sx+2, by+44, 16, 3);
            ctx.fillStyle = slot.color;
            ctx.fillRect(sx+2, by+44, 16*(slot.ammo/slot.maxAmmo), 3);
          }
          ctx.font = 'bold 10px Courier New';
        } else {
          ctx.fillStyle = '#333';
          ctx.fillText(i+1, sx+7, by+30);
        }
      }
    }

    // Boss HP bar
    const boss = this.enemies.find(e => e instanceof Boss);
    if(boss){
      const bx = W/2 - 250, by = 80;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(bx, by, 500, 30);
      const hpr2 = boss.hp/boss.maxHp;
      let bc = '#7b2d8b';
      if(hpr2 < 0.6) bc = '#ff8800';
      if(hpr2 < 0.3) bc = '#ff2200';
      ctx.fillStyle = bc;
      ctx.fillRect(bx+2, by+2, (500-4)*hpr2, 26);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(bx, by, 500, 30);
      ctx.font = 'bold 16px Courier New';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.fillText(`BOSS - TIER ${boss.tier}`, W/2, by+20);
      ctx.textAlign = 'left';
    }

    // Wave text — pop-in scale + glow
    if(this.waveState === 'complete' || this.waveTextT > 0){
      const popT = clamp((2 - this.waveTextT)*4, 0, 1);
      const popScale = this.waveTextT > 0 ? 0.6 + popT*0.4 + Math.sin(popT*Math.PI)*0.08 : 1;
      ctx.save();
      ctx.translate(W/2, H/2);
      ctx.scale(popScale, popScale);
      ctx.font = 'bold 56px Courier New';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillText(this.waveText, 3, 3);
      ctx.shadowBlur = 25; ctx.shadowColor = '#ffd700';
      ctx.fillStyle = '#ffd700';
      ctx.fillText(this.waveText, 0, 0);
      ctx.shadowBlur = 0;
      // Decorative side lines
      const tw = ctx.measureText(this.waveText).width;
      ctx.strokeStyle = 'rgba(255,215,0,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-tw/2 - 70, -18); ctx.lineTo(-tw/2 - 15, -18);
      ctx.moveTo(tw/2 + 15, -18); ctx.lineTo(tw/2 + 70, -18);
      ctx.stroke();
      ctx.restore();
      ctx.textAlign = 'center';
      if(this.waveState === 'complete'){
        // Countdown circle with soft backing disc
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.beginPath(); ctx.arc(W/2, H/2 + 70, 34, 0, TAU); ctx.fill();
        ctx.beginPath();
        ctx.arc(W/2, H/2 + 70, 30, -Math.PI/2, -Math.PI/2 + TAU*(1 - this.waveT/5));
        ctx.strokeStyle = '#ffd700';
        ctx.shadowBlur = 10; ctx.shadowColor = '#ffd700';
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.font = 'bold 28px Courier New';
        ctx.fillStyle = '#fff';
        ctx.fillText(Math.ceil(this.waveT), W/2, H/2+80);
      }
      ctx.textAlign = 'left';
    }

    // Minimap — rounded, with player view cone and pulsing boss dots
    const mmS = 150;
    const mmX = W - mmS - 15, mmY = H - mmS - 15;
    ctx.fillStyle = 'rgba(5,5,15,0.75)';
    roundRect(ctx, mmX, mmY, mmS, mmS, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 2;
    roundRect(ctx, mmX, mmY, mmS, mmS, 8); ctx.stroke();
    ctx.save();
    roundRect(ctx, mmX, mmY, mmS, mmS, 8); ctx.clip();
    const scale = mmS / MAP_W;
    ctx.fillStyle = '#5a3a2a';
    for(const o of this.obstacles){
      ctx.fillRect(mmX + o.x*scale, mmY + o.y*scale, o.w*scale, o.h*scale);
    }
    const mmPulse = 0.6 + Math.sin(performance.now()/200)*0.4;
    for(const e of this.enemies){
      const isBig = e instanceof Boss || e instanceof MiniBossAssassin || e instanceof MiniBossGiantExploder;
      ctx.fillStyle = e instanceof Boss ? '#ff00ff' : (isBig ? '#ffaa00' : '#ff3333');
      const ms = isBig ? 3 + mmPulse*3 : 2;
      ctx.fillRect(mmX + e.x*scale - ms/2, mmY + e.y*scale - ms/2, ms, ms);
    }
    // Player view-direction cone
    const pmx = mmX + this.player.x*scale, pmy = mmY + this.player.y*scale;
    ctx.fillStyle = 'rgba(80,220,80,0.25)';
    ctx.beginPath();
    ctx.moveTo(pmx, pmy);
    ctx.arc(pmx, pmy, 14, this.player.aimAng - 0.5, this.player.aimAng + 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 5; ctx.shadowColor = '#22dd22';
    ctx.fillStyle = '#22ff22';
    ctx.fillRect(pmx - 2, pmy - 2, 4, 4);
    ctx.shadowBlur = 0;
    ctx.restore();

    // Dash stamina indicator (3+ charges)
    const p = this.player;
    ctx.font = 'bold 10px Courier New';
    ctx.fillStyle = '#fff';
    ctx.fillText('DASH (SHIFT)', 15, 67);
    const chargeW = 30, chargeH = 10, chargeGap = 4;
    for(let i=0;i<p.dashChargesMax;i++){
      const cx = 15 + i*(chargeW+chargeGap);
      const cy = 70;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(cx, cy, chargeW, chargeH);
      if(i < p.dashCharges){
        ctx.fillStyle = '#88ccff';
        ctx.fillRect(cx+1, cy+1, chargeW-2, chargeH-2);
      } else if(i === p.dashCharges){
        // Currently regenerating
        const fillT = 1 - p.dashRegenT/p.dashRegenTime;
        ctx.fillStyle = '#446688';
        ctx.fillRect(cx+1, cy+1, (chargeW-2)*fillT, chargeH-2);
      }
      ctx.strokeStyle = '#88aaff';
      ctx.lineWidth = 1;
      ctx.strokeRect(cx, cy, chargeW, chargeH);
    }

    // Coins + Level + XP
    const yc = 95;
    // Coins
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(15, yc, 120, 22);
    ctx.fillStyle = '#ffd700';
    ctx.beginPath(); ctx.arc(28, yc+11, 7, 0, TAU); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 9px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('$', 28, yc+14);
    ctx.textAlign = 'left';
    ctx.font = 'bold 14px Courier New';
    ctx.fillStyle = '#ffd700';
    ctx.fillText(p.coins, 42, yc+15);

    // Level + XP bar
    const yl = yc + 28;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(15, yl, 200, 22);
    ctx.fillStyle = '#222';
    ctx.fillRect(45, yl+5, 165, 12);
    const xpr = p.xp / p.xpToNext;
    ctx.fillStyle = '#aa44ff';
    ctx.fillRect(45, yl+5, 165*xpr, 12);
    ctx.shadowBlur = 6; ctx.shadowColor = '#aa44ff';
    ctx.fillStyle = '#cc66ff';
    ctx.fillRect(45, yl+5, 165*xpr, 4);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 14px Courier New';
    ctx.fillStyle = '#ffd700';
    ctx.fillText('Lv', 18, yl+15);
    ctx.fillText(p.level, 32, yl+15);
    ctx.font = 'bold 10px Courier New';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(`${Math.floor(p.xp)}/${p.xpToNext}`, 127, yl+15);
    ctx.textAlign = 'left';
    // Event wave banner
    if(this.eventWave && this.waveState === 'active'){
      const labels = { horda:'⚡ HORDA RÁPIDA', tanques:'⚙ INVASÃO DE TANQUES', escuridao:'☾ ESCURIDÃO' };
      const colors = { horda:'#ff44aa', tanques:'#ff8800', escuridao:'#7744ff' };
      ctx.font = 'bold 18px Courier New';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(W/2 - 160, 70, 320, 26);
      ctx.fillStyle = colors[this.eventWave];
      ctx.fillText(labels[this.eventWave], W/2, 89);
      ctx.textAlign = 'left';
    }
  }
  drawMinimapExtras(){
    const mmS = 150;
    const mmX = W - mmS - 15, mmY = H - mmS - 15;
    const scale = mmS / MAP_W;
    // Barrels
    for(const b of this.barrels){
      if(!b.alive) continue;
      ctx.fillStyle = '#ff4400';
      ctx.fillRect(mmX + b.x*scale - 1, mmY + b.y*scale - 1, 3, 3);
    }
    // Danger zones
    for(const dz of this.dangerZones){
      ctx.fillStyle = dz.type === 'lava' ? 'rgba(255,68,0,0.6)' : 'rgba(136,255,0,0.5)';
      ctx.beginPath();
      ctx.arc(mmX + dz.x*scale, mmY + dz.y*scale, dz.r*scale, 0, TAU);
      ctx.fill();
      if(dz.loot && !dz.lootCollected){
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(mmX + dz.x*scale - 1, mmY + dz.y*scale - 1, 2, 2);
      }
    }
  }
  drawShopOverlay(){
    // Semi-transparent backdrop along bottom
    const cardW = 180, cardH = 160, gap = 16;
    const totalW = cardW*4 + gap*3;
    const startX = W/2 - totalW/2;
    const startY = H/2 - cardH/2 - 20;
    // Title
    ctx.font = 'bold 36px Courier New';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.9)';
    ctx.fillRect(W/2 - 200, startY - 70, 400, 50);
    ctx.fillStyle = '#ffd700';
    ctx.fillText('🛒 LOJA', W/2, startY - 35);
    ctx.font = '14px Courier New';
    ctx.fillStyle = '#fff';
    ctx.fillText(`Moedas: ${this.player.coins}  ·  Próxima onda em ${Math.ceil(this.waveT)}s`, W/2, startY - 15);
    // Cards
    for(let i=0;i<this.shopItems.length;i++){
      const item = this.shopItems[i];
      const x = startX + i*(cardW+gap);
      const y = startY;
      const canAfford = this.player.coins >= item.cost;
      const hovered = mouse.x>=x && mouse.x<=x+cardW && mouse.y>=y && mouse.y<=y+cardH;
      // Card BG
      ctx.fillStyle = item.bought ? 'rgba(40,40,40,0.95)' : (hovered && canAfford ? 'rgba(40,30,10,0.95)' : 'rgba(20,20,30,0.9)');
      ctx.fillRect(x, y, cardW, cardH);
      ctx.strokeStyle = item.bought ? '#444' : (canAfford ? item.color : '#555');
      ctx.lineWidth = hovered && canAfford && !item.bought ? 4 : 2;
      ctx.strokeRect(x, y, cardW, cardH);
      // Item color block (icon area)
      ctx.fillStyle = item.color + (item.bought ? '44' : 'cc');
      ctx.fillRect(x + 20, y + 20, cardW - 40, 50);
      // Label
      ctx.font = 'bold 14px Courier New';
      ctx.fillStyle = item.bought ? '#666' : '#fff';
      ctx.fillText(item.label, x + cardW/2, y + 95);
      // Cost or BOUGHT
      ctx.font = 'bold 18px Courier New';
      if(item.bought){
        ctx.fillStyle = '#666';
        ctx.fillText('COMPRADO', x + cardW/2, y + 130);
      } else {
        ctx.fillStyle = canAfford ? '#ffd700' : '#aa6644';
        ctx.fillText(`${item.cost} 🪙`, x + cardW/2, y + 130);
      }
      // Click area
      this.uiClickAreas.push({ x, y, w:cardW, h:cardH, action:()=>this.buyShopItem(i), enabled: canAfford && !item.bought });
    }
    // Close button (skip)
    const cbx = W/2 - 80, cby = startY + cardH + 30;
    const cbHover = mouse.x>=cbx && mouse.x<=cbx+160 && mouse.y>=cby && mouse.y<=cby+36;
    ctx.fillStyle = cbHover ? '#444' : '#222';
    ctx.fillRect(cbx, cby, 160, 36);
    ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
    ctx.strokeRect(cbx, cby, 160, 36);
    ctx.font = 'bold 14px Courier New';
    ctx.fillStyle = '#fff';
    ctx.fillText('PRÓXIMA ONDA →', W/2, cby + 23);
    this.uiClickAreas.push({ x:cbx, y:cby, w:160, h:36, action:()=>{ this.waveT = 0; }, enabled:true });
    ctx.textAlign = 'left';
  }
  drawLevelUpOverlay(){
    // Dim background
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,W,H);
    // Title
    ctx.font = 'bold 48px Courier New';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd700';
    ctx.shadowBlur = 20; ctx.shadowColor = '#ffd700';
    ctx.fillText('NÍVEL '+this.player.level+'!', W/2, H/2 - 160);
    ctx.shadowBlur = 0;
    ctx.font = '18px Courier New';
    ctx.fillStyle = '#fff';
    ctx.fillText('Escolha um upgrade', W/2, H/2 - 130);
    // Cards
    const cardW = 230, cardH = 200, gap = 20;
    const totalW = cardW*3 + gap*2;
    const startX = W/2 - totalW/2;
    const y = H/2 - 80;
    for(let i=0;i<this.levelUpOptions.length;i++){
      const opt = this.levelUpOptions[i];
      const x = startX + i*(cardW+gap);
      const hovered = mouse.x>=x && mouse.x<=x+cardW && mouse.y>=y && mouse.y<=y+cardH;
      ctx.fillStyle = hovered ? 'rgba(50,40,20,0.97)' : 'rgba(20,20,30,0.95)';
      ctx.fillRect(x, y, cardW, cardH);
      ctx.strokeStyle = opt.color;
      ctx.lineWidth = hovered ? 5 : 3;
      ctx.strokeRect(x, y, cardW, cardH);
      // Color icon block
      const grad = ctx.createLinearGradient(x, y+20, x, y+90);
      grad.addColorStop(0, opt.color);
      grad.addColorStop(1, opt.color + '44');
      ctx.fillStyle = grad;
      ctx.fillRect(x + 30, y + 30, cardW - 60, 60);
      // Label
      ctx.font = 'bold 18px Courier New';
      ctx.fillStyle = opt.color;
      ctx.shadowBlur = hovered ? 8 : 0; ctx.shadowColor = opt.color;
      ctx.fillText(opt.label, x + cardW/2, y + 125);
      ctx.shadowBlur = 0;
      ctx.font = '13px Courier New';
      ctx.fillStyle = '#ccc';
      ctx.fillText(opt.desc, x + cardW/2, y + 150);
      ctx.font = 'bold 12px Courier New';
      ctx.fillStyle = '#888';
      ctx.fillText(`Tecla ${i+1}`, x + cardW/2, y + 180);
      this.uiClickAreas.push({ x, y, w:cardW, h:cardH, action:()=>this.pickLevelUp(i), enabled:true });
    }
    ctx.textAlign = 'left';
  }
}

// ============================================================
// MAIN LOOP
// ============================================================
let game;
let lastT = 0;
function loop(t){
  const dt = Math.min(0.033, (t - lastT)/1000);
  lastT = t;
  if(game){
    // Update mouse world coords
    mouse.wx = mouse.x/game.camera.zoom + game.camera.x;
    mouse.wy = mouse.y/game.camera.zoom + game.camera.y;
    if(game.camera.zoom !== 1){
      // Adjust for zoom-centered transform
      mouse.wx = (mouse.x - W/2)/game.camera.zoom + W/2 + game.camera.x;
      mouse.wy = (mouse.y - H/2)/game.camera.zoom + H/2 + game.camera.y;
    }
    // Handle UI clicks BEFORE game update (so they don't fire weapons)
    if(mouse.pressed && (game.shopOpen || game.levelUpOpen)){
      for(const area of game.uiClickAreas){
        if(area.enabled && mouse.x>=area.x && mouse.x<=area.x+area.w && mouse.y>=area.y && mouse.y<=area.y+area.h){
          area.action();
          mouse.pressed = false;
          mouse.down = false;
          break;
        }
      }
      // Consume click even if missed UI to avoid firing
      mouse.pressed = false;
      mouse.down = false;
    }
    game.update(dt);
    game.draw();
  }
  requestAnimationFrame(loop);
}

document.getElementById('startBtn').addEventListener('click', ()=>{
  document.getElementById('overlay').classList.add('hidden');
  document.querySelector('#overlay h1').textContent = 'JOGUINHO — TOP-DOWN ARENA';
  document.querySelector('#overlay h1').style.color = '#ffd700';
  game = new Game();
});
requestAnimationFrame(loop);
</script>
